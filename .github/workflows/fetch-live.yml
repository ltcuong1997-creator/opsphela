name: Lấy bản web đang chạy về nhánh

# Tạm thời: tải các file trang web từ opsphela.web.app (bản đang live) và commit vào chính
# nhánh này, để repo khớp với bản đã deploy từ máy. Không chạy trên main, không deploy.
on:
  push:
    branches: [claude/ecstatic-volta-ary5jx]
    paths: ['.github/workflows/fetch-live.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Tải file từ web live
        run: |
          set -e
          for f in index.html d05-core.js logo.png vn-provinces.json; do
            code=$(curl -sS -L -o "public/$f.new" -w '%{http_code}' -H 'Cache-Control: no-cache' "https://opsphela.web.app/$f?nocache=$GITHUB_RUN_ID")
            echo "$f -> HTTP $code, $(wc -c < public/$f.new) bytes"
            if [ "$code" = "200" ]; then mv "public/$f.new" "public/$f"; else rm -f "public/$f.new"; fi
          done
          # rewrite ** -> index.html: file không tồn tại sẽ trả về index.html, đừng ghi đè nhầm
          for f in d05-core.js vn-provinces.json logo.png; do
            if head -c 200 "public/$f" | grep -qi '<!doctype html'; then echo "$f trả về index.html -> giữ bản repo"; git checkout -- "public/$f"; fi
          done
          git rm -q .github/workflows/fetch-live.yml
          git status --short
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add -A public
          git commit -m "Đồng bộ public/ với bản web đang live (opsphela.web.app) - bản deploy từ máy"
          git push
