name: Deploy web lên Firebase Hosting

# Push lên main có đổi trang web (public/) hoặc cấu hình hosting -> tự deploy bản live
# opsphela.web.app. Bấm "Run workflow" trên tab Actions để deploy tay.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-hosting.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Hai lần push sát nhau: lần sau huỷ lần trước, chỉ bản mới nhất lên live.
concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Service account cần quyền "Firebase Hosting Admin" (và "API Keys Viewer") trên
      # project opsphela - tài khoản chỉ ghi Firestore cho sync-report thì deploy sẽ báo 403.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: opsphela
          channelId: live
