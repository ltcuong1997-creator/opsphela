/* ===================== TRANG DATA =====================
   Để đối soát: đã nạp tới ngày nào, ngày nào thiếu / ít cửa hàng bất thường, và bảng từng
   dòng cửa hàng × ngày lọc được theo năm / tháng / ngày / chi nhánh, xuất CSV mở bằng Excel. */
const PAGE_ROWS = 100;

function downloadCsv(name, rows) {
  const esc = (v) => (/[",\n;]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
  /* BOM để Excel đọc đúng tiếng Việt */
  const csv = '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function DataPage({ data }) {
  const { cur, range } = data;
  const [f, setF] = useState({ y: '', m: '', d: '', q: '' });
  const [sort, setSort] = useState({ k: 'date', desc: true });
  const [limit, setLimit] = useState(PAGE_ROWS);
  const set = (p) => { setF(x => ({ ...x, ...p })); setLimit(PAGE_ROWS); };

  /* ---- Tình trạng nạp: mỗi ngày trong khoảng một ô ----
     Ít cửa hàng hơn 80% mức thường (trung vị) là đáng ngờ: có thể file xuất thiếu. */
  const cov = useMemo(() => {
    const list = [];
    for (let k = range.from; k <= range.to; k = dAdd(k, 1)) list.push(k);
    const counts = list.map(k => (cur.days[k] ? cur.days[k].storeCount : 0)).filter(Boolean).sort((a, b) => a - b);
    const med = counts.length ? counts[Math.floor(counts.length / 2)] : 0;
    const cells = list.map(k => {
      const d = cur.days[k];
      return { k, d, st: !d ? 'miss' : d.storeCount < med * 0.8 ? 'low' : 'ok' };
    });
    const have = cells.filter(c => c.d).map(c => c.k);
    return { cells, med, missing: cells.filter(c => c.st === 'miss').map(c => c.k), low: cells.filter(c => c.st === 'low').map(c => c.k), latest: have[have.length - 1] || null };
  }, [cur, range]);

  const opts = useMemo(() => ({
    y: [...new Set(cur.rows.map(r => r.date.slice(0, 4)))].sort(),
    m: [...new Set(cur.rows.filter(r => !f.y || r.date.startsWith(f.y)).map(r => r.date.slice(5, 7)))].sort(),
    d: [...new Set(cur.rows.filter(r => (!f.y || r.date.startsWith(f.y)) && (!f.m || r.date.slice(5, 7) === f.m)).map(r => r.date.slice(8, 10)))].sort(),
  }), [cur, f.y, f.m]);

  const rows = useMemo(() => {
    const q = noAccent(f.q.trim());
    const out = cur.rows.filter(r =>
      (!f.y || r.date.slice(0, 4) === f.y) && (!f.m || r.date.slice(5, 7) === f.m) && (!f.d || r.date.slice(8, 10) === f.d)
      && (!q || noAccent(r.name).includes(q) || String(r.id).includes(q)))
      .map(r => ({ ...r, avg: r.bills ? r.revenue / r.bills : 0 }));
    const dir = sort.desc ? -1 : 1;
    out.sort((a, b) => {
      const x = a[sort.k], y = b[sort.k];
      const c = typeof x === 'string' ? x.localeCompare(y, 'vi') : x - y;
      return (c || a.date.localeCompare(b.date) || String(a.name).localeCompare(b.name, 'vi')) * dir;
    });
    return out;
  }, [cur, f, sort]);

  const tot = rows.reduce((a, r) => ({ revenue: a.revenue + r.revenue, bills: a.bills + r.bills, quantity: a.quantity + r.quantity }), { revenue: 0, bills: 0, quantity: 0 });
  const nDays = new Set(rows.map(r => r.date)).size, nStores = new Set(rows.map(r => r.id)).size;

  const Th = ({ k, r, children }) => (
    <th className={cls('sort', r && 'r')} style={sort.k === k ? { color: 'var(--txt)' } : null}
      onClick={() => setSort(s => ({ k, desc: s.k === k ? !s.desc : k !== 'name' }))}>
      {children}{sort.k === k ? (sort.desc ? ' ↓' : ' ↑') : ''}
    </th>
  );
  const exportCsv = () => downloadCsv('phela-d05-' + range.from + '_' + range.to + '.csv', [
    ['Năm', 'Tháng', 'Ngày', 'Thứ', 'Mã CH', 'Chi nhánh', 'Doanh thu', 'Hoá đơn', 'Số món', 'TB/hoá đơn'],
    ...rows.map(r => [r.date.slice(0, 4), r.date.slice(5, 7), r.date.slice(8, 10), wdOf(r.date), r.id, r.name, n0(r.revenue), r.bills, r.quantity, n0(r.avg)]),
  ]);

  return (
    <>
      <div className="stats">
        <Stat hero label="Đã nạp tới ngày" icon={<Ic.cal size={14} />} value={cov.latest ? dFull(cov.latest) : '—'}
          sub={cur.last ? 'lần ghi gần nhất ' + stamp(cur.last) : null} />
        <Stat label="Số ngày có dữ liệu" icon={<Ic.table size={14} />} value={(cov.cells.length - cov.missing.length) + ' / ' + cov.cells.length}
          sub={cov.missing.length ? <span className="dn">thiếu {cov.missing.length} ngày</span> : <span className="up">đủ tất cả các ngày</span>} />
        <Stat label="Cửa hàng / ngày (thường)" icon={<Ic.store size={14} />} value={money(cov.med)}

/* ===================== TRANG CHI NHÁNH (Region/City/AM) ===================== */
/* "21.0278, 105.8342" dán thẳng từ Google Maps. Chỉ nhận cặp số đầu tiên và phải nằm
   trong khoảng vĩ độ/kinh độ hợp lệ, gõ nhầm thì bỏ qua chứ không ghi bậy lên bản đồ. */
function parseCoord(s) {
  const nums = String(s || '').match(/-?\d+(?:\.\d+)?/g);
  if (!nums || nums.length < 2) return null;
  const lat = +nums[0], lng = +nums[1];
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

/* Danh sách AM / Thành phố quản lý bằng dấu + / − (lưu ở config/lists). "−" một tên đang
   được gán thì các chi nhánh đó bị xoá ô tương ứng - hiện thành thay đổi chờ lưu để xem lại. */
function ListEditor({ label, items, counts, onAdd, onRemove }) {
  const [adding, setAdding] = useState(false);
  const [val, setVal] = useState('');
  const commit = () => { const v = val.trim(); if (v) onAdd(v); setVal(''); setAdding(false); };
  return (
    <div className="lst">
      <b>{label}</b>
      {items.map((x) => (
        <span key={x} className="lst-i">{x}{counts[x] ? <small>{counts[x]}</small> : null}
          <button title={'Bớt ' + x} onClick={() => onRemove(x)}>−</button>
        </span>
      ))}
      {adding
        ? <input className="adm-in lst-new" autoFocus value={val} placeholder={'Tên ' + label.toLowerCase() + '…'}
            onChange={(e) => setVal(e.target.value)} onBlur={commit}
            onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setVal(''); setAdding(false); } }} />
        : <button className="lst-add" title={'Thêm ' + label.toLowerCase()} onClick={() => setAdding(true)}>+</button>}
    </div>
  );
}

const REGIONS = ['Miền Bắc', 'Miền Trung', 'Miền Nam'];

function StoreMetaPage({ data }) {
  const { storesMeta, saveStores, metaBusy, lists } = data;
  const [edits, setEdits] = useState({});
  const [listEdit, setListEdit] = useState(null); // { am?: [...], city?: [...] } khi đang sửa danh sách
  const [reloadKey, setReloadKey] = useState(0);
  const [q, setQ] = useState('');
  const [view, setView] = useState('all'); // all | todo | off
  const all = useMemo(() => [...(storesMeta || [])].sort((a, b) => storeShort(a.storeName || '').localeCompare(storeShort(b.storeName || ''), 'vi')), [storesMeta]);
  const cur = (r, k) => (edits[r.id] && k in edits[r.id] ? edits[r.id][k] : r[k]);
  const isTodo = (r) => !r.region || !r.city || r.lat == null;
  const todo = all.filter(isTodo);
  const off = all.filter((r) => cur(r, 'hidden'));
  const rows = useMemo(() => {
    const k = noAccent(q.trim());
    return all.filter((r) => (view !== 'todo' || isTodo(r)) && (view !== 'off' || cur(r, 'hidden'))
      && (!k || noAccent(r.storeName).includes(k) || String(r.id).includes(k)));
  }, [all, q, view, edits]);

  /* Danh sách: lấy từ config/lists; chưa lưu lần nào thì dựng từ các giá trị đang gán */
  const baseList = (f) => {
    const saved = lists && Array.isArray(lists[f]) ? lists[f] : null;
    const src = saved || (storesMeta || []).map((x) => x[f]).filter(Boolean);
    return [...new Set(src)].sort((a, b) => a.localeCompare(b, 'vi'));
  };
  const listOf = (f) => (listEdit && listEdit[f]) || baseList(f);
  const counts = (f) => {
    const c = {};
    for (const r of all) { const v = cur(r, f); if (v) c[v] = (c[v] || 0) + 1; }
    return c;
  };
  const addItem = (f, v) => {
    const l = listOf(f);
    if (!l.includes(v)) setListEdit((le) => ({ ...(le || {}), [f]: [...l, v].sort((a, b) => a.localeCompare(b, 'vi')) }));
  };
  const removeItem = (f, v) => {
    setListEdit((le) => ({ ...(le || {}), [f]: listOf(f).filter((x) => x !== v) }));
    setEdits((e) => {
      const out = { ...e };
      for (const r of all) if (cur(r, f) === v) out[r.id] = { ...(out[r.id] || {}), [f]: '' };
      return out;
    });
  };

  const setField = (storeId, field, val) => setEdits((e) => ({ ...e, [storeId]: { ...(e[storeId] || {}), [field]: val } }));
  const dirtyCount = Object.keys(edits).length + (listEdit ? 1 : 0);

  const save = async () => {
    const list = Object.entries(edits).map(([storeId, patch]) => {
      const base = all.find((r) => r.id === storeId) || {};
      const out = {
        storeId, storeName: base.storeName,
        region: patch.region ?? base.region ?? '', city: patch.city ?? base.city ?? '', am: patch.am ?? base.am ?? '',
      };
      if ('hidden' in patch) out.hidden = !!patch.hidden;
      if ('coord' in patch) {
        const c = parseCoord(patch.coord);
        if (c) { out.lat = c.lat; out.lng = c.lng; }
        else if (!String(patch.coord).trim()) { out.lat = null; out.lng = null; }
      }
      return out;
    });
    await saveStores(list, listEdit ? { am: listOf('am'), city: listOf('city') } : null);
    setEdits({});
    setListEdit(null);
    setReloadKey((k) => k + 1);
  };

  /* Ô chọn: danh sách + giá trị đang gán (lỡ nằm ngoài danh sách thì vẫn hiện, không mất) */
  const pick = (r, f, options) => {
    const v = cur(r, f) || '';
    const opts = v && !options.includes(v) ? [v, ...options] : options;
    return (
      <select className="adm-in" value={v} onChange={(ev) => setField(r.id, f, ev.target.value)}>
        <option value="">—</option>
        {opts.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    );
  };

  if (!all.length) return <div className="empty">Chưa có cửa hàng nào — chạy đồng bộ D05 ít nhất 1 lần trước (script tự tạo danh mục).</div>;
  const amList = listOf('am'), cityList = listOf('city');
  return (
    <div className="card">
      {LOCAL && <div className="banner">Chế độ xem trước local: đọc được danh mục nhưng chưa lưu được — mở bản triển khai thật (đăng nhập) để lưu.</div>}
      <div className="card-h">
        <div>
          <h3>{all.length} cửa hàng{off.length ? ' · ' + off.length + ' đang tắt' : ''}</h3>
          <p>Gán Region / City / AM, toạ độ, và bật/tắt chi nhánh trên báo cáo</p>
        </div>
        <div className="sp">
          <button className="btn sm pri" disabled={!dirtyCount || LOCAL || metaBusy} onClick={save}>
            {metaBusy ? 'Đang lưu…' : 'Lưu thay đổi' + (dirtyCount ? ' (' + dirtyCount + ')' : '')}
          </button>
        </div>
      </div>
      <div className="lsts">
        <ListEditor label="AM" items={amList} counts={counts('am')} onAdd={(v) => addItem('am', v)} onRemove={(v) => removeItem('am', v)} />
        <ListEditor label="Thành phố" items={cityList} counts={counts('city')} onAdd={(v) => addItem('city', v)} onRemove={(v) => removeItem('city', v)} />
      </div>
      <div className="flt">
        <input className="inp grow" placeholder="Tìm chi nhánh hoặc mã cửa hàng…" value={q} onChange={(e) => setQ(e.target.value)} />
        <button className={cls('btn sm', view === 'todo' && 'pri')} onClick={() => setView((v) => (v === 'todo' ? 'all' : 'todo'))}>Còn thiếu ({todo.length})</button>
        <button className={cls('btn sm', view === 'off' && 'pri')} onClick={() => setView((v) => (v === 'off' ? 'all' : 'off'))}>Đang tắt ({off.length})</button>
        <span className="hint">Toạ độ: Google Maps → chuột phải vào cửa hàng → bấm cặp số → dán vào ô.</span>
      </div>
      {!rows.length ? <div className="empty">Không có dòng nào khớp.</div> : (
        <div className="scroll-x">
          <table className="tb tb-compact" key={reloadKey}>
            <thead><tr><th>Báo cáo</th><th>Mã CH</th><th>Chi nhánh</th><th>Region</th><th>City</th><th>AM</th><th>Toạ độ (lat, lng)</th></tr></thead>
            <tbody>
              {rows.map((r) => {
                const e = edits[r.id] || {};
                const on = !cur(r, 'hidden');
                const dot = (k) => (k in e ? <span className="dirty-dot" /> : null);
                return (
                  <tr key={r.id} className={on ? '' : 'row-off'}>
                    <td><button className={cls('sw', on && 'on')} role="switch" aria-checked={on}
                      title={on ? 'Đang hiện trên báo cáo — bấm để tắt' : 'Đang tắt — bấm để hiện lại'}
                      onClick={() => setField(r.id, 'hidden', on)}><i /></button>{dot('hidden')}</td>
                    <td className="mono" style={{ color: 'var(--txt-3)' }}>{r.id}</td>
                    <td className="nm" title={r.storeName}>{storeShort(r.storeName)}</td>
                    <td>{pick(r, 'region', REGIONS)}{dot('region')}</td>
                    <td>{pick(r, 'city', cityList)}{dot('city')}</td>
                    <td>{pick(r, 'am', amList)}{dot('am')}</td>
                    <td style={{ minWidth: 150 }}>
                      <input className="adm-in mono" placeholder="21.0278, 105.8342"
                        defaultValue={r.lat != null && r.lng != null ? r.lat + ', ' + r.lng : ''}
                        onChange={(ev) => setField(r.id, 'coord', ev.target.value)} />
                      {'coord' in e && (parseCoord(e.coord) || !e.coord.trim() ? <span className="dirty-dot" /> : <span className="match-bad" style={{ fontSize: 11 }}> sai định dạng</span>)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function TargetPage({ data }) {
  const { storesMeta, targets, saveTargets, metaBusy } = data;
  const [parsed, setParsed] = useState([]);
  const [error, setError] = useState('');

  const storesByNorm = useMemo(() => {
    const m = {};
    for (const s of storesMeta || []) {
      m[noAccent(storeShort(s.storeName || '').trim())] = s.id;
      m[noAccent((s.storeName || '').trim())] = s.id;
    }
    return m;
  }, [storesMeta]);

  const onFile = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setError('');
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: null });
      const out = rows.map((r, i) => {
        const storeName = String(r['Tên chi nhánh'] || '').trim();
        return { i, year: toNum(r['Năm']), month: toNum(r['Tháng']), storeName, target: toNum(r['Target']), storeId: storesByNorm[noAccent(storeName)] || null };
      }).filter((r) => r.storeName || r.target);
      if (!out.length) throw new Error('Không đọc được dòng nào — kiểm tra file có đủ cột Tháng, Năm, Tên chi nhánh, Target.');
      setParsed(out);
    } catch (ex) { setError(ex.message); }
  };

  const setRowStore = (i, storeId) => setParsed((p) => p.map((r) => (r.i === i ? { ...r, storeId } : r)));
  const matchedCount = parsed.filter((r) => r.storeId && r.year && r.month).length;
  const storeName = (id) => storeShort((((storesMeta || []).find((s) => s.id === id)) || {}).storeName || '');

  const save = async () => {
    const list = parsed.filter((r) => r.storeId && r.year && r.month).map((r) => ({
      storeId: r.storeId, storeName: storeName(r.storeId) || r.storeName, year: r.year, month: r.month, target: r.target,
    }));
    await saveTargets(list);
    setParsed([]);
  };


  return (
    <>
      {LOCAL && <div className="banner">Chế độ xem trước local: đọc được Target đã có nhưng chưa lưu được — mở bản triển khai thật (đăng nhập) để lưu.</div>}
      <div className="card">
        <div className="card-h"><div><h3>Nạp Target</h3><p>File Excel/CSV có cột Tháng, Năm, Tên chi nhánh, Target</p></div></div>
        <div className="card-b">
          <label className="upl-box">
            <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} />
            <Ic.up size={22} style={{ margin: '0 auto 8px', color: 'var(--brand)' }} />
            <div style={{ fontWeight: 600 }}>Bấm để chọn file Excel/CSV</div>
            <div className="hint">Cột: Tháng, Năm, Tên chi nhánh, Target</div>
          </label>
          {error && <div className="err" style={{ marginTop: 12 }}>{error}</div>}
        </div>
        {!!parsed.length && (
          <>
            <div className="flt">
              <span>{parsed.length} dòng · <span className="match-ok">{matchedCount} khớp cửa hàng</span>
                {matchedCount < parsed.length && <span> · <span className="match-bad">{parsed.length - matchedCount} chưa khớp, chọn tay bên dưới</span></span>}
              </span>
              <span style={{ marginLeft: 'auto' }}>
                <button className="btn sm pri" disabled={!matchedCount || LOCAL || metaBusy} onClick={save}>{metaBusy ? 'Đang lưu…' : 'Lưu ' + matchedCount + ' dòng'}</button>
              </span>
            </div>
            <div className="scroll-x">
              <table className="tb">
                <thead><tr><th>Tháng</th><th>Năm</th><th>Tên chi nhánh (file)</th><th className="r">Target</th><th>Khớp cửa hàng</th></tr></thead>
                <tbody>
                  {parsed.map((r) => (
                    <tr key={r.i}>
                      <td>{r.month || '—'}</td><td>{r.year || '—'}</td><td>{r.storeName}</td>
                      <td className="r">{money(r.target)}</td>
                      <td>
                        {r.storeId ? <span className="match-ok">✓ {storeName(r.storeId)}</span> : (
                          <select className="inp" style={{ width: 'auto' }} value="" onChange={(e) => setRowStore(r.i, e.target.value)}>
                            <option value="">— chọn cửa hàng —</option>
                            {(storesMeta || []).map((s) => <option key={s.id} value={s.id}>{storeShort(s.storeName)}</option>)}
                          </select>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </>
        )}
      </div>

      <TargetGrid storesMeta={storesMeta} targets={targets} saveTargets={saveTargets} metaBusy={metaBusy} />
    </>
  );
}

/* ===================== NẠP FILE D05 TỪ TRÌNH DUYỆT ===================== */
/* Làm y như script (sync/lib.js writeChanged) nhưng chạy trên web: đọc file D05 tải từ Fabi
   bằng CHÍNH lõi public/d05-core.js (window.D05), so hash từng cửa hàng với syncState, chỉ
   ghi cửa hàng có số đổi, rồi dựng lại d05Days + d05ItemStores của ngày đó. Hash cùng công
   thức (sha1, 16 ký tự) nên lần đồng bộ tự động sau không ghi lại những gì đã nạp tay. */
async function sha16(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
}
/* Firestore web SDK không nhận undefined - làm sạch giống cách script ghi (JSON thuần) */
const plain = (o) => JSON.parse(JSON.stringify(o));

async function importD05File(file, storesMeta, log) {
  const D = window.D05;
  if (!D) throw new Error('Chưa tải được d05-core.js - tải lại trang rồi thử lại.');
  log(`Đang đọc ${file.name} (${(file.size / 1048576).toFixed(1)} MB)…`);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const rows = D.rowsFromWorkbook(wb, XLSX);
  if (!rows.length) {
    throw new Error('Không đọc được dòng nào. File có đúng là báo cáo D05 của Fabi không?'
      + (rows.info && rows.info.missing.length ? ' Thiếu cột: ' + rows.info.missing.join(', ') : ''));
  }
  const byName = {};
  for (const s of storesMeta || []) if (s.storeName) byName[D.keyOf(s.storeName)] = s.id;
  const docs = D.aggregate(rows, byName);
  const byDate = {};
  for (const [id, doc] of Object.entries(docs)) (byDate[doc.date] ||= {})[id] = doc;
  const dates = Object.keys(byDate).sort();
  const locked = dates.filter((d) => d <= D.EXCEL_UNTIL);
  if (locked.length) {
    throw new Error(`File có ngày ${locked.map(dFull).join(', ')} - các ngày tới ${dFull(D.EXCEL_UNTIL)} lấy số từ báo cáo Excel nội bộ, không nạp Fabi đè lên.`);
  }
  log(`Đọc được ${money(rows.length)} dòng · ${Object.keys(docs).length} cửa hàng-ngày · ${dates.map(dFull).join(', ')}`);

  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const out = { days: [], written: 0, skipped: 0 };
  const changedStores = new Map();
  for (const date of dates) {
    const dayDocs = byDate[date];
    const stateRef = FS.collection('syncState').doc('d05_' + date);
    const oldHashes = ((await stateRef.get()).data() || {}).hashes || {};
    const newHashes = { ...oldHashes };
    const changed = [];
    for (const [id, doc] of Object.entries(dayDocs)) {
      const h = await sha16(D.hashInput(doc));
      newHashes[id] = h;
      if (oldHashes[id] === h) out.skipped++;
      else changed.push([id, { ...doc, hash: h }]);
    }
    if (!changed.length) { log(`${dFull(date)}: không có gì thay đổi`); out.days.push({ date, written: 0, stores: Object.keys(dayDocs).length }); continue; }

    // File chỉ có vài cửa hàng -> đọc bù các cửa hàng còn lại của ngày để tóm tắt ngày đủ
    let allDay = dayDocs;
    if (Object.keys(oldHashes).some((id) => !dayDocs[id])) {
      const snap = await FS.collection('d05Daily').where('date', '==', date).get();
      allDay = {};
      snap.forEach((d) => { allDay[d.id] = d.data(); });
      Object.assign(allDay, dayDocs);
    }
    for (let i = 0; i < changed.length; i += 40) {
      const batch = FS.batch();
      for (const [id, doc] of changed.slice(i, i + 40)) batch.set(FS.collection('d05Daily').doc(id), { ...plain(doc), updatedAt: ts });
      await batch.commit();
      log(`${dFull(date)}: đã ghi ${Math.min(i + 40, changed.length)}/${changed.length} cửa hàng`);
    }
    await FS.collection('d05Days').doc(date).set({ ...plain(D.daySummary(date, allDay)), updatedAt: ts });
    await FS.collection('d05ItemStores').doc(date).set({ ...plain(D.itemStoresDoc(date, allDay)), updatedAt: ts });
    await stateRef.set({ hashes: newHashes }); // ghi sau cùng: có nó = cả ngày đã vào đủ
    for (const [, doc] of changed) changedStores.set(doc.storeId, doc.storeName);
    out.written += changed.length;
    out.days.push({ date, written: changed.length, stores: Object.keys(allDay).length });
    log(`${dFull(date)}: xong · ${changed.length} cửa hàng mới/đổi số`);
  }
  if (changedStores.size) {
    const batch = FS.batch();
    for (const [storeId, storeName] of changedStores) batch.set(FS.collection('stores').doc(storeId), { storeId, storeName, updatedAt: ts }, { merge: true });
    await batch.commit();
  }
  return out;
}

/* Thẻ "Nạp file D05" ở tab Data: kéo thả / chọn một hoặc nhiều file Excel tải từ Fabi. */
function D05ImportCard({ storesMeta, onDone }) {
  const [busy, setBusy] = useState(false);
  const [lines, setLines] = useState([]);
  const [err, setErr] = useState('');
  const [drag, setDrag] = useState(false);
  const log = (s) => setLines((x) => [...x, s]);

  const run = async (files) => {
    files = [...files].filter((f) => /\.xlsx?$/i.test(f.name));
    if (!files.length || busy) return;
    setBusy(true); setErr(''); setLines([]);
    let total = 0;
    try {
      for (const f of files) {
        const r = await importD05File(f, storesMeta, log);
        total += r.written;
      }
      log(total ? `✓ Hoàn tất — đã cập nhật ${total} cửa hàng-ngày. Đang tải lại số liệu…` : '✓ Hoàn tất — số trong file đã có sẵn, không cần ghi gì.');
      if (total && onDone) await onDone();
    } catch (e) { setErr(e.message || String(e)); }
    setBusy(false);
  };

  return (
    <div className="card">
      <div className="card-h">
        <div><h3>Nạp bù bằng file D05</h3>
          <p>Tải báo cáo D05 (tất cả cửa hàng) từ Fabi rồi thả vào đây — tính y hệt đồng bộ tự động, chỉ ghi phần thay đổi</p></div>
        {busy && <span className="tag t-amber" style={{ marginLeft: 'auto' }}>Đang nạp…</span>}
      </div>
      <div className="card-b">
        {LOCAL ? <div className="banner">Chế độ xem trước local không ghi được lên Firebase — mở bản thật (đã đăng nhập) để nạp file.</div> : (
          <label className={cls('upl-box', drag && 'drag')}
            onDragOver={(e) => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)}
            onDrop={(e) => { e.preventDefault(); setDrag(false); run(e.dataTransfer.files); }}
            style={busy ? { opacity: 0.6, pointerEvents: 'none' } : null}>
            <input type="file" accept=".xlsx,.xls" multiple onChange={(e) => { const f = [...e.target.files]; e.target.value = ''; run(f); }} />
            <Ic.up size={22} style={{ margin: '0 auto 8px', color: 'var(--brand)' }} />
            <div style={{ fontWeight: 600 }}>Bấm để chọn hoặc kéo thả file D05 (.xlsx)</div>
            <div className="hint">Chọn được nhiều file một lúc · file 1 ngày hay nhiều ngày đều được · ngày tới {dFull(window.D05 ? window.D05.EXCEL_UNTIL : '2025-12-31')} giữ số Excel, không nạp đè</div>
          </label>
        )}

        {!!lines.length && (
          <div className="imp-log">{lines.map((l, i) => <div key={i}>{l}</div>)}</div>
        )}
      </div>
    </div>
  );
}

/* Gõ target cho nhanh: "450000000", "450.000.000", "450tr", "450m", "1,2 tỷ", "1.2b".
   Trả về null nếu không hiểu (ô đỏ, không lưu). Ô trống = 0 (xoá target tháng đó). */
function parseMoneyInput(s) {
  const t = noAccent(String(s || '')).replace(/\s+/g, '');
  if (!t) return 0;
  const m = t.match(/^(\d+(?:[.,]\d+)?)(ty|b|trieu|tr|m|k|nghin)$/);
  if (m) {
    const mul = { ty: 1e9, b: 1e9, trieu: 1e6, tr: 1e6, m: 1e6, k: 1e3, nghin: 1e3 }[m[2]];
    return Math.round(parseFloat(m[1].replace(',', '.')) * mul);
  }
  if (/^[\d.,]+$/.test(t)) return Number(t.replace(/[.,]/g, ''));
  return null;
}

/* Một ô target: hiện số đã định dạng, bấm vào thành ô gõ; Enter / rời ô là ghi nhận,
   Esc là bỏ. Ô đã sửa mà chưa lưu tô vàng. */
function TargetCell({ value, dirty, onChange }) {
  const [edit, setEdit] = useState(null);
  const bad = edit != null && parseMoneyInput(edit) == null;
  const commit = () => {
    if (edit == null) return;
    const v = parseMoneyInput(edit);
    if (v != null && v !== value) onChange(v);
    setEdit(null);
  };
  if (edit != null) {
    return (
      <input className={cls('tg-in', bad && 'bad')} autoFocus value={edit}
        onChange={(e) => setEdit(e.target.value)} onBlur={commit}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') setEdit(null);
        }} />
    );
  }
  return (
    <button className={cls('tg-cell', dirty && 'dirty', !value && 'zero')} onClick={() => setEdit(value ? money(value) : '')}
      title="Bấm để sửa · gõ 450tr, 1,2 tỷ hoặc số đầy đủ">
      {value ? unit(value) : '+'}
    </button>
  );
}

/* Bảng target cả năm: mỗi dòng 1 chi nhánh, mỗi cột 1 tháng, sửa thẳng từng ô rồi bấm Lưu. */
function TargetGrid({ storesMeta, targets, saveTargets, metaBusy }) {
  const yearsHave = [...new Set((targets || []).map((t) => +t.year))];
  const thisYear = +today().slice(0, 4);
  const years = [...new Set([...yearsHave, thisYear, thisYear + 1])].sort();
  const [year, setYear] = useState(thisYear);
  const [q, setQ] = useState('');
  const [edits, setEdits] = useState({}); // { 'storeId|month': value }

  const base = useMemo(() => {
    const m = {};
    for (const t of targets || []) if (+t.year === year) m[t.storeId + '|' + t.month] = t.target || 0;
    return m;
  }, [targets, year]);
  const val = (id, mo) => { const k = id + '|' + mo; return k in edits ? edits[k] : base[k] || 0; };

  const rows = useMemo(() => {
    const ids = new Set((storesMeta || []).filter((s) => !s.hidden).map((s) => s.id));
    for (const k of Object.keys(base)) if (base[k]) ids.add(k.split('|')[0]);
    const nm = (id) => storeShort(((storesMeta || []).find((s) => s.id === id) || {}).storeName
      || ((targets || []).find((t) => t.storeId === id) || {}).storeName || id);
    const k = noAccent(q.trim());
    return [...ids].map((id) => ({ id, name: nm(id) }))
      .filter((r) => !k || noAccent(r.name).includes(k))
      .sort((a, b) => a.name.localeCompare(b.name, 'vi'));
  }, [storesMeta, targets, base, q]);

  const nDirty = Object.keys(edits).length;
  const setCell = (id, mo, v) => setEdits((e) => {
    const k = id + '|' + mo, next = { ...e };
    if (v === (base[k] || 0)) delete next[k]; else next[k] = v;
    return next;
  });
  const save = async () => {
    const list = Object.entries(edits).map(([k, target]) => {
      const [storeId, month] = k.split('|');
      const r = rows.find((x) => x.id === storeId) || {};
      return { storeId, storeName: r.name || '', year, month: +month, target };
    });
    await saveTargets(list);
    setEdits({});
  };
  const switchYear = (y) => {
    if (nDirty && !window.confirm('Còn ' + nDirty + ' ô chưa lưu - bỏ các thay đổi đó?')) return;
    setEdits({}); setYear(+y);
  };
  const colTot = (mo) => rows.reduce((a, r) => a + val(r.id, mo), 0);
  const rowTot = (id) => MONTHS.reduce((a, _, i) => a + val(id, i + 1), 0);

  return (
    <div className="card">
      <div className="card-h">
        <div><h3>Target theo tháng — sửa trực tiếp</h3><p>Bấm vào ô để sửa · gõ 450tr, 1,2 tỷ hoặc số đầy đủ · Enter để ghi, Esc để bỏ · ô vàng là chưa lưu</p></div>
        <div className="sp">
          {nDirty > 0 && <button className="btn sm" onClick={() => setEdits({})}>Huỷ ({nDirty})</button>}
          <button className="btn sm pri" disabled={!nDirty || LOCAL || metaBusy} onClick={save}>
            {metaBusy ? 'Đang lưu…' : nDirty ? 'Lưu ' + nDirty + ' thay đổi' : 'Đã lưu hết'}
          </button>
        </div>
      </div>
      <div className="flt">
        <select className="inp" value={year} onChange={(e) => switchYear(e.target.value)}>
          {years.map((y) => <option key={y} value={y}>Năm {y}</option>)}
        </select>
        <input className="inp grow" placeholder="Tìm chi nhánh…" value={q} onChange={(e) => setQ(e.target.value)} />
        <span className="hint">{rows.length} chi nhánh · tổng năm {unit(MONTHS.reduce((a, _, i) => a + colTot(i + 1), 0))}</span>
      </div>
      <div className="scroll-x tg-wrap">
        <table className="tb tg-tb">
          <thead><tr><th className="tg-name">Chi nhánh</th>{MONTHS.map((_, i) => <th key={i} className="r">T{i + 1}</th>)}<th className="r">Cả năm</th></tr></thead>
          <tbody>{rows.map((r) => (
            <tr key={r.id}>
              <td className="tg-name">{r.name}</td>
              {MONTHS.map((_, i) => (
                <td key={i} className="r tg-td">
                  <TargetCell value={val(r.id, i + 1)} dirty={(r.id + '|' + (i + 1)) in edits} onChange={(v) => setCell(r.id, i + 1, v)} />
                </td>
              ))}
              <td className="r" style={{ fontWeight: 700 }}>{rowTot(r.id) ? unit(rowTot(r.id)) : '—'}</td>
            </tr>
          ))}</tbody>
          <tfoot><tr><td className="tg-name">Tổng</td>{MONTHS.map((_, i) => <td key={i} className="r">{colTot(i + 1) ? unit(colTot(i + 1)) : '—'}</td>)}
            <td className="r">{unit(MONTHS.reduce((a, _, i) => a + colTot(i + 1), 0))}</td></tr></tfoot>
        </table>
      </div>
    </div>
  );
}

/* =====================================================================
   CUSTOMER SERVICE
   ---------------------------------------------------------------------
   Nạp tay file "Export Ticket" (hệ thống CSKH) -> csTickets/{ID phiếu ghi}, 1 doc/phiếu,
   nạp lại cùng phiếu là ghi đè (trạng thái mới nhất). KHÔNG lưu số điện thoại / email /
   tên khách. Tab "Ticket Complain" để nạp + xem đã nạp ngày nào; phân tích nằm trong mục
   "Customer Service" của Summary (so cùng kỳ tháng trước) và Weekly (so tuần trước).
===================================================================== */
const CS_COLS = {
  id: 'ID phiếu ghi', parentId: 'ID phiếu ghi cha', subject: 'Chủ đề', agent: 'Tên chuyên viên', source: 'Nguồn',
  status: 'Trạng thái phiếu ghi', createdAt: 'Thời điểm tạo', modifiedAt: 'Thời điểm cập nhật', resolvedAt: 'Thời điểm xử lý',
  assignedAt: 'Thời điểm gán chuyên viên', dept: 'Bộ phận', tags: 'Tag', type1: 'Type Level 1', type2: 'Type Level 2',
  errorClass: 'Phân loại lỗi', comp: 'Đền bù', compBill: 'Số bill đền bù', channel: 'Kênh tiếp nhận', ticketType: 'Phân loại Ticket',
  orderCode: 'Mã đơn hàng', region: 'Khu vực', storeName: 'Cửa hàng', dmConfirm: 'Phân loại lỗi - DM xác nhận',
  qcConfirm: 'Phân loại lỗi - QC / AM xác nhận', priority: 'Mức độ ưu tiên', compPrice: 'Giá tiền đơn đền bù',
  shipFee: 'Giá tiền phí ship', result: 'Kết quả khách hàng', dm: 'DM tương ứng', sla: 'Đáp ứng SLA', creator: 'Người tạo phiếu',
};
const CS_NUM = ['compPrice', 'shipFee'];
const CS_TIME = ['createdAt', 'modifiedAt', 'resolvedAt', 'assignedAt'];

/* "2026-07-19 01:34:26" | "19/07/2026 01:34" | Date -> "2026-07-19 01:34:26" */
function csTime(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) {
    if (isNaN(v)) return null;
    return dKey(v) + ' ' + pad2(v.getHours()) + ':' + pad2(v.getMinutes()) + ':' + pad2(v.getSeconds());
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (m) return `${m[1]}-${m[2]}-${m[3]} ${pad2(+m[4])}:${m[5]}:${m[6] || '00'}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return `${m[3]}-${pad2(+m[2])}-${pad2(+m[1])} ${pad2(+(m[4] || 0))}:${m[5] || '00'}:${m[6] || '00'}`;
  return null;
}
const csMs = (t) => (t ? new Date(t.replace(' ', 'T')).getTime() : null);

/* Kết luận cuối cùng của một phiếu: QC/AM xác nhận > DM xác nhận > phân loại ban đầu */
const CS_VERDICTS = [
  { k: 'sai', l: 'Cửa hàng sai quy trình', c: '#C4443C' },
  { k: 'dung', l: 'Cửa hàng đúng quy trình', c: '#12875A' },
  { k: 'thieu', l: 'Chưa đủ thông tin', c: '#D98A0B' },
  { k: 'cho', l: 'Đang chờ DM/QC xác minh', c: '#2F6DB5' },
  { k: 'quahan', l: 'Quá 48h Ops chưa phản hồi', c: '#6C5CE7' },
  { k: 'tuvan', l: 'Tư vấn / hỗ trợ', c: '#8B9199' },
  { k: 'khac', l: 'Chưa xác định', c: '#C3C2B7' },
];
function csVerdict(t) {
  const v = noAccent(t.qcConfirm || t.dmConfirm || t.errorClass || '');
  if (!v) return 'khac';
  if (v.includes('sai quy trinh')) return 'sai';
  if (v.includes('dung quy trinh')) return 'dung';
  if (v.includes('chua du thong tin')) return 'thieu';
  if (v.includes('cho thong tin')) return 'cho';
  if (v.includes('48')) return 'quahan';
  if (v.includes('tu van') || v.includes('ho tro')) return 'tuvan';
  return 'khac';
}
const CS_OPEN = ['open', 'new', 'pending', 'hold'];

/* Ghép tên cửa hàng trong phiếu ("Phê La Quang Trung") với danh mục ("Phê La – 156 - 158
   Quang Trung"): điểm = số từ trùng; hoà thì ưu tiên tên phủ kín hơn và cùng thành phố với
   "Khu vực" của phiếu. Người dùng chọn tay thì lưu ở config/csStoreMap, luôn thắng. */
const CS_CITY_ALIAS = { 'ho chi minh': 'hcm', 'tp.hcm': 'hcm', 'tphcm': 'hcm', 'hcm': 'hcm', 'ha noi': 'hn', 'hn': 'hn' };
const csTokens = (s) => noAccent(s).replace(/phe la/g, ' ').split(/[^a-z0-9]+/).filter((t) => t && !/\d/.test(t) && !['khac', 'tp', 'q'].includes(t));
const csCityKey = (s) => { const k = noAccent(s).trim(); return CS_CITY_ALIAS[k] || k; };
function matchCsStore(name, region, stores) {
  const t = csTokens(name);
  if (!t.length) return null;
  const want = csCityKey(region || '');
  let best = null;
  for (const s of stores) {
    if (/\b(tmdt|pdt|kd)\b/.test(noAccent(s.storeName || ''))) continue; // kênh online / phòng ban
    const st = csTokens(s.storeName);
    const hit = t.filter((x) => st.includes(x)).length;
    if (hit < 2 && !(hit === 1 && t.length === 1)) continue;
    const city = noAccent(s.city || '');
    const cityHit = want && city && (csCityKey(city) === want || city.includes(want) || want.includes(city)) ? 1 : 0;
    const score = hit * 10 + (hit / st.length) * 5 + cityHit * 3;
    if (!best || score > best.score) best = { id: s.id, score, tie: false };
    else if (score === best.score) best.tie = true;
  }
  return best && !best.tie ? best.id : null;
}

function parseTicketFile(buf) {
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const out = [];
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: null, raw: true });
    if (!rows.length || !(CS_COLS.id in rows[0])) continue;
    for (const r of rows) {
      const id = r[CS_COLS.id] == null ? '' : String(r[CS_COLS.id]).trim();
      if (!id) continue;
      const t = { id };
      for (const [k, col] of Object.entries(CS_COLS)) {
        if (k === 'id') continue;
        let v = r[col];
        if (CS_TIME.includes(k)) v = csTime(v);
        else if (CS_NUM.includes(k)) v = v == null || v === '' ? null : Number(String(v).replace(/[^\d.-]/g, '')) || 0;
        else v = v == null ? null : String(v).trim() || null;
        t[k] = v;
      }
      if (!t.createdAt) continue;
      t.date = t.createdAt.slice(0, 10);
      out.push(t);
    }
  }
  if (!out.length) throw new Error('Không đọc được phiếu nào — file cần có cột "ID phiếu ghi" và "Thời điểm tạo" (file Export Ticket của hệ thống CSKH).');
  return out;
}

async function loadTickets(from, to) {
  if (LOCAL) {
    const r = await fetch('/api/cstickets?from=' + from + '&to=' + to);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    return r.json();
  }
  const snap = await FS.collection('csTickets').where('date', '>=', from).where('date', '<=', to).get();
  return snap.docs.map((d) => { const { importedAt, ...x } = d.data(); return x; });
}

/* Bộ số của một tập phiếu (đã lọc). storeOf(t) -> mã cửa hàng Fabi hoặc null. */
function csStats(list) {
  const n = list.length;
  const complaints = list.filter((t) => t.ticketType === 'Khiếu nại' || t.ticketType === 'An toàn vệ sinh thực phẩm');
  const spam = list.filter((t) => t.ticketType === 'Spam').length;
  const verdict = {};
  for (const t of complaints) { const v = csVerdict(t); verdict[v] = (verdict[v] || 0) + 1; }
  const judged = (verdict.sai || 0) + (verdict.dung || 0);
  const slaAll = list.filter((t) => t.sla);
  const slaOk = slaAll.filter((t) => noAccent(t.sla).startsWith('dap ung')).length;
  const hrs = list.map((t) => (t.resolvedAt ? (csMs(t.resolvedAt) - csMs(t.createdAt)) / 3.6e6 : null)).filter((h) => h != null && h >= 0).sort((a, b) => a - b);
  const firstMin = list.map((t) => (t.assignedAt ? (csMs(t.assignedAt) - csMs(t.createdAt)) / 6e4 : null)).filter((h) => h != null && h >= 0).sort((a, b) => a - b);
  const med = (a) => (a.length ? a[Math.floor(a.length / 2)] : null);
  const open = list.filter((t) => CS_OPEN.includes(String(t.status || '').toLowerCase())).length;
  const compList = list.filter((t) => t.comp || noAccent(t.result || '').includes('den bu don hang') || t.compBill);
  const compCost = compList.reduce((a, t) => a + (t.shipFee || 0) + (t.compPrice || 0), 0);
  return {
    n, complaints: complaints.length, spam, verdict, judged,
    wrongRate: judged ? (verdict.sai || 0) / judged * 100 : null,
    sla: slaAll.length ? slaOk / slaAll.length * 100 : null, slaN: slaAll.length, slaMiss: slaAll.length - slaOk,
    medHrs: med(hrs), avgHrs: hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : null,
    medFirst: med(firstMin), open, comp: compList.length, compCost,
  };
}
const csHrs = (h) => (h == null ? '—' : h < 1 ? Math.round(h * 60) + ' phút' : h < 48 ? (Math.round(h * 10) / 10).toString().replace('.', ',') + ' giờ' : (Math.round(h / 24 * 10) / 10).toString().replace('.', ',') + ' ngày');

/* Đếm theo một trường -> [{ name, n }] giảm dần. split: tách chuỗi nhiều giá trị ("a;b"). */
function csCount(list, key, { split, empty } = {}) {
  const m = {};
  for (const t of list) {
    const raw = typeof key === 'function' ? key(t) : t[key];
    const vals = raw == null || raw === '' ? (empty ? [empty] : []) : split ? String(raw).split(split).map((x) => x.trim()).filter(Boolean) : [raw];
    for (const v of vals) {
      const k = split ? v.charAt(0).toUpperCase() + v.slice(1) : v;
      m[k] = (m[k] || 0) + 1;
    }
  }
  return Object.entries(m).map(([name, n]) => ({ name, n })).sort((a, b) => b.n - a.n);
}

/* Pha màu: t=0 -> nhạt (gần trắng), t=1 -> đậm hơn màu gốc. Dùng để tô cột / ô theo số phiếu:
   càng nhiều phiếu càng đậm, liếc là thấy lỗi nào nặng. */
function csShade(hex, t) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const light = c.map((v) => v + (255 - v) * 0.78), dark = c.map((v) => v * 0.72);
  const k = Math.max(0, Math.min(1, t));
  const out = light.map((l, i) => Math.round(l + (dark[i] - l) * k));
  return '#' + out.map((v) => v.toString(16).padStart(2, '0')).join('');
}

/* Cột ngang đếm số phiếu, kèm cột xám cùng kỳ tháng trước; bấm để lọc. */
function csBarOption(rows, prevOf, { labelWidth = 150, color = BRAND_HEX, sel, prevName = 'Cùng kỳ tháng trước' } = {}) {

      formatter: (ps) => {

        return `<b>${r.name}</b><br/>Kỳ này <b>${r.n}</b> phiếu` + (prevOf ? `<br/>${prevName} <b>${p || 0}</b>` : '')
          + (prevOf && p ? `<br/>Chênh lệch <b>${(r.n - p >= 0 ? '+' : '') + pct1(pctDiff(r.n, p))}</b>` : '');
      },

    legend: prevOf ? { top: 0, right: 0, icon: 'roundRect', itemWidth: 11, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } } : { show: false },

      { name: 'Kỳ này', type: 'bar', barMaxWidth: 16, barGap: '25%', barCategoryGap: '30%',
        itemStyle: {
          color: (p) => (sel && sel !== list[p.dataIndex].name ? '#ECE8E3' : csShade(color, 0.2 + 0.8 * list[p.dataIndex].n / maxN)),

        data: list.map((r) => prevOf(r.name) || 0) }] : []),
    ],
  };
}

/* Tải phiếu của kỳ đang xem + kỳ so sánh. ver đổi (vừa nạp file) là đọc lại. */
function useCsTickets(range, cmpRange) {
  const [st, setSt] = useState({ key: null, now: null, prev: null, err: '' });
  const key = range.from + range.to + cmpRange.from + cmpRange.to;
  useEffect(() => {
    let live = true;
    Promise.all([loadTickets(range.from, range.to), loadTickets(cmpRange.from, cmpRange.to)])
      .then(([a, b]) => { if (live) setSt({ key, now: a, prev: b, err: '' }); })
      .catch((e) => { if (live) setSt({ key, now: [], prev: [], err: e.message }); });
    return () => { live = false; };
  }, [key]);
  return st.key === key ? st : { now: null, prev: null, err: '' };
}

/* Tên cửa hàng trong phiếu -> mã chi nhánh Fabi: chọn tay (config/csStoreMap) thắng, còn lại ghép tự động. */
function useCsStoreOf(storesMeta, csStoreMap, tickets) {
  const auto = useMemo(() => {
    const names = {};
    for (const t of tickets) if (t.storeName) names[t.storeName] = t.region;
    const out = {};
    for (const [n, rg] of Object.entries(names)) out[n] = matchCsStore(n, rg, storesMeta || []);
    return out;
  }, [tickets, storesMeta]);
  return useCallback((t) => (t.storeName ? (csStoreMap || {})[t.storeName] || auto[t.storeName] || null : null), [csStoreMap, auto]);
}

const csIsComplaint = (t) => t.ticketType === 'Khiếu nại' || t.ticketType === 'An toàn vệ sinh thực phẩm';

/* Mục "Customer Service" trong Summary / Weekly. So với kỳ cmpRange (cùng kỳ tháng trước ở
   Summary, tuần trước ở Weekly). keep/geoFilter: bộ lọc miền/tỉnh/AM/chi nhánh của trang -
   đang lọc thì chỉ giữ phiếu đã ghép được về chi nhánh nằm trong lát cắt. */
function CSSection({ cur, cmpSales, range, cmpRange, cmpLabel, storesMeta, csStoreMap, keep, geoFilter, onGoTickets }) {
  const tk = useCsTickets(range, cmpRange);
  const [f, setF] = useState({});
  const [noSpam, setNoSpam] = useState(true);
  const [showList, setShowList] = useState(false);
  const [q, setQ] = useState('');
  const [limit, setLimit] = useState(40);
  const cmpShort = cmpLabel === 'tuần trước' ? 'Tuần trước' : 'Cùng kỳ tháng trước';

  const meta = useMemo(() => { const m = {}; for (const s of storesMeta || []) m[s.id] = s; return m; }, [storesMeta]);
  const both = useMemo(() => [...(tk.now || []), ...(tk.prev || [])], [tk.now, tk.prev]);
  const storeOf = useCsStoreOf(storesMeta, csStoreMap, both);
  const storeLabel = useCallback((t) => { const id = storeOf(t); return id ? storeShort((meta[id] || {}).storeName || t.storeName) : t.storeName; }, [storeOf, meta]);
  const inGeo = useCallback((t) => { if (!geoFilter) return true; const id = storeOf(t); return !!id && keep(id); }, [geoFilter, keep, storeOf]);

  const pass = (t, sk) => { const skip = (k) => (Array.isArray(sk) ? sk.includes(k) : sk === k); return passAll(t, skip); };
  const passAll = (t, skip) => inGeo(t) && (!noSpam || t.ticketType !== 'Spam')
    && (skip('type1') || !f.type1 || t.type1 === f.type1)
    && (skip('type2') || !f.type2 || t.type2 === f.type2)
    && (skip('store') || !f.store || storeLabel(t) === f.store)
    && (skip('region') || !f.region || t.region === f.region)
    && (skip('channel') || !f.channel || t.channel === f.channel)
    && (skip('verdict') || !f.verdict || csVerdict(t) === f.verdict);
  const all = tk.now || [], allPrev = tk.prev || [];
  const list = useMemo(() => all.filter((t) => pass(t)), [all, f, noSpam, storeLabel, inGeo]);
  const listPrev = useMemo(() => allPrev.filter((t) => pass(t)), [allPrev, f, noSpam, storeLabel, inGeo]);
  const S = useMemo(() => csStats(list), [list]);
  const P = useMemo(() => csStats(listPrev), [listPrev]);
  const toggle = (k, v) => { setF((x) => ({ ...x, [k]: x[k] === v ? null : v })); setLimit(40); };

  /* TC cùng lát cắt để ra khiếu nại / 10.000 hoá đơn */
  const sliceIds = useMemo(() => {
    if (!f.store && !f.region) return null;
    const ids = new Set();
    for (const t of both) if ((!f.store || storeLabel(t) === f.store) && (!f.region || t.region === f.region)) { const id = storeOf(t); if (id) ids.add(id); }
    return ids;
  }, [both, f.store, f.region, storeOf, storeLabel]);
  const tcOf = (sum) => Object.values((sum && sum.byStore) || {})
    .reduce((a, s) => a + ((!sliceIds || sliceIds.has(s.id)) && (!geoFilter || keep(s.id)) ? s.bills || 0 : 0), 0);
  const tcNow = tcOf(cur), tcPrev = tcOf(cmpSales);
  const per10k = tcNow ? S.complaints / tcNow * 1e4 : null;
  const per10kPrev = tcPrev ? P.complaints / tcPrev * 1e4 : null;

  const dayKeys = useMemo(() => { const o = []; for (let k = range.from; k <= range.to; k = dAdd(k, 1)) o.push(k); return o; }, [range.from, range.to]);
  const dayOption = useMemo(() => {
    const cnt = (pred) => dayKeys.map((k) => list.filter((t) => t.date === k && pred(t)).length);
    const bar = (name, data, color, top) => ({ name, type: 'bar', stack: 'a', barMaxWidth: 22, itemStyle: { color, borderRadius: top ? [4, 4, 0, 0] : 0, borderColor: '#fff', borderWidth: 1 }, data });
    const showSpam = !noSpam;
    return {
      ...ANIM,
      grid: { left: 36, right: 12, top: 30, bottom: 26 },
      tooltip: { ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } },
        formatter: (ps) => `<b>${dFull(dayKeys[ps[0].dataIndex])} · ${wdOf(dayKeys[ps[0].dataIndex])}</b><br/>` + ps.map((p) => `${p.marker} ${p.seriesName} <b>${p.value}</b>`).join('<br/>') },
      legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 11, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
      xAxis: { type: 'category', data: dayKeys.map((k) => dShort(k) + (dayKeys.length <= 7 ? ' ' + wdOf(k) : '')), ...AXIS_STYLE, splitLine: { show: false } },
      yAxis: { type: 'value', minInterval: 1, ...AXIS_STYLE, axisLine: { show: false } },
      series: [bar('Khiếu nại', cnt(csIsComplaint), BRAND_HEX, false),
        bar('Yêu cầu / góp ý', cnt((t) => !csIsComplaint(t) && t.ticketType !== 'Spam'), SERIES[0], !showSpam),
        ...(showSpam ? [bar('Spam', cnt((t) => t.ticketType === 'Spam'), '#C3C2B7', true)] : [])],
    };
  }, [dayKeys, list, noSpam]);

  const verdictRows = CS_VERDICTS.map((v) => ({ ...v, n: S.verdict[v.k] || 0, p: P.verdict[v.k] || 0 })).filter((v) => v.n || v.p);
  const verdictOption = useMemo(() => ({
    ...ANIM,
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => `<b>${p.name}</b><br/><b>${p.value}</b> phiếu · ${p.percent}%` },
    legend: { orient: 'vertical', right: 0, top: 'middle', icon: 'circle', itemWidth: 8, itemHeight: 8, itemGap: 9, textStyle: { color: INK.txt, fontSize: 11, fontFamily: FONT } },
    series: [{
      type: 'pie', radius: ['52%', '76%'], center: ['28%', '52%'], padAngle: 1.5,
      itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 }, label: { show: false },
      data: verdictRows.filter((v) => v.n).map((v) => ({ name: v.l, value: v.n, k: v.k, itemStyle: { color: v.c, opacity: f.verdict && f.verdict !== v.k ? 0.3 : 1 } })),
    }],
    graphic: [{ type: 'text', left: '28%', top: '45%', style: { text: String(S.complaints), fill: INK.txt, font: `800 20px ${FONT}`, textAlign: 'center' } },
      { type: 'text', left: '28%', top: '56%', style: { text: 'khiếu nại', fill: INK.mute, font: `600 11px ${FONT}`, textAlign: 'center' } }],
  }), [verdictRows, S.complaints, f.verdict]);

  const cnt = (field, opts) => csCount(all.filter((t) => pass(t, field)), field, opts);
  const cntPrev = (field) => { const m = {}; for (const r of csCount(allPrev.filter((t) => pass(t, field)), field)) m[r.name] = r.n; return (k) => m[k] || 0; };
  const type1 = cnt('type1'), type2 = csCount(list, 'type2'), channel = cnt('channel');
  const type1Prev = cntPrev('type1'), channelPrev = cntPrev('channel');
  const tags = csCount(list, 'tags', { split: ';' }).filter((r) => !/^ad_/i.test(r.name)).slice(0, 10);
  const results = csCount(list, 'result');
  const onBar = (k) => (p) => toggle(k, p.name);

  /* Bản đồ nhiệt chi nhánh × loại lỗi (chỉ phiếu khiếu nại): số trong ô, màu đậm nhạt theo
     số. Bỏ qua bộ lọc chi nhánh / loại lỗi của chính nó để bấm ô là lọc được. */
  const heat = useMemo(() => {
    const src = all.filter((t) => pass(t, ['store', 'type1']) && csIsComplaint(t) && t.storeName && t.type1);
    const byStore = {}, byType = {};
    for (const t of src) {
      const s = storeLabel(t);
      (byStore[s] ||= { name: s, n: 0, c: {} }).n++;
      byStore[s].c[t.type1] = (byStore[s].c[t.type1] || 0) + 1;
      byType[t.type1] = (byType[t.type1] || 0) + 1;
    }
    const stores = Object.values(byStore).sort((a, b) => b.n - a.n).slice(0, 20);
    const types = Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([k]) => k).slice(0, 10);
    const data = [];
    let max = 1;
    stores.forEach((s, yi) => types.forEach((ty, xi) => { const v = s.c[ty] || 0; if (v > max) max = v; data.push([xi, yi, v || null]); }));
    // Ô đậm thì chữ trắng, ô nhạt chữ đen - số luôn đọc được
    const items = data.map((d) => ({ value: d, label: { color: d[2] && d[2] / max > 0.5 ? '#fff' : '#14181C' } }));
    return { stores, types, data: items, max };
  }, [all, f, noSpam, storeLabel, inGeo]);
  const heatOption = useMemo(() => ({
    animationDuration: 700,
    grid: { left: 150, right: 12, top: 8, bottom: 84 },
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => '<b>' + heat.stores[p.value[1]].name + '</b><br/>' + heat.types[p.value[0]] + ': <b>' + (p.value[2] || 0) + '</b> khiếu nại' },
    xAxis: { type: 'category', data: heat.types, position: 'bottom', ...AXIS_STYLE, axisLine: { show: false }, splitArea: { show: false },
      axisLabel: { ...AXIS_STYLE.axisLabel, interval: 0, rotate: 32, width: 110, overflow: 'truncate', color: INK.txt } },
    yAxis: { type: 'category', data: heat.stores.map((s) => s.name), inverse: true, ...AXIS_STYLE, axisLine: { show: false },
      axisLabel: { ...AXIS_STYLE.axisLabel, color: INK.txt, width: 138, overflow: 'truncate' } },
    visualMap: { show: false, min: 0, max: heat.max, inRange: { color: ['#FBF3E4', '#EFD39C', '#D9A23F', '#B07D2B', '#6E4A14'] } },
    series: [{
      type: 'heatmap', data: heat.data,
      label: { show: true, fontSize: 11, fontWeight: 700, fontFamily: FONT, formatter: (p) => (p.value[2] ? p.value[2] : '') },
      itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 5 },
      emphasis: { itemStyle: { borderColor: INK.txt, borderWidth: 1.5 } },
    }],
  }), [heat]);

  const storeRows = useMemo(() => {
    const m = {};
    for (const t of all.filter((x) => pass(x, 'store'))) {
      if (!t.storeName) continue;
      const nm = storeLabel(t), id = storeOf(t);
      const r = (m[nm] ||= { name: nm, id, region: t.region, n: 0, kn: 0, sai: 0, types: {} });
      r.n++;
      if (csIsComplaint(t)) r.kn++;
      if (csVerdict(t) === 'sai') r.sai++;
      if (t.type1) r.types[t.type1] = (r.types[t.type1] || 0) + 1;
    }
    const prev = {};
    for (const t of allPrev.filter((x) => pass(x, 'store'))) if (t.storeName && csIsComplaint(t)) prev[storeLabel(t)] = (prev[storeLabel(t)] || 0) + 1;
    return Object.values(m).map((r) => {
      const tc = r.id && cur.byStore[r.id] ? cur.byStore[r.id].bills : 0;
      const top = Object.entries(r.types).sort((a, b) => b[1] - a[1])[0];
      return { ...r, rate: tc ? r.kn / tc * 1e4 : null, prevKn: prev[r.name] || 0, top: top ? top[0] + ' (' + top[1] + ')' : '—' };
    }).sort((a, b) => b.kn - a.kn || b.n - a.n);
  }, [all, allPrev, f, noSpam, storeLabel, storeOf, inGeo, cur]);

  const groupRows = (keyOf) => {
    const m = {};
    for (const t of list) {
      const k = keyOf(t) || 'Chưa rõ';
      const r = (m[k] ||= { name: k, n: 0, kn: 0, sai: 0, dung: 0, slaMiss: 0 });
      r.n++;
      if (csIsComplaint(t)) r.kn++;
      const v = csVerdict(t); if (v === 'sai') r.sai++; if (v === 'dung') r.dung++;
      if (t.sla && !noAccent(t.sla).startsWith('dap ung')) r.slaMiss++;
    }
    return Object.values(m).sort((a, b) => b.kn - a.kn);
  };
  const regionRows = groupRows((t) => t.region), dmRows = groupRows((t) => t.dm);

  const agentRows = useMemo(() => {
    const m = {};
    for (const t of list) {
      const r = (m[t.agent || 'Chưa gán'] ||= { name: t.agent || 'Chưa gán', n: 0, hrs: [], slaN: 0, slaOk: 0, open: 0 });
      r.n++;
      if (t.resolvedAt) { const hh = (csMs(t.resolvedAt) - csMs(t.createdAt)) / 3.6e6; if (hh >= 0) r.hrs.push(hh); }
      if (t.sla) { r.slaN++; if (noAccent(t.sla).startsWith('dap ung')) r.slaOk++; }
      if (CS_OPEN.includes(String(t.status || '').toLowerCase())) r.open++;
    }
    return Object.values(m).map((r) => ({ ...r, avg: r.hrs.length ? r.hrs.reduce((a, b) => a + b, 0) / r.hrs.length : null, sla: r.slaN ? r.slaOk / r.slaN * 100 : null }))
      .sort((a, b) => b.n - a.n);
  }, [list]);

  const shown = useMemo(() => {
    const k = noAccent(q.trim());
    return list.filter((t) => !k || noAccent([t.subject, t.storeName, t.orderCode, t.id, t.agent, t.type2].join(' ')).includes(k))
      .sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  }, [list, q]);
  const exportCsv = () => downloadCsv('phela-cs-' + range.from + '_' + range.to + '.csv', [
    ['ID', 'Ngày tạo', 'Phân loại', 'Lỗi cấp 1', 'Lỗi cấp 2', 'Kết luận', 'Cửa hàng', 'Khu vực', 'Kênh', 'Trạng thái', 'SLA', 'Thời gian xử lý (giờ)', 'Chuyên viên', 'Kết quả', 'Chủ đề'],
    ...shown.map((t) => [t.id, t.createdAt, t.ticketType || '', t.type1 || '', t.type2 || '', (CS_VERDICTS.find((v) => v.k === csVerdict(t)) || {}).l, storeLabel(t) || '', t.region || '', t.channel || '', t.status || '', t.sla || '',
      t.resolvedAt ? ((csMs(t.resolvedAt) - csMs(t.createdAt)) / 3.6e6).toFixed(1) : '', t.agent || '', t.result || '', t.subject || '']),
  ]);

  if (tk.err) return <div className="banner"><b>Không đọc được phiếu CS:</b>&nbsp;{tk.err}</div>;
  if (!tk.now) return <div className="empty">Đang tải phiếu CS…</div>;
  if (!all.length) {
    return (
      <div className="empty">
        Chưa có phiếu CS nào trong {rangeLabel(range)}. {onGoTickets && <button className="btn sm" style={{ marginLeft: 8 }} onClick={onGoTickets}>Mở tab Ticket Complain để nạp</button>}
      </div>
    );
  }

  /* Kỳ so sánh phải nạp đủ ngày mới so %: nạp dở (vd tuần trước mới có 1/7 ngày) mà vẫn so

/* ===================== TAB TICKET COMPLAIN: NẠP + ĐÃ NẠP NGÀY NÀO ===================== */
/* config/csCoverage = { days: { 'YYYY-MM-DD': số phiếu }, imports: [{ at, file, n, from, to }] }
   - cập nhật sau mỗi lần nạp (đếm lại phiếu của các ngày trong file), để xem lịch đã nạp
   mà không phải đọc hết phiếu. "Đếm lại" dựng lại từ toàn bộ csTickets. */
async function recountCoverage(from, to) {
  const snap = await (from ? FS.collection('csTickets').where('date', '>=', from).where('date', '<=', to) : FS.collection('csTickets')).get();
  const days = {};
  snap.forEach((d) => { const x = d.data().date; if (x) days[x] = (days[x] || 0) + 1; });
  return days;
}

function TicketPage({ data }) {
  const { storesMeta, csStoreMap, csCoverage, reloadMeta } = data;
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');
  const [err, setErr] = useState('');
  const [drag, setDrag] = useState(false);
  const days = (csCoverage && csCoverage.days) || {};
  const imports = (csCoverage && csCoverage.imports) || [];

  /* Nạp = GHI ĐÈ THEO NGÀY: ngày nào có trong file thì phiếu của ngày đó trên hệ thống bằng
     đúng file (phiếu cũ của ngày đó mà file không còn - bị gộp/xoá bên CSKH - sẽ bị xoá).
     Ngày không có trong file giữ nguyên. Bước 1 đọc file + so với số đang có để xem trước,
     bước 2 người dùng bấm "Ghi đè" mới ghi. */
  const [plan, setPlan] = useState(null); // { file, list, rows: [{ date, had, next }], drop: [id], dates: Set }
  const run = async (files) => {
    const file = [...files].find((x) => /\.(xlsx|xls|csv)$/i.test(x.name));
    if (!file || busy) return;
    setBusy(true); setErr(''); setPlan(null); setMsg('Đang đọc ' + file.name + '…');
    try {
      const list = parseTicketFile(await file.arrayBuffer());
      const next = {};
      for (const t of list) next[t.date] = (next[t.date] || 0) + 1;
      const dates = Object.keys(next).sort();
      setMsg('Đang so với số đang có trên hệ thống…');
      const have = await loadTickets(dates[0], dates[dates.length - 1]);
      const ids = new Set(list.map((t) => t.id));
      const had = {};
      const drop = [];
      for (const t of have) {
        if (!next[t.date]) continue; // ngày không có trong file: giữ nguyên
        had[t.date] = (had[t.date] || 0) + 1;
        if (!ids.has(t.id)) drop.push(t.id);
      }
      setPlan({ file: file.name, list, drop, rows: dates.map((d) => ({ date: d, had: had[d] || 0, next: next[d] })) });
      setMsg('');
    } catch (e) { setErr(e.message || String(e)); setMsg(''); }
    setBusy(false);
  };
  const apply = async () => {
    if (!plan || busy) return;
    const { list, drop, rows, file } = plan;
    setBusy(true); setErr('');
    try {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      const ops = [...drop.map((id) => ['del', id]), ...list.map((t) => ['set', t])];
      for (let i = 0; i < ops.length; i += 400) {
        const batch = FS.batch();
        for (const [op, x] of ops.slice(i, i + 400)) {
          if (op === 'del') batch.delete(FS.collection('csTickets').doc(x));
          else batch.set(FS.collection('csTickets').doc(x.id), { ...x, importedAt: ts });
        }
        await batch.commit();
        setMsg(`Đang ghi ${Math.min(i + 400, ops.length)}/${ops.length}…`);
      }
      const counts = {};
      for (const r of rows) counts[r.date] = r.next;
      const from = rows[0].date, to = rows[rows.length - 1].date;
      const entry = { at: new Date().toISOString(), file, n: list.length, from, to, dropped: drop.length };
      await FS.collection('config').doc('csCoverage').set({
        days: counts, imports: [entry, ...imports].slice(0, 30), updatedAt: ts,
      }, { merge: true });
      setMsg(`✓ Đã ghi đè ${rows.length} ngày (${dFull(from)} – ${dFull(to)}): hệ thống giờ có đúng ${list.length} phiếu như file${drop.length ? ', đã xoá ' + drop.length + ' phiếu cũ không còn trong file' : ''}.`);
      setPlan(null);
      await reloadMeta();
    } catch (e) { setErr(e.message || String(e)); setMsg(''); }
    setBusy(false);
  };
  const rebuild = async () => {
    setBusy(true); setErr(''); setMsg('Đang đếm lại toàn bộ phiếu…');
    try {
      const counts = await recountCoverage();
      // Ghi đè hẳn days (không merge) để ngày đã xoá phiếu không còn sót
      await FS.collection('config').doc('csCoverage').set({ days: counts, imports, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      setMsg(`✓ Đã đếm lại: ${Object.values(counts).reduce((a, b) => a + b, 0)} phiếu trong ${Object.keys(counts).length} ngày.`);
      await reloadMeta();
    } catch (e) { setErr(e.message || String(e)); setMsg(''); }
    setBusy(false);
  };

  /* Lịch: từ tháng có phiếu đầu tiên tới tháng này */
  const dates = Object.keys(days).filter((d) => days[d] > 0).sort();
  const first = dates[0], last = dates[dates.length - 1];
  const total = dates.reduce((a, d) => a + days[d], 0);
  const maxDay = Math.max(1, ...dates.map((d) => days[d]));
  const missing = [];
  if (first) for (let k = first; k <= last; k = dAdd(k, 1)) if (!days[k]) missing.push(k);
  const months = [];
  if (first) for (let k = monthStart(first); k <= today(); k = dAdd(monthEnd(k), 1)) months.push(k.slice(0, 7));
  months.reverse();

  const matchInfo = useMemo(() => {
    const names = [...new Set(Object.keys(csStoreMap || {}))];
    return names;
  }, [csStoreMap]);
  const [unmatched, setUnmatched] = useState(null);
  const scanUnmatched = async () => {
    setBusy(true); setErr('');
    try {
      const all = LOCAL ? await loadTickets(first || '2020-01-01', today()) : (await FS.collection('csTickets').get()).docs.map((d) => d.data());
      const names = {};
      for (const t of all) if (t.storeName) names[t.storeName] = t.region;
      setUnmatched(Object.entries(names).filter(([n, rg]) => !(csStoreMap || {})[n] && !matchCsStore(n, rg, storesMeta || [])).map(([n]) => n).sort());
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const saveMap = async (name, id) => {
    const next = { ...(csStoreMap || {}), [name]: id };
    await FS.collection('config').doc('csStoreMap').set({ map: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    setUnmatched((u) => (u || []).filter((x) => x !== name));
    await reloadMeta();
  };

  return (
    <>
      <div className="stats">
        <Stat hero label="Đã nạp tới ngày" icon={<Ic.cal size={14} />} value={last ? dFull(last) : '—'}
          sub={imports[0] ? 'lần nạp gần nhất ' + stamp(imports[0].at) : 'chưa nạp lần nào'} />
        <Stat label="Tổng phiếu đã nạp" icon={<Ic.chat size={14} />} value={money(total)} sub={first ? 'từ ' + dFull(first) : null} />
        <Stat label="Số ngày có phiếu" icon={<Ic.table size={14} />} value={money(dates.length)}
          sub={missing.length ? <span className="dn">thiếu {missing.length} ngày ở giữa</span> : first ? <span className="up">liền mạch, không hụt ngày</span> : null} />
        <Stat label="Phiếu / ngày (TB)" icon={<Ic.gauge size={14} />} value={dates.length ? (total / dates.length).toFixed(1).replace('.', ',') : '—'} sub="trên các ngày đã nạp" />
      </div>

      <div className="card">
        <div className="card-h">
          <div><h3>Nạp file Export Ticket</h3><p>File xuất từ hệ thống CSKH · ghi đè theo ngày: ngày nào có trong file thì số phiếu ngày đó bằng đúng file · không lưu SĐT / email / tên khách</p></div>
          {busy && <span className="tag t-amber" style={{ marginLeft: 'auto' }}>Đang xử lý…</span>}
        </div>
        <div className="card-b">
          {LOCAL ? <div className="banner">Chế độ xem trước local không ghi được — mở bản thật (đã đăng nhập) để nạp.</div> : (
            <label className={cls('upl-box', drag && 'drag')} style={busy ? { opacity: 0.6, pointerEvents: 'none' } : null}
              onDragOver={(e) => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)}
              onDrop={(e) => { e.preventDefault(); setDrag(false); run(e.dataTransfer.files); }}>
              <input type="file" accept=".xlsx,.xls,.csv" onChange={(e) => { const f = [...e.target.files]; e.target.value = ''; run(f); }} />
              <Ic.up size={22} style={{ margin: '0 auto 8px', color: 'var(--brand)' }} />
              <div style={{ fontWeight: 600 }}>Bấm để chọn hoặc kéo thả file Export Ticket (.xlsx)</div>
              <div className="hint">Cần các cột: ID phiếu ghi, Thời điểm tạo, Phân loại Ticket, Type Level 1/2, Cửa hàng, Khu vực… · phân tích xem ở mục Customer Service trong Summary và Weekly</div>
            </label>
          )}
          {plan && (() => {
            const tHad = plan.rows.reduce((a, r) => a + r.had, 0), tNext = plan.rows.reduce((a, r) => a + r.next, 0);
            return (
              <div className="ow-box">
                <div className="ow-h">
                  <div><b>{plan.file}</b> · {plan.rows.length} ngày ({dFull(plan.rows[0].date)} – {dFull(plan.rows[plan.rows.length - 1].date)})

                  <div className="sp">
                    <button className="btn sm" disabled={busy} onClick={() => setPlan(null)}>Huỷ</button>
                    <button className="btn sm pri" disabled={busy} onClick={apply}>{busy ? 'Đang ghi…' : 'Ghi đè ' + plan.rows.length + ' ngày'}</button>
                  </div>
                </div>
                <div className="scroll-x" style={{ maxHeight: 300, overflowY: 'auto' }}>
                  <table className="tb">
                    <thead><tr><th>Ngày</th><th className="r">Đang có</th><th className="r">Theo file</th><th className="r">Thay đổi</th></tr></thead>
                    <tbody>{plan.rows.map((r) => (
                      <tr key={r.date}><td>{dFull(r.date)} · {wdOf(r.date)}</td><td className="r">{r.had || '—'}</td><td className="r"><b>{r.next}</b></td>

                    ))}</tbody>
                    <tfoot><tr><td>Tổng</td><td className="r">{tHad}</td><td className="r">{tNext}</td>
                      <td className="r">{plan.drop.length ? 'xoá ' + plan.drop.length + ' phiếu cũ' : '—'}</td></tr></tfoot>
                  </table>
                </div>
              </div>
            );
          })()}
          {msg && <div className="imp-log">{msg}</div>}
          {err && <div className="err" style={{ marginTop: 12 }}>{err}</div>}
        </div>
      </div>

      <div className="card">
        <div className="card-h">
          <div><h3>Lịch đã nạp</h3><p>Mỗi ô là một ngày (theo ngày tạo phiếu) · số trong ô là số phiếu · ô đỏ là ngày nằm giữa khoảng đã nạp mà chưa có phiếu</p></div>
          <div className="sp">
            {!LOCAL && <button className="btn sm" disabled={busy} onClick={rebuild}>Đếm lại</button>}
          </div>
        </div>
        {!months.length ? <div className="empty">Chưa nạp phiếu nào.</div> : (
          <div className="tkc-months">
            {months.map((ym) => {
              const start = ym + '-01', end = monthEnd(start);
              const lead = (new Date(start + 'T00:00:00').getDay() + 6) % 7;
              const cells = [];
              for (let i = 0; i < lead; i++) cells.push(null);
              for (let k = start; k <= end; k = dAdd(k, 1)) cells.push(k);
              const mTotal = cells.filter(Boolean).reduce((a, k) => a + (days[k] || 0), 0);
              return (
                <div className="tkc-m" key={ym}>
                  <div className="tkc-h"><b>Tháng {+ym.slice(5)}/{ym.slice(0, 4)}</b><span>{mTotal ? money(mTotal) + ' phiếu' : 'chưa có'}</span></div>
                  <div className="tkc-g">
                    {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((w) => <i key={w}>{w}</i>)}
                    {cells.map((k, i) => {
                      if (!k) return <span key={'e' + i} />;
                      const n = days[k] || 0;
                      const gap = !n && first && k > first && k < last;
                      const future = k > today();
                      return (
                        <span key={k} className={cls('tkc-d', n && 'on', gap && 'gap', future && 'fut')}
                          style={n ? { '--a': (0.18 + 0.82 * n / maxDay).toFixed(2) } : null}
                          title={dFull(k) + (n ? ' · ' + n + ' phiếu' : gap ? ' · chưa nạp' : '')}>
                          <em>{+k.slice(8)}</em>{n ? <b>{n}</b> : null}
                        </span>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
        {missing.length > 0 && (
          <div className="flt"><span className="hint"><b className="dn">Chưa có phiếu:</b> {missing.slice(0, 40).map(dShort).join(', ')}{missing.length > 40 ? ' …' : ''}</span></div>
        )}
      </div>

      <div className="dash">
        <div className="c6">
          <div className="card" style={{ marginBottom: 0 }}>
            <div className="card-h"><div><h3>Lịch sử nạp</h3><p>30 lần gần nhất</p></div></div>
            {!imports.length ? <div className="empty">Chưa có lần nạp nào được ghi lại.</div> : (
              <div className="scroll-x"><table className="tb">
                <thead><tr><th>Lúc nạp</th><th>File</th><th className="r">Phiếu</th><th className="r">Xoá</th><th>Khoảng ngày</th></tr></thead>
                <tbody>{imports.map((x, i) => (
                  <tr key={i}><td style={{ whiteSpace: 'nowrap' }}>{stamp(x.at)}</td><td style={{ maxWidth: 220, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{x.file}</td>
                    <td className="r">{money(x.n)}</td><td className="r">{x.dropped ? x.dropped : '—'}</td><td style={{ whiteSpace: 'nowrap' }}>{dShort(x.from)} – {dShort(x.to)}</td></tr>
                ))}</tbody></table></div>
            )}
          </div>
        </div>
        <div className="c6">
          <div className="card" style={{ marginBottom: 0 }}>
            <div className="card-h">
              <div><h3>Ghép cửa hàng</h3><p>Tên cửa hàng trong phiếu được tự ghép với danh mục chi nhánh; quán nào không ghép được thì chọn tay ở đây</p></div>
              <div className="sp"><button className="btn sm" disabled={busy || !first} onClick={scanUnmatched}>Tìm quán chưa ghép</button></div>
            </div>
            {unmatched == null ? <div className="empty">{matchInfo.length ? matchInfo.length + ' quán đang ghép tay. ' : ''}Bấm "Tìm quán chưa ghép" để kiểm tra.</div>
              : !unmatched.length ? <div className="empty">Tất cả cửa hàng trong phiếu đều đã ghép được.</div> : (
                <div className="card-b" style={{ display: 'grid', gap: 10 }}>
                  {unmatched.map((n) => (
                    <div key={n} style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                      <b style={{ fontSize: 13, minWidth: 200 }}>{n}</b>
                      <select className="inp" style={{ width: 'auto', flex: 1 }} value="" disabled={LOCAL} onChange={(e) => e.target.value && saveMap(n, e.target.value)}>
                        <option value="">— chọn chi nhánh —</option>
                        {[...(storesMeta || [])].sort((a, b) => storeShort(a.storeName).localeCompare(storeShort(b.storeName), 'vi'))
                          .map((s) => <option key={s.id} value={s.id}>{storeShort(s.storeName)}</option>)}
                      </select>
                    </div>
                  ))}
                </div>
              )}
          </div>
        </div>
      </div>
    </>
  );
}

/* ===================== NHẮC CÓ BẢN MỚI =====================
   index.html được phục vụ kèm no-cache, nên tải lại nó là biết server đang có bản nào.
   So với bản lúc mở trang: khác là có deploy mới -> hiện thanh nhắc tải lại. Kiểm tra mỗi
   2 phút và mỗi lần quay lại tab (hay để tab mở cả ngày). */
function useNewVersion() {
  const [fresh, setFresh] = useState(false);
  useEffect(() => {
    let base = null, stop = false;
    const sig = (t) => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ':' + h; };
    const check = async () => {
      /* Lần đầu luôn chạy để ghi lại bản gốc (kể cả mở trang ở tab nền); các lần sau
         bỏ qua khi tab đang ẩn - quay lại tab là visibilitychange gọi kiểm tra ngay. */
      if (stop || (base !== null && document.hidden)) return;
      try {
        const r = await fetch('/index.html?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const s = sig(await r.text());
        if (base === null) base = s;
        else if (s !== base) setFresh(true);
      } catch (e) { /* mất mạng thì thôi, lần sau thử lại */ }
    };
    check();
    const t = setInterval(check, 120000);
    document.addEventListener('visibilitychange', check);
    return () => { stop = true; clearInterval(t); document.removeEventListener('visibilitychange', check); };
  }, []);
  return [fresh, () => setFresh(false)];
}
