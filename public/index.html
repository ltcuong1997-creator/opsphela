<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F4">
<title>Phê La — Báo cáo bán hàng</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=K2D:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   NỀN NGÀ, THẺ NỔI, KHÔNG VIỀN NGĂN
   ---------------------------------------------------------------------
   Dựng theo đúng nguyên tắc của ZSpace: NỀN NGÀ chạy liền mạch cho cả trang, cột menu, thanh trên
   và mọi khe hở giữa các thẻ — chỉ THẺ NỘI DUNG mới trắng tinh. Mắt tự tách được "vùng ngà =
   điều hướng / vùng trắng = làm việc" mà không cần một đường kẻ nào, nên bỏ được toàn bộ viền.
   Chiều sâu đến từ BÓNG NHIỀU TẦNG chứ không phải nghiêng/xoay: một tầng sát viền cho nét, hai
   tầng rộng rất nhạt cho độ nổi. Bảng số liệu vẫn phẳng để còn gõ được.
   Lấy nguyên từ Cliff House. Màu thương hiệu (--brand*) đang TẠM để vàng đồng của Cliff House —
   chờ mã màu Phê La, đổi đúng các biến --brand* (và rgba trong --sh-brand) là cả app đổi theo.
   ===================================================================== */
:root{
  --ink:#14181C;
  --ink-2:#1F252B;
  --canvas:#F7F5F4;          /* ngà ấm — nền của TẤT CẢ trừ thẻ */
  --card:#FFFFFF;
  --line:#E8E5E3;
  --line-soft:#F1EFED;
  --txt:#14181C;
  --txt-2:#5A6068;
  --txt-3:#8B9199;
  --brand:#B07D2B;
  --brand-dark:#8C6220;
  --brand-bright:#D9A23F;
  --brand-wash:#FAF3E4;
  --green:#12875A;
  --green-wash:#E6F4EE;
  --red:#C4443C;
  --red-wash:#FBECEB;
  --blue:#2F6DB5;
  --blue-wash:#EAF1FA;
  --violet:#6C5CE7;
  --violet-wash:#EFEDFE;
  --amber:#D98A0B;
  --amber-wash:#FDF3E0;
  --r:12px; --r-l:18px; --r-xl:24px;
  /* Ba tầng bóng: sát viền cho nét, rộng vừa cho khối, rộng rất nhạt cho độ cao */
  --sh-1:0 1px 2px rgba(20,24,28,.06), 0 4px 10px rgba(20,24,28,.06);
  --sh-card:0 1px 2px rgba(20,24,28,.07), 0 8px 20px rgba(20,24,28,.08), 0 26px 56px rgba(20,24,28,.09);
  --sh-up:0 3px 6px rgba(20,24,28,.08), 0 12px 26px rgba(20,24,28,.11), 0 36px 72px rgba(20,24,28,.13);
  --sh-brand:0 4px 12px rgba(176,125,43,.26);
  --sans:'K2D', system-ui, -apple-system, sans-serif;
  --nav-w:240px;
  --top-h:64px;
  /* Nhịp chung của mọi chuyển động chậm — cùng một đường cong thì cả app đi cùng một nhịp thở */
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--canvas);color:var(--txt);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#DAD6D3;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--txt-3)}
.hint{font-size:12px;color:var(--txt-3);line-height:1.5}
.mute{color:var(--txt-3)}

/* ================= KHUNG ================= */
.shell{display:flex;min-height:100vh;min-height:100dvh}
/* Đổi đúng một biến --nav-w là cả cột menu lẫn lề trái vùng làm việc đi theo */
.shell.nav-min{--nav-w:76px}
.nav{width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--canvas);color:var(--txt);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;padding:4px 12px 0}
.nav-brand{padding:16px 6px 14px;display:flex;align-items:center;gap:11px}
.logo{width:38px;height:38px;border-radius:12px;flex:0 0 38px;background:#fff;object-fit:cover;
  box-shadow:var(--sh-brand)}
.nav-nm{min-width:0}
.nav-brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.15;color:var(--txt)}
.nav-brand small{font-size:10px;color:var(--txt-3);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.nav-min-btn{margin-left:auto;width:30px;height:30px;border-radius:9px;color:var(--txt-3);
  display:flex;align-items:center;justify-content:center;flex:0 0 30px;transition:background .16s,color .16s}
.nav-min-btn:hover{background:rgba(20,24,28,.06);color:var(--txt)}
/* Bỏ hẳn thanh cuộn xám của cột menu — vẫn cuộn được bằng con lăn / vuốt */
.nav-scroll{flex:1;overflow-y:auto;padding:0 0 14px;position:relative;scrollbar-width:none;-ms-overflow-style:none}
.nav-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.nav-group{margin:15px 0 5px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.02em;
  color:var(--txt-3);white-space:nowrap;overflow:hidden}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:10px;
  color:var(--txt-2);font-weight:500;font-size:14px;margin-bottom:2px;text-align:left;
  position:relative;z-index:1;transition:color .2s,background-color .2s}
.nav-item:hover{background:rgba(20,24,28,.05);color:var(--txt)}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;color:var(--txt-3);transition:color .2s}
/* Mục đang mở KHÔNG tự tô nền — viên pill .nav-hl trượt tới nằm dưới nó mới là cái tô màu */
.nav-item.on{background:transparent;color:#fff;font-weight:600}
.nav-item.on .ic{color:#fff}
.nav-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Viên highlight trượt: JS đo vị trí mục đang mở (useHlRect), CSS chỉ lo trượt top/height */
.nav-hl{position:absolute;left:0;right:0;border-radius:10px;background:var(--brand);
  box-shadow:var(--sh-brand);z-index:0;pointer-events:none;
  transition:top .5s var(--ease),height .5s var(--ease)}
.nav-foot{border-top:1px solid var(--line);padding:12px 2px 16px;margin-top:auto}
.nav-user{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;
  background:var(--card);box-shadow:var(--sh-1)}
.nav-user b{font-size:13px;display:block;line-height:1.25;color:var(--txt)}
.nav-user small{font-size:11px;color:var(--txt-3);display:block}
.av{width:30px;height:30px;border-radius:99px;flex:0 0 30px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.nav-out{margin-top:8px;width:100%;padding:8px;border-radius:10px;background:var(--card);
  color:var(--txt-2);font-size:13px;font-weight:600;box-shadow:var(--sh-1);transition:color .16s,box-shadow .2s}
.nav-out:hover{color:var(--red);box-shadow:var(--sh-up)}

/* ---- MENU THU GỌN: chỉ còn dải icon ---- */
.nav-min .nav-brand{flex-direction:column;gap:10px;padding:16px 0 12px}
.nav-min .nav-nm{display:none}
.nav-min .nav-min-btn{margin-left:0}
.nav-min .nav-item{justify-content:center;padding:10px 0;gap:0}
.nav-min .nav-lb{display:none}
.nav-min .nav-hl{right:auto;width:52px}
/* Nhãn nhóm thu lại thành một vạch mảnh — vẫn thấy ranh giới nhóm mà không tốn dòng chữ */
.nav-min .nav-group{height:1px;padding:0;margin:10px 14px;background:var(--line);color:transparent;overflow:hidden;font-size:0}
.nav-min .nav-foot{padding:12px 0 16px}
.nav-min .nav-user{justify-content:center;padding:6px}
.nav-min .nav-user .who{display:none}
.nav-min .nav-out{font-size:0;padding:9px 0}
.nav-min .nav-out::before{content:'⏻';font-size:14px}
/* ---- Rê chuột vào một icon thì ĐÚNG mục đó dãn ngang ra hiện tên ----
   Khó ở chỗ .nav-scroll phải overflow-y:auto (menu dài hơn màn hình), mà overflow-y khác visible là
   trình duyệt ép luôn overflow-x -> nhãn dãn ra ngoài 76px bị cắt mất. Cách gỡ của ZSpace: cho vùng
   cuộn RỘNG hẳn ra đè lên nội dung trang nhưng trong suốt và pointer-events:none — chỉ riêng từng
   mục menu nhận chuột. Chỗ trống bên phải vẫn bấm xuyên xuống trang như thường, con lăn trên icon
   vẫn cuộn menu vì sự kiện cuộn đi theo cây phần tử chứ không theo vùng bắt chuột. */
@media(hover:hover) and (min-width:961px){
  .nav-min .nav-scroll{width:340px;overflow-x:hidden;pointer-events:none;padding-right:20px}
  /* Vùng cuộn phải rộng 340px thì nhãn mới dãn ra ngoài được, nhưng vạch ngăn nhóm là khối
     block nên nó ăn theo luôn 340px và kẻ một đường dài tràn ra giữa trang. Chốt cứng bề ngang
     đúng bằng dải icon: 52px pill trừ 2×14px lề = 24px, nằm gọn chính giữa cột. */
  .nav-min .nav-group{width:24px}
  .nav-min .nav-item{pointer-events:auto;width:fit-content;min-width:52px;max-width:52px;
    justify-content:flex-start;padding:10px 16px 10px 17px;gap:12px;overflow:hidden;white-space:nowrap;
    transition:max-width .42s var(--ease),background-color .2s,box-shadow .3s,color .2s}
  .nav-min .nav-lb{display:inline;opacity:0;transform:translateX(-8px);
    transition:opacity .18s ease,transform .38s var(--ease)}
  .nav-min .nav-item:hover{max-width:280px;z-index:3;background:var(--card);color:var(--txt);box-shadow:var(--sh-up)}
  .nav-min .nav-item.on:hover{background:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
  .nav-min .nav-item:hover .nav-lb{opacity:1;transform:none;transition-delay:.06s}
}

.main{flex:1;margin-left:var(--nav-w);min-width:0;display:flex;flex-direction:column}
/* Thanh trên cùng nền ngà, không viền dưới — chỉ hơi mờ khi nội dung trượt qua bên dưới */
.topbar{height:var(--top-h);background:rgba(247,245,244,.78);backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);display:flex;align-items:center;gap:14px;
  padding:0 22px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.25}
.topbar .sub{font-size:12px;color:var(--txt-3);font-weight:500;line-height:1.3}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.top-date{font-size:13px;font-weight:600;color:var(--txt-3);background:var(--card);border-radius:99px;
  padding:7px 13px;box-shadow:var(--sh-1);white-space:nowrap;transition:box-shadow .2s}
.top-date:hover{box-shadow:var(--sh-up)}
/* Vùng làm việc dùng trọn bề ngang: thu gọn menu là bảng tự rộng thêm đúng 164px */
.page{padding:16px 18px 32px;max-width:none;width:100%}

/* ================= MẢNH GHÉP ================= */
/* Thẻ: bỏ viền, nổi bằng bóng, bo tròn hơn */
.card{background:var(--card);border:none;border-radius:var(--r-l);box-shadow:var(--sh-card);
  margin-bottom:12px;overflow:hidden;transition:box-shadow .3s cubic-bezier(.22,1,.36,1)}
.card:hover{box-shadow:var(--sh-up)}
/* Thẻ lồng trong thẻ phải CHÌM xuống, không được nổi chồng lên nhau */
.card .card{box-shadow:none;background:var(--canvas);border-radius:14px}
.card .card:hover{box-shadow:none}
.card-h{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.card-h p{margin:1px 0 0;font-size:11.5px;color:var(--txt-3)}
.card-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;
  background:var(--card);border:1px solid transparent;font-size:13px;font-weight:600;
  box-shadow:var(--sh-1);transition:box-shadow .22s,background .16s,color .16s;white-space:nowrap}
.btn:hover{background:#fff;box-shadow:var(--sh-up)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:var(--sh-brand)}
.btn.pri:hover{background:var(--brand-dark);box-shadow:0 8px 22px rgba(176,125,43,.3)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:0 4px 14px rgba(20,24,28,.2)}
.btn.dark:hover{background:var(--ink-2);box-shadow:0 8px 22px rgba(20,24,28,.26)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-wash)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:var(--sh-1)}

.inp{width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;transition:border-color .16s,box-shadow .16s}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(176,125,43,.13)}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
select.inp{cursor:pointer}
select.inp:hover{border-color:#D8D3D0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-gray{background:#EFEDEB;color:var(--txt-2)}
.t-green{background:var(--green-wash);color:var(--green)}
.t-red{background:var(--red-wash);color:var(--red)}
.t-amber{background:var(--amber-wash);color:#8A6008}
.t-blue{background:var(--blue-wash);color:var(--blue)}
.t-brand{background:var(--brand-wash);color:var(--brand-dark)}
.t-violet{background:var(--violet-wash);color:var(--violet)}

.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--txt-3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover{background:#FBFAF9}
table.tb .r{text-align:right;font-variant-numeric:tabular-nums}
table.tb tfoot td{padding:11px 12px;border-top:2px solid var(--line);font-weight:700;background:#FBFAF9}
.empty{padding:40px 20px;text-align:center;color:var(--txt-3);font-size:13.5px}

/* ================= CHỈ SỐ ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:none;border-radius:var(--r-l);padding:15px 17px;
  box-shadow:var(--sh-card);position:relative;overflow:hidden;transition:box-shadow .3s cubic-bezier(.22,1,.36,1)}
.stat:hover{box-shadow:var(--sh-up)}
.stat .lb{font-size:11.5px;font-weight:500;color:var(--txt-3);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.stat .ic-sq{width:26px;height:26px;border-radius:9px;flex:0 0 26px;background:var(--canvas);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.stat .vl{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .dt{font-size:11.5px;color:var(--txt-3);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* Thẻ nổi bật: khối nâu đậm ấm, là điểm neo mắt của cả hàng chỉ số (không dùng đen) */
.stat.hero{background:linear-gradient(140deg,#7A5420,#A87C36);color:#fff;box-shadow:0 2px 4px rgba(122,84,32,.14),0 10px 24px rgba(122,84,32,.2),0 28px 56px rgba(122,84,32,.16)}
.stat.hero:hover{box-shadow:0 4px 8px rgba(122,84,32,.18),0 14px 30px rgba(122,84,32,.24),0 34px 66px rgba(122,84,32,.2)}
.stat.hero .lb{color:#F2E2C6}
.stat.hero .dt{color:#EBD8B8}
.stat.hero .ic-sq{background:rgba(255,255,255,.14)}
.up{color:var(--green);font-weight:700}
.dn{color:var(--red);font-weight:700}
.stat.hero .up{color:#6FE0A8}
.stat.hero .dn{color:#FFA79B}

/* ================= CỬA SỔ NỔI ================= */
.mask{position:fixed;inset:0;background:rgba(20,24,28,.4);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s}
.modal{background:var(--card);border-radius:var(--r-xl);box-shadow:0 30px 80px rgba(20,24,28,.28);
  width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;
  animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
.modal.wide{max-width:840px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
.modal-h h3{margin:0;font-size:16px;font-weight:700}
.modal-h p{margin:2px 0 0;font-size:12px;color:var(--txt-3)}
.modal-b{padding:20px 22px;overflow-y:auto;flex:1}
.modal-f{padding:15px 22px;border-top:1px solid var(--line-soft);display:flex;gap:9px;justify-content:flex-end}
.x{margin-left:auto;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:var(--txt-3);transition:background .16s,color .16s}
.x:hover{background:var(--canvas);color:var(--txt)}


/* ================= ĐĂNG NHẬP ================= */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:20px;background:radial-gradient(1200px 600px at 20% 0%,#2A2118,#14181C 70%)}
.login-card{width:100%;max-width:410px;background:var(--card);border-radius:26px;
  box-shadow:0 34px 90px rgba(0,0,0,.4);padding:32px 30px}
.login-card .logo{width:54px;height:54px;border-radius:17px;font-size:19px;margin-bottom:16px}
.login-card h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.025em}
.login-card p{margin:0 0 20px;font-size:13px;color:var(--txt-3)}
.err{background:var(--red-wash);color:var(--red);padding:9px 12px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px}

/* ================= DẢI NHẮC ================= */
.banner{display:flex;align-items:flex-start;gap:11px;padding:13px 16px;border-radius:14px;
  background:var(--amber-wash);margin-bottom:16px;font-size:12.5px;color:#7A5410;line-height:1.55;
  box-shadow:var(--sh-1)}
.banner b{color:#5E4009}

/* =====================================================================
   NHỊP CHUYỂN CẢNH
   ---------------------------------------------------------------------
   1) trang cũ mờ đi (.page.leaving, ~0.22s) rồi mới tháo ra;
   2) hàng chỉ số hiện trước, số chạy từ 0 lên (countUp trong JS);
   3) các thẻ bên dưới bung dần từ trên xuống, cái sau trễ hơn cái trước;
   4) tiêu đề cuộn: chữ cũ trượt xuống mờ đi, chữ mới trượt từ trên xuống vào chỗ (RollSwap).
   fill-mode là `backwards` chứ KHÔNG phải `both`: giữ lại transform/clip-path sau khi chạy xong sẽ
   biến .page/.card thành khung chứa của mọi modal position:fixed bên trong -> modal lệch chỗ.
   Cố ý KHÔNG tắt theo prefers-reduced-motion: máy Windows bật "tiết kiệm pin" là cờ đó bật theo,
   mà hiệu ứng này là thứ chủ app chủ động yêu cầu chứ không phải trang trí thêm.
   ===================================================================== */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes pageOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes kpiIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(-14px);clip-path:inset(0 0 100% 0)}
  to{opacity:1;transform:none;clip-path:inset(-80px)}}
.page{animation:pageIn .3s ease-out backwards}
.page.leaving{animation:pageOut .22s cubic-bezier(.4,0,1,1) forwards;pointer-events:none}
.page .stat{animation:kpiIn .55s var(--ease) .05s backwards}
.page .card{animation:cardIn .7s var(--ease) .18s backwards}
.page .card:nth-child(2){animation-delay:.26s}
.page .card:nth-child(3){animation-delay:.34s}
.page .card:nth-child(4){animation-delay:.42s}
.page .card:nth-child(5){animation-delay:.50s}
.page .card:nth-child(n+6){animation-delay:.56s}
/* Thẻ lồng trong thẻ và chỉ số trong thẻ không diễn lại lần nữa — bung hai tầng là rối mắt */
.page .card .card,.page .card .stat{animation:none}
.page.leaving .card,.page.leaving .stat{animation:none}

/* Tiêu đề trang cuộn chữ */
.roll{position:relative}
.roll-out{position:absolute;left:0;right:0;top:0;pointer-events:none;
  animation:rollOut .42s cubic-bezier(.4,0,.2,1) forwards}
.roll-in{animation:rollIn .6s var(--ease) .2s backwards}
@keyframes rollOut{to{opacity:0;transform:translateY(80%);filter:blur(2px)}}
@keyframes rollIn{from{opacity:0;transform:translateY(-80%);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}

.cal-d.s span,.cal-d.e span,.cal-d.s:hover span,.cal-d.e:hover span{background:var(--brand)!important;color:#fff;font-weight:700;box-shadow:var(--sh-brand)}

/* =====================================================================
   DASHBOARD SUMMARY
   ---------------------------------------------------------------------
   Bảng màu chuỗi số liệu lấy từ bộ đã kiểm định mù màu (validate_palette):
   thứ tự slot là cơ chế an toàn, không phải trang trí - không đổi thứ tự,
   không chế thêm màu thứ 9 mà gộp phần đuôi vào "Khác".
   ===================================================================== */
:root{
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#E1E0D9; --axis:#C3C2B7; --muted-ink:#898781;
}
/* Hàng lọc: một hàng duy nhất phía trên mọi biểu đồ, không nhét filter vào từng thẻ */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 7px 5px 12px;border-radius:99px;
  background:var(--card);box-shadow:var(--sh-1);font-size:12.5px;font-weight:600}
.chip b{font-weight:700}
.chip small{color:var(--txt-3);font-weight:600}
.chip button{width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  color:var(--txt-3);font-size:13px;line-height:1;transition:background .16s,color .16s}
.chip button:hover{background:var(--canvas);color:var(--red)}
.fbar .hint{margin-left:auto}

.dash{display:grid;gap:12px;grid-template-columns:repeat(12,1fr);align-items:start}
.dash > *{min-width:0}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
@media(max-width:1180px){ .c3,.c4,.c5{grid-column:span 6} .c7,.c8{grid-column:span 12} }
@media(max-width:760px){ .dash > *{grid-column:span 12 !important} }

/* Thẻ biểu đồ: tiêu đề + nút bảng số, thân là canvas ECharts */
.ch-h{padding:14px 16px 4px;display:flex;align-items:flex-start;gap:10px}
.ch-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em}
.ch-h p{margin:2px 0 0;font-size:11.5px;color:var(--txt-3)}
.ch-h .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.ch-tab{font-size:11px;font-weight:700;color:var(--txt-3);padding:4px 9px;border-radius:8px;transition:background .16s,color .16s}
.ch-tab:hover{background:var(--canvas);color:var(--txt)}
.ch-tab.on{background:var(--brand-wash);color:var(--brand-dark)}
.ch-b{padding:0 6px 8px}
.ch-tb{max-height:320px;overflow:auto;padding:0 10px 10px}
.ch-tb table{width:100%;border-collapse:collapse;font-size:12.5px}
.ch-tb th{position:sticky;top:0;background:var(--card);text-align:left;font-size:10.5px;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--txt-3);padding:7px 8px;border-bottom:1px solid var(--line)}
.ch-tb td{padding:6px 8px;border-bottom:1px solid var(--line-soft)}
.ch-tb .r{text-align:right;font-variant-numeric:tabular-nums}
.ch-tb .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Ô chỉ số: số lớn dùng chữ số tỉ lệ (tabular-nums chỉ dành cho cột số thẳng hàng) */
.kpi{background:var(--card);border-radius:var(--r-l);box-shadow:var(--sh-card);padding:13px 15px;
  display:flex;flex-direction:column;gap:2px;min-height:118px;transition:box-shadow .3s cubic-bezier(.22,1,.36,1)}
.kpi:hover{box-shadow:var(--sh-up)}
.kpi .lb{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--txt-3);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Ba cỡ số duy nhất trong cả báo cáo: 26 (hero) / 22 (thường) / 19 (phụ) */
.kpi .vl{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.kpi .sub{font-size:11px;color:var(--txt-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:17px}
.kpi.sm .vl{font-size:19px}
/* margin-top:auto - spark luôn dính đáy thẻ nên các ô cạnh nhau có cùng đường chân trời */
.kpi .spark{height:30px;margin:auto -5px -5px;display:block}
/* Hàng chỉ số không có đường xu hướng thì thấp lại, khỏi chừa một dải trắng vô nghĩa */
.kpi:not(:has(.spark)){min-height:96px}
.kpi.hero{background:linear-gradient(140deg,#7A5420,#A87C36);color:#fff;
  box-shadow:0 3px 6px rgba(122,84,32,.18),0 14px 28px rgba(122,84,32,.22),0 34px 64px rgba(122,84,32,.18)}
.kpi.hero .lb,.kpi.hero .sub{color:#F2E2C6}
.kpi.hero .vl{font-size:26px}
.kpi.hero .up{color:#9FF0C6}
.kpi.hero .dn{color:#FFC2B8}
.kpi.hero .mute{color:#EBD8B8}
/* Ô được tô nhẹ để nhấn nhóm chỉ số (ADS / AOV / target) mà không cần khối đặc */
.kpi.tint{background:linear-gradient(140deg,#FDFBF7,var(--brand-wash))}
.kpi.tint-blue{background:linear-gradient(140deg,#FBFCFE,var(--blue-wash))}
.kpi.tint-green{background:linear-gradient(140deg,#FAFDFB,var(--green-wash))}
.kpi-row{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);margin-bottom:10px}
@media(max-width:1180px){ .kpi-row{grid-template-columns:repeat(2,1fr)} }
@media(max-width:560px){ .kpi-row{grid-template-columns:1fr} }

/* ================= MỤC LỚN TRONG BÁO CÁO =================
   Mỗi mục chỉ nói về một chủ đề (tổng quan / ADS / AOV / target / cơ cấu / chi nhánh)
   nên mắt biết mình đang đọc phần nào, không trộn chỉ số khác nhóm vào cùng một hàng. */
.sec{display:flex;align-items:center;gap:11px;margin:20px 0 10px}
.sec-n{width:24px;height:24px;flex:0 0 24px;border-radius:8px;background:var(--brand-wash);color:var(--brand-dark);
  font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sec-t{min-width:0}
.sec-t h2{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sec-t p{margin:1px 0 0;font-size:11.5px;color:var(--txt-3);line-height:1.3}
/* Thanh tiến trình mục báo cáo: dính ngay dưới topbar, mỗi mục một nút, nối nhau bằng
   vạch như stepper. Mục đang xem sáng màu thương hiệu, các mục đã qua tô nhạt, vạch mảnh
   dưới đáy chạy theo độ cuộn của cả trang. */
.secnav{position:sticky;top:var(--top-h);z-index:29;background:rgba(247,245,244,.82);
  backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);
  padding:2px 22px 0;animation:snIn .45s var(--ease) backwards}
@keyframes snIn{from{opacity:0;transform:translateY(-6px)}}
.sn-track{display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:6px 2px 10px;scroll-behavior:smooth}
.sn-track::-webkit-scrollbar{display:none}
.sn-i{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:5px 13px 5px 5px;border-radius:99px;
  background:var(--card);box-shadow:var(--sh-1);font-size:12.5px;font-weight:600;color:var(--txt-2);white-space:nowrap;
  transition:background .3s var(--ease),color .3s,box-shadow .3s,transform .3s var(--ease)}
.sn-i:hover{transform:translateY(-1px);box-shadow:var(--sh-up);color:var(--txt)}
.sn-i b{width:22px;height:22px;flex:0 0 22px;border-radius:99px;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--line-soft);color:var(--txt-3);transition:background .3s,color .3s}
.sn-i.done{color:var(--brand-dark)}
.sn-i.done b{background:var(--brand-wash);color:var(--brand-dark)}
.sn-i.on{background:linear-gradient(135deg,var(--brand-bright),var(--brand) 55%,var(--brand-dark));color:#fff;
  box-shadow:var(--sh-brand),0 0 0 3px rgba(217,162,63,.18);transform:translateY(-1px)}
.sn-i.on b{background:rgba(255,255,255,.24);color:#fff}
.sn-ln{flex:0 0 18px;height:2px;margin:0 3px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.sn-ln::after{content:'';position:absolute;inset:0;background:var(--brand-bright);transform:scaleX(0);transform-origin:left;
  transition:transform .45s var(--ease)}
.sn-ln.done::after{transform:scaleX(1)}
.sn-bar{height:2px;margin:0 -22px;background:linear-gradient(90deg,var(--brand-bright),var(--brand));transform-origin:left;
  transition:transform .12s linear}
@media(max-width:960px){
  .secnav{top:0;padding:calc(2px + env(safe-area-inset-top)) 14px 0}
  .sn-bar{margin:0 -14px}
  .sn-i{padding:4px 11px 4px 4px;font-size:12px}
}
.sec-l{flex:1;height:1px;background:var(--line)}

/* Thẻ mục tiêu: TARGET / ACHIEVE% / FC% + vòng gauge */
.tgt{display:flex;align-items:center;gap:14px}
.tgt .rows{flex:1;min-width:0}
.tgt .g{width:104px;height:104px;flex:0 0 104px;margin:-8px -6px -8px 0}

/* ================= HÀNG NHẬN ĐỊNH NHANH (insight) ================= */
.insight-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
@media(max-width:1180px){ .insight-row{grid-template-columns:repeat(2,1fr)} }
@media(max-width:560px){ .insight-row{grid-template-columns:1fr} }
.insight{background:var(--card);border-radius:var(--r-l);box-shadow:var(--sh-1);padding:11px 14px;
  display:flex;align-items:center;gap:10px;transition:box-shadow .2s}
.insight:hover{box-shadow:var(--sh-up)}
.insight .ic-sq{width:32px;height:32px;border-radius:10px;flex:0 0 32px;background:var(--brand-wash);
  color:var(--brand-dark);display:flex;align-items:center;justify-content:center}
.insight .tx{min-width:0}
.insight .tx b{display:block;font-size:12.5px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight .tx small{display:block;font-size:11px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= BẢNG XẾP HẠNG DẠNG DANH SÁCH (leaderboard) ================= */
.lb-list{padding:4px 8px 10px}
.lb-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;transition:background .15s}
.lb-row:hover{background:var(--canvas)}
.lb-rk{width:21px;height:21px;border-radius:99px;background:var(--canvas);color:var(--txt-3);font-size:10.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 21px}
.lb-nm{flex:1;min-width:0}
.lb-nm b{display:block;font-size:12.5px;font-weight:600;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-nm small{display:block;font-size:10.5px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-vl{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.lb-vl small{display:block;font-size:10px;font-weight:600;color:var(--txt-3)}
/* Mũi tên tăng/giảm trong bảng Top 10: xanh lá khi tăng, đỏ khi giảm. Phải ghi đè
   .lb-vl small ở trên (cụ thể hơn .up/.dn nên nếu không ghi đè sẽ bị xám). */
.lb-vl small.up,.lb-vl small.dn{display:inline-flex;align-items:center;gap:3px;margin-top:3px;
  padding:1px 6px;border-radius:99px;font-weight:700;font-size:9.5px;letter-spacing:.01em}
.lb-vl small.up{color:var(--green);background:rgba(18,135,90,.10)}
.lb-vl small.dn{color:var(--red);background:rgba(196,68,60,.10)}
.lb-bar{height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin-top:5px;width:100%}
.lb-bar-fill{height:100%;border-radius:99px}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F7F5F4;font-family:'K2D',system-ui,sans-serif;color:#8D96A3;font-size:13px;z-index:200">Đang tải…</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="/d05-core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

<script id="src" type="text/plain">
const { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback } = React;

/* =====================================================================
   PHÊ LA — BÁO CÁO BÁN HÀNG (D05)
   ---------------------------------------------------------------------
   Một file, không build. Dữ liệu do script sync/ tự đổ vào Firestore mỗi giờ:
     d05Daily/{ngày}_{mã cửa hàng} = { date, storeId, storeName, revenue,
       quantity, bills, updatedAt, items: { [món]: { name, group, quantity, revenue } } }

   Chạy ở localhost (node sync/preview-server.js) thì đọc qua /api/d05 của server
   trên máy, không cần đăng nhập. Chạy trên Firebase Hosting thì đăng nhập
   Firebase Auth rồi đọc thẳng Firestore (firestore.rules chặn người lạ).
===================================================================== */

/* Cấu hình Web App Firebase — không phải bí mật, mọi web app Firebase đều để lộ nó */
const FB_CFG = {
  apiKey: "AIzaSyDou4bM03zukkzgDpVUWZJOd2owM5rnd6E",
  authDomain: "opsphela.firebaseapp.com",
  projectId: "opsphela",
  storageBucket: "opsphela.firebasestorage.app",
  messagingSenderId: "39705637257",
  appId: "1:39705637257:web:205d8fdad1cb0fbd3a3158",
};
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const BRAND = { name: 'Phê La', sub: 'Báo cáo bán hàng', mark: 'PL' };

/* ===================== TIỆN ÍCH ===================== */
const n0 = (v) => Math.round(Number(v) || 0);
const money = (v) => n0(v).toLocaleString('vi-VN');
/* d05Days đã lưu sẵn doanh thu TRƯỚC VAT như báo cáo nội bộ: (Tổng tiền + hoa hồng) / 1,08
   do sync/lib.js tính cho ngày Fabi, còn ngày lấy từ Excel thì đã là số đó. Không quy đổi
   lần nữa ở đây - giữ tên hàm để các chỗ gọi không phải đổi. */
const adjRevenue = (rev) => rev || 0;
/* AOV = doanh thu / số hoá đơn (TC). ADS = doanh thu trung bình mỗi chi nhánh mỗi ngày
   = doanh thu / số ngày CÓ doanh thu / số chi nhánh CÓ doanh thu. */
const aovOf = (revenue, bills) => (bills ? revenue / bills : 0);
const adsOf = (revenue, nDays, nStores) => (nDays && nStores ? revenue / nDays / nStores : 0);
const toNum = (v) => {
  if (typeof v === 'number') return v;
  if (!v) return 0;
  return Number(String(v).replace(/[^0-9-]/g, '')) || 0;
};
const noAccent = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase();
const short = (v) => {
  const a = Math.abs(n0(v));
  if (a >= 1e9) return (v / 1e9).toFixed(2).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + 'tr';
  if (a >= 1e3) return Math.round(v / 1e3) + 'k';
  return String(n0(v));
};
/* Đơn vị rút gọn cho dashboard: B = tỷ, M = triệu, K = nghìn, 2 chữ số thập phân,
   dấu phẩy thập phân kiểu Việt Nam ("53,60B"). Số đầy đủ vẫn có ở tooltip/bảng số. */
const unit = (v) => {
  const n = Number(v) || 0;
  const a = Math.abs(n);
  const f = (x, s) => (x).toFixed(2).replace('.', ',') + s;
  if (a >= 1e9) return f(n / 1e9, 'B');
  if (a >= 1e6) return f(n / 1e6, 'M');
  if (a >= 1e3) return f(n / 1e3, 'K');
  return String(Math.round(n));
};
const pad2 = (n) => String(n).padStart(2, '0');
const dKey = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const dAdd = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return dKey(d); };
const dDiff = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const dShort = (k) => k.slice(8, 10) + '/' + k.slice(5, 7);
const dFull = (k) => k.slice(8, 10) + '/' + k.slice(5, 7) + '/' + k.slice(0, 4);
const cls = (...a) => a.filter(Boolean).join(' ');
const pctDiff = (cur, prev) => (!prev ? null : ((cur - prev) / Math.abs(prev)) * 100);
/* "Phê La – 145 Trích Sài" -> "145 Trích Sài": tiền tố giống nhau ở cả 92 cửa hàng, bỏ cho gọn */
const storeShort = (s) => String(s || '').replace(/^Phê La\s*[–-]\s*/i, '');

/* ===================== KHOẢNG NGÀY ===================== */
const today = () => dKey(new Date());
const monthStart = (k) => k.slice(0, 8) + '01';
const monthEnd = (k) => { const d = new Date(+k.slice(0, 4), +k.slice(5, 7), 0); return dKey(d); };
/* Tuần Thứ 2 -> Chủ nhật (ISO) - dùng cho trang Weekly Report */
const weekStart = (k) => { const d = new Date(k + 'T00:00:00'); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return dKey(d); };
const weekEnd = (k) => dAdd(weekStart(k), 6);
const PRESETS = [
  { k: 'today', l: 'Hôm nay', r: () => ({ from: today(), to: today() }) },
  { k: 'yday', l: 'Hôm qua', r: () => ({ from: dAdd(today(), -1), to: dAdd(today(), -1) }) },
  { k: '7d', l: '7 ngày qua', r: () => ({ from: dAdd(today(), -6), to: today() }) },
  { k: '30d', l: '30 ngày qua', r: () => ({ from: dAdd(today(), -29), to: today() }) },
  { k: 'month', l: 'Tháng này', r: () => ({ from: monthStart(today()), to: today() }) },
  { k: 'lmonth', l: 'Tháng trước', r: () => { const e = dAdd(monthStart(today()), -1); return { from: monthStart(e), to: e }; } },
  { k: 'year', l: 'Từ đầu năm', r: () => ({ from: today().slice(0, 4) + '-01-01', to: today() }) },
];
const presetOf = (r) => (PRESETS.find(p => { const x = p.r(); return x.from === r.from && x.to === r.to; }) || {}).k || null;
/* Cùng ngày của tháng trước: 24/09 -> 24/08; ngày không tồn tại thì lùi về cuối tháng
   (31/03 -> 28/02). Dùng cho so sánh "cùng kỳ tháng trước". */
const monthBack = (k) => {
  const [y, m, d] = k.split('-').map(Number);
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  const last = new Date(Date.UTC(py, pm, 0)).getUTCDate();
  return `${py}-${pad2(pm)}-${pad2(Math.min(d, last))}`;
};
const rangeLabel = (r) => (r.from === r.to ? dFull(r.from) : dFull(r.from) + ' – ' + dFull(r.to));
/* "16:10 22/09" */
const stamp = (iso) => { const d = new Date(iso); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ' ' + dShort(dKey(d)); };
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const wdOf = (k) => WD[new Date(k + 'T00:00:00').getDay()];

/* ===================== ĐỌC DỮ LIỆU ===================== */
/* Web chỉ đọc doc tóm tắt ngày d05Days/{ngày} (1 doc/ngày): tổng ngày, tổng từng cửa hàng
   (stores{}) và tổng từng món cả chuỗi (items{}). Xem 1 tháng ~30 lượt đọc. */
let FS = null, AUTH = null;
function bootCloud() {
  if (FS) return;
  firebase.initializeApp(FB_CFG);
  AUTH = firebase.auth();
  FS = firebase.firestore();
}
async function loadDays(from, to) {
  if (LOCAL) {
    const r = await fetch('/api/days?from=' + from + '&to=' + to);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    return r.json();
  }
  const snap = await FS.collection('d05Days').where('date', '>=', from).where('date', '<=', to).get();
  return snap.docs.map((d) => {
    const x = d.data();
    return { ...x, updatedAt: x.updatedAt ? x.updatedAt.toDate().toISOString() : null };
  });
}

/* Số bán từng món × từng cửa hàng: đọc d05ItemStores/{ngày} (1 doc/ngày, do sync dựng sẵn).
   Nội dung nằm ở trường `payload` dạng chuỗi JSON: { [mã món]: { name, stores: { [mã CH]:
   [số lượng, doanh thu] } } } - để chuỗi thay vì map lồng vì Firestore đánh chỉ mục từng
   khoá của map, map to sẽ vượt giới hạn chỉ mục của 1 document.
   Chỉ gọi khi người dùng bấm xem. */
async function loadItemStores(from, to) {
  if (LOCAL) {
    const r = await fetch('/api/itemstores?from=' + from + '&to=' + to);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    return r.json();
  }
  const snap = await FS.collection('d05ItemStores').where('date', '>=', from).where('date', '<=', to).get();
  return snap.docs.map((d) => d.data());
}

/* Master data cửa hàng (Region/City/AM) và target doanh thu - không phụ thuộc khoảng ngày,
   tải 1 lần khi đăng nhập xong. Ở chế độ xem trước local chỉ đọc được (không ghi qua rules). */
async function loadCollection(name) {
  if (LOCAL) {
    const r = await fetch('/api/' + name);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
    return r.json();
  }
  const snap = await FS.collection(name).get();
  return snap.docs.map((d) => {
    const x = d.data();
    return { id: d.id, ...x, updatedAt: x.updatedAt ? x.updatedAt.toDate().toISOString() : null };
  });
}

/* Gộp các ngày trong một khoảng thành bộ số cho trang. `rows` = từng dòng cửa hàng × ngày
   cho trang Data. */
/* Bỏ các chi nhánh bị tắt ở tab Chi nhánh (stores.hidden) khỏi từng ngày và trừ phần của
   chúng khỏi tổng ngày. Món / nguồn đơn / PTTT cấp ngày không tách được theo cửa hàng nên
   vẫn gồm cả chi nhánh đã tắt. */
function stripHidden(days, hidden) {
  if (!days || !hidden || !hidden.size) return days;
  return days.map((d) => {
    const stores = {}, cut = { revenue: 0, bills: 0, quantity: 0, commission: 0, n: 0 };
    for (const [id, st] of Object.entries(d.stores || {})) {
      if (!hidden.has(id)) { stores[id] = st; continue; }
      cut.revenue += st.revenue || 0; cut.bills += st.bills || 0; cut.quantity += st.quantity || 0;
      cut.commission += st.commission || 0; cut.n++;
    }
    if (!cut.n) return d;
    return {
      ...d, stores, revenue: d.revenue - cut.revenue, bills: d.bills - cut.bills, quantity: (d.quantity || 0) - cut.quantity,
      commission: (d.commission || 0) - cut.commission, storeCount: (d.storeCount || 0) - cut.n,
    };
  });
}

function summarize(days) {
  const s = {
    revenue: 0, bills: 0, quantity: 0, discount: 0, serviceFee: 0, tax: 0, shipFee: 0, commission: 0,
    stores: new Set(), byDate: {}, byStore: {}, byItem: {}, byGroup: {},
    bySource: {}, byPayment: {}, byArea: {}, rows: [], days: {}, last: null,
  };
  const addDim = (bucket, map) => {
    for (const [k, v] of Object.entries(map || {})) {
      const x = (bucket[k] ||= { name: v.name, revenue: 0, quantity: 0, bills: 0 });
      x.revenue += v.revenue; x.quantity += v.quantity; x.bills += v.bills || 0;
    }
  };
  for (const d of days) {
    s.revenue += d.revenue; s.bills += d.bills; s.quantity += d.quantity;
    s.discount += d.discount || 0; s.serviceFee += d.serviceFee || 0; s.tax += d.tax || 0;
    s.shipFee += d.shipFee || 0; s.commission += d.commission || 0;
    s.byDate[d.date] = (s.byDate[d.date] || 0) + d.revenue;
    s.days[d.date] = d;
    for (const [id, st] of Object.entries(d.stores || {})) {
      s.stores.add(id);
      const x = (s.byStore[id] ||= { id, name: st.name, revenue: 0, bills: 0, quantity: 0, commission: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0 });
      x.revenue += st.revenue; x.bills += st.bills; x.quantity += st.quantity; x.commission += st.commission || 0;
      x.etRev += (st.et && st.et.revenue) || 0; x.etBills += (st.et && st.et.bills) || 0;
      x.dRev += (st.dlv && st.dlv.revenue) || 0; x.dBills += (st.dlv && st.dlv.bills) || 0;
      s.rows.push({ date: d.date, id, name: st.name, revenue: st.revenue, bills: st.bills, quantity: st.quantity, updatedAt: d.updatedAt });
    }
    for (const it of Object.values(d.items || {})) {
      const k = it.name || '?';
      const x = (s.byItem[k] ||= { name: k, group: it.group, type: it.type, revenue: 0, quantity: 0 });
      x.revenue += it.revenue; x.quantity += it.quantity;
      const g = it.group || 'Khác';
      s.byGroup[g] = (s.byGroup[g] || 0) + it.revenue;
    }
    addDim(s.bySource, d.sources);
    addDim(s.byPayment, d.payments);
    addDim(s.byArea, d.areas);
    if (d.updatedAt && (!s.last || d.updatedAt > s.last)) s.last = d.updatedAt;
  }
  s.storeCount = s.stores.size;
  s.avgBill = s.bills ? s.revenue / s.bills : 0;
  return s;
}

/* =====================================================================
   CHUYỂN CẢNH — lấy nguyên cách làm của Cliff House
===================================================================== */
function useHlRect(activeKey, boxRef, extraDeps) {
  const [rect, setRect] = useState(null);
  const measure = useCallback(() => {
    const box = boxRef.current;
    const el = box && box.querySelector('[data-hlk="' + activeKey + '"]');
    if (!el) { setRect(null); return; }
    setRect({ top: el.offsetTop, height: el.offsetHeight });
  }, [activeKey, ...(extraDeps || [])]);
  useLayoutEffect(measure, [measure]);
  useEffect(() => {
    const r = requestAnimationFrame(measure);
    window.addEventListener('resize', measure);
    let live = true;
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (live) measure(); });
    return () => { live = false; cancelAnimationFrame(r); window.removeEventListener('resize', measure); };
  }, [measure]);
  return [rect, measure];
}

function RollSwap({ k, children }) {
  const [out, setOut] = useState(null);
  const keyRef = useRef(k);
  const nodeRef = useRef(children);
  useLayoutEffect(() => {
    if (keyRef.current === k) return;
    setOut({ k: keyRef.current, node: nodeRef.current });
    keyRef.current = k;
    const t = setTimeout(() => setOut(null), 750);
    return () => clearTimeout(t);
  }, [k]);
  useEffect(() => { nodeRef.current = children; });
  return (
    <div className="roll">
      {out && <div key={'o' + out.k} className="roll-out" aria-hidden="true">{out.node}</div>}
      <div key={'i' + k} className={out ? 'roll-in' : ''}>{children}</div>
    </div>
  );
}

/* Số chạy từ 0 lên — rót chữ số mới vào đúng khuôn chuỗi gốc để giữ dấu chấm ngăn nghìn */
function countUp(root) {
  if (!root) return;
  const jobs = [];
  root.querySelectorAll('.stat .vl').forEach(el => {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    let n;
    while ((n = w.nextNode())) {
      const src = n.nodeValue;
      if (src.includes(':')) continue;
      const m = src.match(/\d[\d.,]*\d|\d/);
      if (!m) continue;
      const tok = m[0];
      const target = parseInt(tok.replace(/\D/g, ''), 10);
      if (!target) continue;
      const lastSep = Math.max(tok.lastIndexOf('.'), tok.lastIndexOf(','));
      const tail = lastSep >= 0 ? tok.length - lastSep - 1 : 0;
      const minDigits = lastSep >= 0 && tail !== 3 ? tail + 1 : 1;
      jobs.push({ n, src, tok, at: m.index, target, minDigits, last: src });
    }
  });
  if (!jobs.length) return;
  const fmt = (j, v) => {
    let ds = String(v).padStart(j.minDigits, '0');
    let out = '';
    for (let i = j.tok.length - 1; i >= 0 && ds.length; i--) {
      const c = j.tok[i];
      if (/\d/.test(c)) { out = ds[ds.length - 1] + out; ds = ds.slice(0, -1); }
      else if (ds.length) out = c + out;
    }
    return j.src.slice(0, j.at) + out + j.src.slice(j.at + j.tok.length);
  };
  const DUR = 1000, t0 = performance.now();
  const tick = (now) => {
    const p = Math.min(1, (now - t0) / DUR);
    const e = 1 - Math.pow(1 - p, 4);
    let alive = false;
    jobs.forEach(j => {
      if (j.dead) return;
      if (j.n.nodeValue !== j.last) { j.dead = true; return; }
      j.last = p < 1 ? fmt(j, Math.round(j.target * e)) : j.src;
      j.n.nodeValue = j.last;
      if (p < 1) alive = true;
    });
    if (alive) requestAnimationFrame(tick);
  };
  jobs.forEach(j => { j.last = fmt(j, 0); j.n.nodeValue = j.last; });
  requestAnimationFrame(tick);
}

/* ===================== MẢNH GHÉP ===================== */
function Stat({ label, value, sub, icon, hero }) {
  return (
    <div className={cls('stat', hero && 'hero')}>
      <div className="lb">{icon && <span className="ic-sq">{icon}</span>}{label}</div>
      <div className="vl">{value}</div>
      {sub && <div className="dt">{sub}</div>}
    </div>
  );
}

function Delta({ cur, prev, label, bad }) {
  const p = pctDiff(cur, prev);
  if (p == null || !isFinite(p)) return <span>chưa có kỳ để so</span>;
  const up = p >= 0;
  return (
    <span>
      <span className={up !== !!bad ? 'up' : 'dn'}>{up ? <Ic.arrowU size={12} /> : <Ic.arrowD size={12} />} {Math.abs(p).toFixed(1).replace('.', ',')}%</span>
      {' '}{label}
    </span>
  );
}

const pct1 = (v) => (Number(v) || 0).toFixed(1).replace('.', ',') + '%';

/* ===================== CHỌN KHOẢNG NGÀY =====================
   Bấm ngày đầu -> rê chuột thấy trước dải ngày -> bấm ngày cuối (bấm lùi thì tự đảo lại).
   Mốc nhanh bên trái áp dụng ngay; chọn tay thì bấm "Áp dụng". Không cho chọn ngày tương lai. */
const MONTHS = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
const mShift = (ym, n) => { const d = new Date(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };

function CalMonth({ ym, a, b, hover, onPick, onHover, onPrev, onNext }) {
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7);
  const first = new Date(y, m - 1, 1).getDay();
  const lead = (first + 6) % 7; // lịch Việt bắt đầu từ thứ Hai
  const n = new Date(y, m, 0).getDate();
  const t = today();
  // Cho chọn tới hết THÁNG HIỆN TẠI dù ngày đó chưa có doanh thu - để so luỹ kế
  // hiện tại với target cả tháng.
  const maxPick = monthEnd(t);
  const lo = a && (b || hover) ? (a < (b || hover) ? a : (b || hover)) : a;
  const hi = a && (b || hover) ? (a < (b || hover) ? (b || hover) : a) : a;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(<div key={'p' + i} className="cal-pad" />);
  for (let d = 1; d <= n; d++) {
    const k = ym + '-' + pad2(d);
    cells.push(
      <button key={k} className={cls('cal-d', k === lo && 's', k === hi && 'e', lo && k > lo && k < hi && 'in', k === t && 'now')}
        disabled={k > maxPick} onClick={() => onPick(k)} onMouseEnter={() => onHover(k)}>
        <span>{d}</span>
      </button>
    );
  }
  return (
    <div className="cal">
      <div className="cal-h">
        {onPrev ? <button className="cal-nav" onClick={onPrev} aria-label="Tháng trước">‹</button> : <span style={{ width: 30 }} />}
        <span>{MONTHS[m - 1]} {y}</span>
        {onNext ? <button className="cal-nav" onClick={onNext} aria-label="Tháng sau">›</button> : <span style={{ width: 30 }} />}
      </div>
      <div className="cal-g" onMouseLeave={() => onHover(null)}>
        {['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => <div key={w} className="cal-wd">{w}</div>)}
        {cells}
      </div>
    </div>
  );
}

function DateRangePicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [a, setA] = useState(value.from);
  const [b, setB] = useState(value.to);
  const [hover, setHover] = useState(null);
  /* Tháng bên phải; bên trái luôn là tháng liền trước */
  const [view, setView] = useState(value.to.slice(0, 7));
  const box = useRef(null);

  const show = () => {
    setA(value.from); setB(value.to); setHover(null);
    setView(value.to.slice(0, 7));
    setOpen(true);
  };
  useEffect(() => {
    if (!open) return;
    const off = (e) => { if (box.current && !box.current.contains(e.target)) setOpen(false); };
    const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', off);
    document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', off); document.removeEventListener('keydown', esc); };
  }, [open]);

  const pick = (k) => {
    if (!a || b) { setA(k); setB(null); return; }
    if (k < a) { setB(a); setA(k); } else setB(k);
  };
  const apply = (r) => { onChange(r); setOpen(false); };
  const cur = presetOf(value);
  const days = dDiff(value.from, value.to) + 1;
  const canNext = view < today().slice(0, 7);

  return (
    <div className="drp-wrap" ref={box}>
      <button className={cls('drp-btn', open && 'open')} onClick={() => (open ? setOpen(false) : show())}>
        <Ic.cal size={15} />
        {rangeLabel(value)}
        <small>{cur ? PRESETS.find(p => p.k === cur).l : days + ' ngày'}</small>
      </button>
      {open && (
        <div className="drp">
          <div className="drp-pre">
            {PRESETS.map(p => <button key={p.k} className={cls(cur === p.k && 'on')} onClick={() => apply(p.r())}>{p.l}</button>)}
          </div>
          <div className="drp-cals">
            <div className="drp-months">
              <CalMonth ym={mShift(view, -1)} a={a} b={b} hover={hover} onPick={pick} onHover={setHover} onPrev={() => setView(v => mShift(v, -1))} />
              <CalMonth ym={view} a={a} b={b} hover={hover} onPick={pick} onHover={setHover} onNext={canNext ? () => setView(v => mShift(v, 1)) : null} />
            </div>
            <div className="drp-f">
              {a && b ? <span>Từ <b>{dFull(a)}</b> đến <b>{dFull(b)}</b> · {dDiff(a, b) + 1} ngày</span>
                : a ? <span>Từ <b>{dFull(a)}</b> — bấm ngày kết thúc (bấm lại cùng ngày để chọn 1 ngày)</span>
                  : <span>Bấm ngày bắt đầu</span>}
              <span style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
                <button className="btn sm" onClick={() => setOpen(false)}>Huỷ</button>
                <button className="btn sm pri" disabled={!a || !b} onClick={() => apply({ from: a, to: b })}>Áp dụng</button>
              </span>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ===================== CHỌN THÁNG / NĂM (trang Summary) =====================
   Cùng "hình dạng" onChange({from,to}) như DateRangePicker nên App.load() dùng chung,
   không phải sửa gì ở cơ chế tải cur/prev. */
function MonthYearPicker({ value, onChange }) {
  const y = +value.to.slice(0, 4), m = +value.to.slice(5, 7);
  const nowY = +today().slice(0, 4);
  const years = [];
  for (let i = nowY - 2; i <= nowY + 1; i++) years.push(i);
  const pick = (ny, nm) => {
    const from = ny + '-' + pad2(nm);
    onChange({ from: monthStart(from + '-01'), to: (monthEnd(from + '-01') > today() ? today() : monthEnd(from + '-01')) });
  };
  return (
    <div className="my-sel">
      <Ic.cal size={15} style={{ marginLeft: 6, color: 'var(--brand)' }} />
      <select value={m} onChange={(e) => pick(y, +e.target.value)}>
        {MONTHS.map((l, i) => <option key={i} value={i + 1}>{l}</option>)}
      </select>
      <select value={y} onChange={(e) => pick(+e.target.value, m)}>
        {years.map((v) => <option key={v} value={v}>Năm {v}</option>)}
      </select>
    </div>
  );
}

/* Chọn tuần: Thứ 2 -> Chủ nhật, đi từng tuần bằng hai mũi tên. Trang Weekly Report tự so
   với tuần liền trước (App.load() đã tải sẵn kỳ trước cùng độ dài — ở đây luôn là 7 ngày). */
function WeekPicker({ value, onChange }) {
  const go = (n) => { const from = dAdd(weekStart(value.from), n * 7); onChange({ from, to: weekEnd(from) }); };
  const atCurrent = dAdd(value.to, 7) > today();
  return (
    <div className="my-sel">
      <button className="cal-nav" onClick={() => go(-1)} aria-label="Tuần trước">‹</button>
      <span style={{ fontSize: 13, fontWeight: 600, padding: '0 4px', whiteSpace: 'nowrap' }}>
        {dShort(value.from)} – {dFull(value.to)}
      </span>
      <button className="cal-nav" onClick={() => go(1)} disabled={atCurrent} aria-label="Tuần sau">›</button>
    </div>
  );
}

/* =====================================================================
   BIỂU ĐỒ (ECharts)
   ---------------------------------------------------------------------
   Bảng màu chuỗi số liệu đã chạy qua bộ kiểm định mù màu: thứ tự slot chính là
   cơ chế an toàn nên GÁN THEO THỨ TỰ CỐ ĐỊNH, không xoay vòng, không chế màu
   thứ 9 - phần đuôi gộp vào "Khác". Màu bám theo thực thể (nguồn đơn / miền),
   nên lọc bớt chuỗi cũng không làm đổi màu các chuỗi còn lại.
   Mọi biểu đồ đều có nút "Bảng số" để đọc được giá trị mà không cần rê chuột.
===================================================================== */
const SERIES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
const BRAND_HEX = '#B07D2B';
const INK = { txt: '#14181C', mute: '#898781', grid: '#E1E0D9', axis: '#C3C2B7' };
const FONT = "'K2D', system-ui, -apple-system, sans-serif";
/* Chỉ 3 miền nên dùng 3 slot đầu - bộ 3 này đạt chuẩn tách màu kể cả khi so mọi
   cặp với nhau (bản đồ/bong bóng khắt khe hơn cột/đường). */
const REGION_COLOR = { 'Miền Bắc': SERIES[0], 'Miền Nam': SERIES[1], 'Miền Trung': SERIES[2], 'Chưa gán': INK.axis };
/* Bảng pastel riêng cho cơ cấu món bán - êm mắt hơn bộ SERIES rực rỡ, chỉ dùng cho treemap món. */
const PASTEL = ['#C9DCC8', '#F3D3B8', '#C6D7EA', '#EBD2E4', '#F6E4AE', '#B9D9D3', '#DCCBE8', '#F0C9C6'];

const AXIS_STYLE = {
  axisLine: { lineStyle: { color: INK.axis, width: 1 } },
  axisTick: { show: false },
  axisLabel: { color: INK.mute, fontSize: 10.5, fontFamily: FONT },
  splitLine: { lineStyle: { color: INK.grid, width: 1 } }, // hairline liền, không nét đứt
};
const TIP = {
  backgroundColor: '#fff',
  borderColor: 'rgba(20,24,28,.08)',
  borderWidth: 1,
  padding: [9, 12],
  textStyle: { color: INK.txt, fontSize: 12.5, fontFamily: FONT },
  extraCssText: 'box-shadow:0 8px 28px rgba(20,24,28,.14);border-radius:12px',
};
const ANIM = { animationDuration: 850, animationEasing: 'cubicOut', animationDelay: (i) => i * 22 };

function EChart({ option, height, onClick, deps }) {
  const box = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (!box.current || !window.echarts) return;
    inst.current = echarts.init(box.current, null, { renderer: 'canvas' });
    const ro = new ResizeObserver(() => inst.current && inst.current.resize());
    ro.observe(box.current);
    return () => { ro.disconnect(); if (inst.current) { inst.current.dispose(); inst.current = null; } };
  }, []);
  useEffect(() => { if (inst.current && option) inst.current.setOption(option, { notMerge: true }); }, [option]);
  useEffect(() => {
    const c = inst.current;
    if (!c || !onClick) return;
    c.on('click', onClick);
    return () => c.off('click', onClick);
  }, [onClick]);
  return <div ref={box} style={{ height: height || 260, width: '100%' }} />;
}

/* Bản đồ nạp 1 lần cho cả phiên rồi đăng ký với ECharts dưới tên "VN". */
let MAP_READY = false;
function useVnMap() {
  const [ready, setReady] = useState(MAP_READY);
  useEffect(() => {
    if (MAP_READY || !window.echarts) return;
    let live = true;
    fetch('/vn-provinces.json')
      .then((r) => r.json())
      .then((geo) => {
        if (!live) return;
        echarts.registerMap('VN', geo);
        MAP_READY = true;
        setReady(true);
      })
      .catch(() => { /* mất mạng thì phần bản đồ tự ẩn, các thẻ khác vẫn chạy */ });
    return () => { live = false; };
  }, []);
  return ready;
}

/* ===================== TRANG SUMMARY (dashboard tháng) =====================
   Một màn hình đọc từ trên xuống: hàng chỉ số -> bản đồ + xu hướng -> cơ cấu ->
   xếp hạng. Chỉ có MỘT hàng lọc phía trên; bấm vào bản đồ, miền hay cửa hàng là
   lọc chéo toàn trang theo cùng một lát cắt (KPI, biểu đồ và bảng số đổi cùng lúc).

   Giới hạn của dữ liệu: d05Days gộp món / nguồn đơn / PTTT cho CẢ CHUỖI theo ngày;
   chỉ doanh thu - hoá đơn - ET/D là tách được tới từng cửa hàng. Nên khi đang lọc
   theo vùng, ba thẻ cơ cấu đó gắn nhãn "toàn chuỗi" chứ không im lặng trả số sai.
===================================================================== */
const UNASSIGNED = 'Chưa gán';
/* City người dùng gán -> tên tỉnh trên bản đồ, chỉ liệt kê chỗ hai tên khác nhau. */
const CITY_TO_PROVINCE = {
  'tp.hcm': 'Thành phố Hồ Chí Minh', 'hue': 'Thừa Thiên Huế', 'nha trang': 'Khánh Hòa',
  'da lat': 'Lâm Đồng', 'bao loc': 'Lâm Đồng', 'long xuyen': 'An Giang',
  'vung tau': 'Bà Rịa - Vũng Tàu', 'phu quoc': 'Kiên Giang', 'sa pa': 'Lào Cai',
};
const provinceOf = (city) => CITY_TO_PROVINCE[noAccent(city).trim()] || city || '';

/* Một lát cắt số liệu theo bộ lọc đang bật - mọi con số trên trang đều đi qua đây. */
function sliceOf(s, meta, f) {
  const keep = (id) => {
    const m = meta[id] || {};
    if (f.region && (m.region || UNASSIGNED) !== f.region) return false;
    if (f.am && (m.am || UNASSIGNED) !== f.am) return false;
    /* city = đúng tên người dùng gán ("Đà Lạt"); prov = tên tỉnh trên bản đồ ("Lâm Đồng").
       Hai chiều khác nhau nên tách hẳn, bấm biểu đồ và bấm bản đồ không đè lên nhau. */
    if (f.city && (m.city || UNASSIGNED) !== f.city) return false;
    if (f.prov && noAccent(provinceOf(m.city)) !== noAccent(f.prov)) return false;
    if (f.store && id !== f.store) return false;
    return true;
  };
  const stores = Object.values(s.byStore || {}).filter((st) => keep(st.id));
  const t = { raw: 0, bills: 0, quantity: 0, commission: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0 };
  for (const st of stores) {
    t.raw += st.revenue; t.bills += st.bills; t.quantity += st.quantity; t.commission += st.commission || 0;
    t.etRev += st.etRev || 0; t.etBills += st.etBills || 0; t.dRev += st.dRev || 0; t.dBills += st.dBills || 0;
  }
  const byDate = {};
  for (const [date, day] of Object.entries(s.days || {})) {
    let rev = 0, comm = 0, bills = 0, etR = 0, etB = 0, dR = 0, dB = 0;
    for (const [id, st] of Object.entries(day.stores || {})) {
      if (!keep(id)) continue;
      rev += st.revenue; comm += st.commission || 0; bills += st.bills;
      etR += (st.et && st.et.revenue) || 0; etB += (st.et && st.et.bills) || 0;
      dR += (st.dlv && st.dlv.revenue) || 0; dB += (st.dlv && st.dlv.bills) || 0;
    }
    const revenue = adjRevenue(rev, comm);
    byDate[date] = {
      revenue, bills, aov: aovOf(revenue, bills),
      aovET: etB ? aovOf(etR, etB) : null,
      aovD: dB ? aovOf(dR, dB) : null,
    };
  }
  const revenue = adjRevenue(t.raw, t.commission);
  const nDays = Object.keys(byDate).filter((d) => byDate[d].revenue > 0).length;
  const nStores = stores.filter((st) => st.revenue > 0).length;
  return {
    keep, stores, byDate, revenue, tc: t.bills, quantity: t.quantity, commission: t.commission, nDays, nStores,
    aov: aovOf(revenue, t.bills),
    ads: adsOf(revenue, nDays, nStores),
    adtc: adsOf(t.bills, nDays, stores.filter((st) => st.bills > 0).length),
    /* Chưa có dữ liệu nguồn đơn thì để null -> ô chỉ số hiện "—", không đoán bừa. */
    aovET: t.etBills ? aovOf(t.etRev, t.etBills) : null,
    aovD: t.dBills ? aovOf(t.dRev, t.dBills) : null,
  };
}

/* Gộp các cửa hàng của một lát cắt theo MỘT chiều (miền / tỉnh / AM) rồi tính sẵn
   ADS - ADS target - AOV - AOV ET/D cho từng nhóm.
   nDays dùng chung cho mọi nhóm (số ngày có dữ liệu của cả lát cắt) để các cột ADS
   so được với nhau; chia theo số ngày riêng của từng nhóm thì nhóm mới mở vài ngày
   sẽ vọt lên đầu bảng dù đóng góp rất nhỏ. */
function aggDim(stores, meta, keyOf, targetById, nDays, rangeDays) {
  const agg = {};
  const slot = (k) => (agg[k] ||= {
    name: k, raw: 0, commission: 0, bills: 0, quantity: 0,
    etRev: 0, etBills: 0, dRev: 0, dBills: 0, target: 0, stores: 0, sRev: 0, sET: 0, sD: 0, tStores: 0,
  });
  for (const st of stores) {
    const x = slot(keyOf(meta[st.id] || {}) || UNASSIGNED);
    x.raw += st.revenue; x.commission += st.commission || 0; x.bills += st.bills; x.quantity += st.quantity || 0;
    x.etRev += st.etRev || 0; x.etBills += st.etBills || 0;
    x.dRev += st.dRev || 0; x.dBills += st.dBills || 0;
    x.stores++;
    if (st.revenue > 0) x.sRev++;
    if (st.etRev > 0) x.sET++;
    if (st.dRev > 0) x.sD++;
  }
  for (const [id, tg] of Object.entries(targetById || {})) {
    const x = slot(keyOf(meta[id] || {}) || UNASSIGNED);
    x.target += tg;
    if (tg > 0) x.tStores++;
  }
  return Object.values(agg).map((x) => {
    const revenue = adjRevenue(x.raw, x.commission);
    return {
      ...x, revenue,
      ads: adsOf(revenue, nDays, x.sRev),
      adsTarget: rangeDays && x.tStores ? x.target / rangeDays / x.tStores : 0,
      aov: aovOf(revenue, x.bills),
      aovET: x.etBills ? aovOf(x.etRev, x.etBills) : null,
      aovD: x.dBills ? aovOf(x.dRev, x.dBills) : null,
    };
  });
}

/* Gộp cả năm theo tháng cho biểu đồ 3 đường AOV. Đọc thẳng doc ngày (d05Days) nên
   vẫn tôn trọng bộ lọc đang bật: truyền keep() của lát cắt vào là đường vẽ theo
   đúng miền / tỉnh / AM đang chọn. */
function monthlyAov(days, keep) {
  const m = {};
  for (const d of days || []) {
    const mk = +d.date.slice(5, 7);
    const x = (m[mk] ||= { raw: 0, commission: 0, bills: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0 });
    for (const [id, st] of Object.entries(d.stores || {})) {
      if (keep && !keep(id)) continue;
      x.raw += st.revenue; x.commission += st.commission || 0; x.bills += st.bills;
      x.etRev += (st.et && st.et.revenue) || 0; x.etBills += (st.et && st.et.bills) || 0;
      x.dRev += (st.dlv && st.dlv.revenue) || 0; x.dBills += (st.dlv && st.dlv.bills) || 0;
    }
  }
  return Array.from({ length: 12 }, (_, i) => {
    const x = m[i + 1];
    if (!x || !x.bills) return { month: i + 1, aov: null, aovET: null, aovD: null, revenue: 0, bills: 0 };
    const revenue = adjRevenue(x.raw, x.commission);
    return {
      month: i + 1, revenue, bills: x.bills,
      aov: aovOf(revenue, x.bills),
      aovET: x.etBills ? aovOf(x.etRev, x.etBills) : null,
      aovD: x.dBills ? aovOf(x.dRev, x.dBills) : null,
    };
  });
}

/* Đường xu hướng tí hon trong ô chỉ số - vẽ tay, nhẹ hơn mở thêm canvas ECharts. */
function Spark({ values, color }) {
  if (!values || values.length < 3) return null;
  const hi = Math.max(...values), lo = Math.min(...values);
  const span = hi - lo || 1;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * 100, 31 - ((v - lo) / span) * 26]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  return (
    <svg className="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
      <path d={line + ' L100 34 L0 34 Z'} fill={color} opacity=".13" />
      <path d={line} fill="none" stroke={color} strokeWidth="1.7" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

      <div className="sub">{sub}</div>
      {spark && <Spark values={spark} color={sparkColor || (hero ? '#D9A23F' : BRAND_HEX)} />}
    </div>
  );
}

/* Cột ngang "thực tế vs mốc so sánh" dùng lại cho ADS theo miền / tỉnh / AM:
   một chuỗi màu thương hiệu (giá trị thật) + một chuỗi xám (mốc: target hoặc kỳ trước). */
function cmpBarOption(rows, { value, base, baseName, valueName, labelWidth = 92, fmt = unit, extra }) {
  const list = [...rows].reverse();
  return {
    ...ANIM,
    grid: { left: labelWidth + 12, right: 64, top: 24, bottom: 6 },
    tooltip: {
      ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } },
      formatter: (ps) => {
        const r = list[ps[0].dataIndex];
        const a = value(r), b = base(r), e = extra ? extra.value(r) : null;
        const d = b ? pctDiff(a, b) : null, de = e ? pctDiff(a, e) : null;
        return `<b>${r.name}</b><br/>` + ps.map((p) => `${p.marker} ${p.seriesName} <b>${p.value ? money(p.value) + ' đ' : '—'}</b>`).join('<br/>')
          + (d == null ? '' : `<br/>vs ${baseName} <b>${(d >= 0 ? '+' : '') + pct1(d)}</b>`)
          + (de == null ? '' : `<br/>vs ${extra.name} <b>${(de >= 0 ? '+' : '') + pct1(de)}</b>`);
      },
    },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 11, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'value', show: false },
    yAxis: {
      type: 'category', data: list.map((r) => r.name), ...AXIS_STYLE, axisLine: { show: false }, splitLine: { show: false },
      axisLabel: { ...AXIS_STYLE.axisLabel, color: INK.txt, fontSize: 11, width: labelWidth, overflow: 'truncate' },
    },
    series: [
      {
        /* barMaxWidth thay vì barWidth cố định: bảng ít dòng thì cột tự dày lên cho kín thẻ,
           bảng nhiều dòng thì tự mảnh lại - không còn khoảng trắng mênh mông ở giữa. */
        name: valueName, type: 'bar', barMaxWidth: 18, barGap: '25%', barCategoryGap: '32%',
        itemStyle: { color: BRAND_HEX, borderRadius: [0, 4, 4, 0] },
        label: { show: true, position: 'right', distance: 8, color: INK.txt, fontSize: 10.5, fontWeight: 600, fontFamily: FONT, formatter: (p) => fmt(p.value) },
        data: list.map((r) => Math.round(value(r))),
      },
      {
        name: baseName, type: 'bar', barMaxWidth: 18,
        itemStyle: { color: '#DCD8D3', borderRadius: [0, 4, 4, 0] },
        data: list.map((r) => Math.round(base(r))),
      },
      ...(extra ? [{
        name: extra.name, type: 'bar', barMaxWidth: 18,
        itemStyle: { color: extra.color || '#9DBCE3', borderRadius: [0, 4, 4, 0] },
        data: list.map((r) => Math.round(extra.value(r) || 0)),
      }] : []),
    ],
  };
}

/* Chiều cao thẻ cột ngang theo số dòng - các thẻ cùng một hàng dùng chung một giá trị
   (tính theo dòng nhiều nhất) nên chân thẻ vẫn thẳng hàng. */
const barCardH = (rows, perRow = 30, min = 210, max = 360) =>
  Math.max(min, Math.min(max, rows * perRow + 78));

function FilterChips({ filter, set, meta }) {
  const items = [];
  const chip = (k, label, value) => items.push(
    <span className="chip" key={k}>
      <small>{label}</small><b>{value}</b>
      <button onClick={() => set({ ...filter, [k]: null })} aria-label={'Bỏ lọc ' + label}>✕</button>
    </span>
  );
  if (filter.region) chip('region', 'Miền', filter.region);
  if (filter.prov) chip('prov', 'Tỉnh/TP', filter.prov);
  if (filter.city) chip('city', 'Tỉnh/TP', filter.city);
  if (filter.am) chip('am', 'AM', filter.am);
  if (filter.store) chip('store', 'Chi nhánh', storeShort((meta[filter.store] || {}).storeName || filter.store));
  if (!items.length) return <div className="fbar"><span className="hint">Bấm vào bản đồ, cột hay miếng bánh để lọc cả trang.</span></div>;
  return (
    <div className="fbar">
      {items}
      <button className="btn sm" onClick={() => set({})}>Bỏ tất cả bộ lọc</button>
      <span className="hint">Đang lọc — mọi chỉ số và biểu đồ bên dưới đã tính theo lát cắt này.</span>
    </div>
  );
}

/* Chọn vài món -> xem số bán của chính các món đó ở từng chi nhánh trong kỳ.
   Số món chỉ có ở ngày nạp từ Fabi (file Excel nội bộ không có món) nên thẻ ghi rõ
   đang có số của bao nhiêu ngày trong kỳ. */
function ItemStoreCard({ range, itemNames, keysByName, meta, keep, dayCount }) {
  const [sel, setSel] = useState([]);
  const [q, setQ] = useState('');
  const [rows, setRows] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [days, setDays] = useState(0);

  const shown = useMemo(() => {
    const k = noAccent(q.trim());
    return itemNames.filter((n) => !k || noAccent(n).includes(k)).slice(0, 60);
  }, [itemNames, q]);
  const toggle = (n) => setSel((x) => (x.includes(n) ? x.filter((y) => y !== n) : [...x, n]));

  const run = async () => {
    setBusy(true); setErr('');
    try {
      const docs = await loadItemStores(range.from, range.to);
      const byStore = {}, dset = new Set();
      for (const d of docs) {
        const items = d.payload ? JSON.parse(d.payload) : (d.items || {});
        for (const n of sel) {
          for (const k of keysByName[n] || []) {
            const it = items[k];
            if (!it) continue;
            for (const [id, v] of Object.entries(it.stores || {})) {
              if (!keep(id)) continue;
              const [qty, rev] = Array.isArray(v) ? v : [v.quantity, v.revenue];
              dset.add(d.date);
              const st = (byStore[id] ||= { id, name: storeShort((meta[id] || {}).storeName || id), qty: 0, revenue: 0, per: {} });
              const p = (st.per[n] ||= { qty: 0, revenue: 0 });
              p.qty += qty || 0; p.revenue += rev || 0;
              st.qty += qty || 0; st.revenue += rev || 0;
            }
          }
        }
      }
      setDays(dset.size);
      setRows(Object.values(byStore).filter((r) => r.qty).sort((a, b) => b.qty - a.qty));
    } catch (e) { setErr(e.message); setRows(null); }
    setBusy(false);
  };

  const total = (rows || []).reduce((a, r) => a + r.qty, 0);
  /* ADQ = số bán trung bình mỗi ngày, chia đều cho SỐ NGÀY CỦA CẢ KỲ (mọi chi nhánh
     cùng mẫu số) - chọn 01-23/09 thì chia 23. */
  const rangeDays = dDiff(range.from, range.to) + 1;
  const qtyOption = useMemo(() => {
    const list = rows || [];
    return {
      ...ANIM,
      grid: { left: 58, right: 58, top: 28, bottom: list.length > 6 ? 78 : 34 },
      tooltip: {
        ...TIP, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: INK.axis, width: 1 } },
        formatter: (ps) => {
          const r = list[ps[0].dataIndex];
          return `<b>${r ? r.name : ''}</b><br/>`
            + ps.map((x) => `${x.marker} ${x.seriesName} <b>${x.value == null ? '—' : money(x.value)}</b>`).join('<br/>')
            + (r ? `<br/>Doanh thu <b>${money(r.revenue)} đ</b>` : '');
        },
      },
      legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 3, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
      xAxis: {
        type: 'category', data: list.map((r) => r.name), boundaryGap: false, ...AXIS_STYLE, splitLine: { show: false },
        axisLabel: { ...AXIS_STYLE.axisLabel, interval: 0, rotate: list.length > 6 ? 40 : 0, fontSize: 10, width: 86, overflow: 'truncate' },
      },
      yAxis: [
        { type: 'value', name: 'SL', ...AXIS_STYLE, nameTextStyle: { color: INK.mute, fontSize: 10.5, fontFamily: FONT },
          axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
        { type: 'value', name: 'ADQ', ...AXIS_STYLE, nameTextStyle: { color: INK.mute, fontSize: 10.5, fontFamily: FONT },
          axisLine: { show: false }, splitLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
      ],
      series: [
        { name: 'Số lượng bán', type: 'line', smooth: 0.25, symbol: 'circle', symbolSize: 6,
          lineStyle: { width: 2.4, color: BRAND_HEX }, itemStyle: { color: BRAND_HEX },
          areaStyle: { color: 'rgba(176,125,43,.08)' }, data: list.map((r) => r.qty) },
        { name: 'ADQ · TB mỗi ngày', type: 'line', yAxisIndex: 1, smooth: 0.25, symbol: 'circle', symbolSize: 5,
          lineStyle: { width: 2, color: SERIES[0], type: 'dashed' }, itemStyle: { color: SERIES[0] },
          data: list.map((r) => +(r.qty / rangeDays).toFixed(1)) },
      ],
    };
  }, [rows, rangeDays]);

  return (
    <>
    <div className="card">
      <div className="card-h">
        <div>
          <h3>Món theo chi nhánh</h3>
          <p>Chọn món bất kỳ để xem số bán của món đó ở từng chi nhánh trong kỳ{dayCount ? ' · có số món ' + dayCount + ' ngày' : ''}</p>
        </div>
        <div className="sp">
          <button className="btn sm pri" disabled={!sel.length || busy} onClick={run}>{busy ? 'Đang đọc…' : 'Xem số bán'}</button>
        </div>
      </div>
      <div className="flt">
        <input className="inp grow" placeholder="Tìm món…" value={q} onChange={(e) => setQ(e.target.value)} />
        {sel.length ? <button className="btn sm" onClick={() => { setSel([]); setRows(null); }}>Bỏ chọn ({sel.length})</button> : null}
        <span className="hint">Món bán qua app (Excel) không có chi tiết món — chỉ những ngày nạp từ Fabi mới có số.</span>
      </div>
      <div className="itm-pick">
        {shown.map((n) => (
          <button key={n} className={cls('itm', sel.includes(n) && 'on')} onClick={() => toggle(n)}>{n}</button>
        ))}
        {!shown.length ? <span className="hint">Không có món nào khớp.</span> : null}
      </div>
      {err ? <div className="banner">{err}</div> : null}
      {rows && !rows.length ? <div className="empty">Kỳ này chưa có số món cho các món đã chọn.</div> : null}
    </div>
    {rows && rows.length ? (
      <ChartCard
        title={'Số bán theo chi nhánh — ' + sel.join(' + ')}
        sub={`Đường liền là số lượng bán cả kỳ, đường gạch là ADQ (chia đều ${rangeDays} ngày của kỳ)`}
        height={barCardH(rows.length, 14, 300, 460)}
        option={qtyOption}
        table={(
          <table>
            <thead>
              <tr><th>Chi nhánh</th>{sel.map((n) => <th key={n} className="r">{n}</th>)}
                <th className="r">Tổng SL</th><th className="r">ADQ</th><th className="r">Doanh thu</th></tr>
            </thead>
            <tbody>{rows.map((r) => (
              <tr key={r.id}>
                <td>{r.name}</td>
                {sel.map((n) => <td key={n} className="r">{r.per[n] ? money(r.per[n].qty) : '—'}</td>)}
                <td className="r">{money(r.qty)}</td>
                <td className="r">{(r.qty / rangeDays).toFixed(1)}</td>
                <td className="r">{money(r.revenue)} đ</td>
              </tr>
            ))}</tbody>
            <tfoot><tr><td>{rows.length} chi nhánh · {days} ngày có số</td>
              {sel.map((n) => <td key={n} className="r">{money(rows.reduce((a, r) => a + (r.per[n] ? r.per[n].qty : 0), 0))}</td>)}
              <td className="r">{money(total)}</td>
              <td className="r">{(total / rangeDays).toFixed(1)}</td>
              <td className="r">{money(rows.reduce((a, r) => a + r.revenue, 0))} đ</td></tr></tfoot>
          </table>
        )}
      />
    ) : null}
    </>
  );
}

   cmpLabel: nhãn kỳ so sánh hiện trong tooltip ("kỳ trước" / "tuần trước"). */

  return {
    ...ANIM,
    grid: { left: 56, right: 18, top: 28, bottom: 30 },
    tooltip: {
      ...TIP, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: INK.axis, width: 1 } },
      formatter: (ps) => `<b>${dFull(dayKeys[ps[0].dataIndex])}</b><br/>`
        + ps.map((x) => `${x.marker} ${x.seriesName} <b>${x.value == null ? '—' : money(x.value) + ' đ'}</b>`).join('<br/>'),

    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 3, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: dayKeys.map(labelOf), boundaryGap: false, ...AXIS_STYLE, splitLine: { show: false } },

}
