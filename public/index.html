/* Gộp số của MỘT zone (một AM hoặc một DM) từ bộ số đã tổng hợp:
   tổng zone + từng chi nhánh, kèm số ngày CÓ doanh thu của mỗi chi nhánh để tính ADS. */
function zoneAgg(sum, meta, dim, zone) {
  const t = { revenue: 0, bills: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0 };
  const per = {}, dayCount = {}, daySet = new Set();
  for (const [date, d] of Object.entries(sum.days || {})) {
    for (const [id, st] of Object.entries(d.stores || {})) {
      if (((meta[id] || {})[dim] || UNASSIGNED) !== zone) continue;
      const p = (per[id] ||= { id, name: storeShort((meta[id] || {}).storeName || st.name), revenue: 0, bills: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0 });
      const et = st.et || {}, dl = st.dlv || {};
      p.revenue += st.revenue; p.bills += st.bills;
      p.etRev += et.revenue || 0; p.etBills += et.bills || 0;
      p.dRev += dl.revenue || 0; p.dBills += dl.bills || 0;
      t.revenue += st.revenue; t.bills += st.bills;
      t.etRev += et.revenue || 0; t.etBills += et.bills || 0;
      t.dRev += dl.revenue || 0; t.dBills += dl.bills || 0;
      if (st.revenue > 0) { dayCount[id] = (dayCount[id] || 0) + 1; daySet.add(date); }
    }
  }
  const stores = Object.values(per).map((p) => ({
    ...p, days: dayCount[p.id] || 0,
    aov: aovOf(p.revenue, p.bills),
    aovET: p.etBills ? aovOf(p.etRev, p.etBills) : null,
    aovD: p.dBills ? aovOf(p.dRev, p.dBills) : null,
    ads: adsOf(p.revenue, dayCount[p.id] || 0, 1),
  })).sort((a, b) => b.revenue - a.revenue);
  const active = stores.filter((x) => x.revenue > 0).length;
  return {
    stores,
    total: {
      ...t, nDays: daySet.size, nStores: active,
      aov: aovOf(t.revenue, t.bills),
      aovET: t.etBills ? aovOf(t.etRev, t.etBills) : null,
      aovD: t.dBills ? aovOf(t.dRev, t.dBills) : null,
      ads: adsOf(t.revenue, daySet.size, active),
      adtc: adsOf(t.bills, daySet.size, active),
    },
  };
}

/* Mục "Zone AM/DM": chọn 1 AM hoặc 1 DM -> số của cả zone và của từng chi nhánh trong
   zone, luôn so với CÙNG KỲ THÁNG TRƯỚC, kèm bảng chi nhánh đang giảm và lý do
   (giảm do TC hay do AOV). */
function ZoneSection({ cur, mom, meta, momRange, range }) {
  const [dim, setDim] = useState('am');
  const names = useMemo(() => {
    const set = new Set();
    for (const st of Object.values(cur.byStore || {})) {
      const v = (meta[st.id] || {})[dim];
      if (v) set.add(v);
    }
    return [...set].sort((a, b) => a.localeCompare(b, 'vi'));
  }, [cur, meta, dim]);
  const [zone, setZone] = useState('');
  const pick = zone && names.includes(zone) ? zone : names[0];

  const now = useMemo(() => (pick ? zoneAgg(cur, meta, dim, pick) : null), [cur, meta, dim, pick]);
  const before = useMemo(() => (pick ? zoneAgg(mom || { days: {} }, meta, dim, pick) : null), [mom, meta, dim, pick]);
  if (!names.length) return <div className="empty">Chưa gán AM/DM cho chi nhánh nào — vào tab Chi nhánh để gán.</div>;

  const prevBy = {};
  for (const x of (before ? before.stores : [])) prevBy[x.id] = x;
  const rows = now.stores.map((r) => {
    const p = prevBy[r.id] || null;
    const g = (a, b) => (p && b ? pctDiff(a, b) : null);
    return { ...r, prev: p, gRev: g(r.revenue, p && p.revenue), gTc: g(r.bills, p && p.bills), gAov: g(r.aov, p && p.aov), gAds: g(r.ads, p && p.ads) };
  });
  const down = rows.filter((r) => r.gRev != null && r.gRev < 0)
    .map((r) => ({ ...r, cause: (r.gTc == null || r.gAov == null) ? '—' : (r.gTc <= r.gAov ? 'Giảm do TC' : 'Giảm do AOV') }))
    .sort((a, b) => a.gRev - b.gRev);

  const money2 = (v) => money(v) + ' đ';
  const cmp = { deltaLabel: 'vs cùng kỳ tháng trước', noPrevHint: 'chưa có số cùng kỳ tháng trước' };
  const delta = (g) => <td className={cls('r', g != null && (g >= 0 ? 'up' : 'dn'))}>{g == null ? '—' : (g >= 0 ? '+' : '') + pct1(g)}</td>;
  const T = now.total, P = before ? before.total : {};

  return (
    <>
      <div className="flt" style={{ border: 0, paddingLeft: 0, paddingTop: 0 }}>
        <div className="seg">
          {[['am', 'AM'], ['dm', 'DM']].map(([k, l]) => (
            <button key={k} className={cls('seg-b', dim === k && 'on')} onClick={() => { setDim(k); setZone(''); }}>{l}</button>
          ))}
        </div>
        <select className="inp" value={pick} onChange={(e) => setZone(e.target.value)}>
          {names.map((n) => <option key={n} value={n}>{n}</option>)}
        </select>
        <span className="hint">{now.stores.length} chi nhánh trong zone · so với {dFull(momRange.from)} – {dFull(momRange.to)}</span>
      </div>

      <div className="kpi-row">
        <Kpi hero label={`Doanh thu zone ${pick}`} value={unit(T.revenue)} cur={T.revenue} prev={P.revenue} {...cmp} />
        <Kpi label="TC · hoá đơn" value={unit(T.bills)} cur={T.bills} prev={P.bills} {...cmp} />
        <Kpi tint="blue" label="AOV · TB/hoá đơn" value={unit(T.aov)} cur={T.aov} prev={P.aov} {...cmp} />
        <Kpi label="ADS · TB/chi nhánh/ngày" value={unit(T.ads)} cur={T.ads} prev={P.ads} {...cmp} />
      </div>
      <div className="kpi-row">
        <Kpi label="AOV-ET · tại chỗ + mang về" value={T.aovET == null ? '—' : unit(T.aovET)} cur={T.aovET} prev={P.aovET} {...cmp} />
        <Kpi label="AOV-D · nguồn giao hàng" value={T.aovD == null ? '—' : unit(T.aovD)} cur={T.aovD} prev={P.aovD} {...cmp} />
        <Kpi label="ADTC · TC TB/chi nhánh/ngày" value={unit(T.adtc)} cur={T.adtc} prev={P.adtc} {...cmp} />
        <Kpi label="Chi nhánh đang giảm" value={`${down.length}/${now.stores.length}`}
          hint={down.length ? `sâu nhất: ${down[0].name} ${pct1(down[0].gRev)}` : 'cả zone đều tăng'} />
      </div>

      <div className="dash">
        <div className="c7">
          <ChartCard
            title="ADS từng chi nhánh" sub="Cột nâu là kỳ này, cột xám là cùng kỳ tháng trước" height={barCardH(rows.length, 30, 260, 460)}
            option={cmpBarOption(rows, {
              value: (r) => r.ads, base: (r) => (r.prev ? r.prev.ads : 0),
              valueName: 'ADS kỳ này', baseName: 'Cùng kỳ tháng trước', labelWidth: 108,
            })}
            empty={!rows.length ? 'Zone chưa có dữ liệu.' : null}
            table={(
              <table>
                <thead><tr><th>Chi nhánh</th><th className="r">Doanh thu</th><th className="r">vs CKTT</th>
                  <th className="r">TC</th><th className="r">vs CKTT</th><th className="r">AOV</th><th className="r">vs CKTT</th>
                  <th className="r">AOV-ET</th><th className="r">AOV-D</th><th className="r">ADS</th><th className="r">vs CKTT</th></tr></thead>
                <tbody>{rows.map((r) => (
                  <tr key={r.id}>
                    <td>{r.name}</td>
                    <td className="r">{money2(r.revenue)}</td>{delta(r.gRev)}
                    <td className="r">{money(r.bills)}</td>{delta(r.gTc)}
                    <td className="r">{money2(r.aov)}</td>{delta(r.gAov)}
                    <td className="r">{r.aovET == null ? '—' : money2(r.aovET)}</td>
                    <td className="r">{r.aovD == null ? '—' : money2(r.aovD)}</td>
                    <td className="r">{money2(r.ads)}</td>{delta(r.gAds)}
                  </tr>
                ))}</tbody>
              </table>
            )}
          />
        </div>
        <div className="c5">
          <div className="card" style={{ marginBottom: 0 }}>
            <div className="card-h">
              <div><h3>Chi nhánh đang giảm</h3><p>So với cùng kỳ tháng trước · nhãn chỉ ra giảm do TC hay do AOV</p></div>
            </div>
            {!down.length ? <div className="empty">Không chi nhánh nào giảm.</div> : (
              <div className="scroll-x">
                <table className="tb">
                  <thead><tr><th>Chi nhánh</th><th className="r">Doanh thu</th><th className="r">TC</th><th className="r">AOV</th><th>Nguyên nhân</th></tr></thead>
                  <tbody>{down.map((r) => (
                    <tr key={r.id}>
                      <td>{r.name}</td>
                      {delta(r.gRev)}{delta(r.gTc)}{delta(r.gAov)}
                      <td><span className={cls('tag', r.cause === 'Giảm do TC' ? 't-amber' : 't-gray')}>{r.cause}</span></td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

/* Gộp mọi số của MỘT chi nhánh trong một bộ số đã tổng hợp (summarize): tổng kỳ, từng
   ngày, từng thứ trong tuần. Số ngày = ngày CÓ doanh thu của chính chi nhánh đó. */
function storeAgg(sum, id) {
  const t = { revenue: 0, bills: 0, quantity: 0, commission: 0, etRev: 0, etBills: 0, dRev: 0, dBills: 0, nDays: 0, tcDays: 0 };
  const byDate = {}, byWd = {};
  for (const [date, d] of Object.entries(sum.days || {})) {
    const st = (d.stores || {})[id];
    if (!st) continue;
    const et = st.et || {}, dl = st.dlv || {};
    t.revenue += st.revenue || 0; t.bills += st.bills || 0; t.quantity += st.quantity || 0; t.commission += st.commission || 0;
    t.etRev += et.revenue || 0; t.etBills += et.bills || 0; t.dRev += dl.revenue || 0; t.dBills += dl.bills || 0;
    if (st.revenue > 0) t.nDays++;
    if (st.bills > 0) t.tcDays++;
    byDate[date] = {
      revenue: st.revenue || 0, bills: st.bills || 0, aov: aovOf(st.revenue, st.bills),
      aovET: et.bills ? aovOf(et.revenue, et.bills) : null, aovD: dl.bills ? aovOf(dl.revenue, dl.bills) : null,
    };
    if (st.revenue > 0) {
      const w = (byWd[new Date(date + 'T00:00:00').getDay()] ||= { revenue: 0, bills: 0, n: 0 });
      w.revenue += st.revenue; w.bills += st.bills || 0; w.n++;
    }
  }
  return {
    ...t, byDate, byWd,
    aov: aovOf(t.revenue, t.bills),
    aovET: t.etBills ? aovOf(t.etRev, t.etBills) : null,
    aovD: t.dBills ? aovOf(t.dRev, t.dBills) : null,
    ads: adsOf(t.revenue, t.nDays, 1),
    adtc: adsOf(t.bills, t.tcDays, 1),
    upt: t.bills ? t.quantity / t.bills : 0,
    etShare: t.revenue ? t.etRev / t.revenue * 100 : null,
    dShare: t.revenue ? t.dRev / t.revenue * 100 : null,
  };
}

/* Hạng doanh thu của chi nhánh trong một nhóm cửa hàng (cả chuỗi hoặc cùng AM). */
function rankOf(sum, id, keep) {
  const list = Object.values(sum.byStore || {}).filter((s) => s.revenue > 0 && (!keep || keep(s.id)))
    .sort((a, b) => b.revenue - a.revenue);
  const i = list.findIndex((s) => s.id === id);
  return i < 0 ? null : { rank: i + 1, of: list.length };
}

/* Một chỉ số theo từng ngày: kỳ này (nâu) và cùng kỳ tháng trước (xám gạch), ghép ngày
   24/09 với 24/08 bằng monthBack - không ghép theo thứ tự nên tháng ngắn/dài vẫn đúng ngày. */
function cmpDayOption(dayKeys, cur, prev, { field, name, fmt = unit, area, extra }) {
  const v = (m, k) => (m[k] && m[k][field] != null && m[k][field] !== 0 ? Math.round(m[k][field]) : null);
  return {
    ...ANIM,
    grid: { left: 56, right: 18, top: 28, bottom: 30 },
    tooltip: {
      ...TIP, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: INK.axis, width: 1 } },
      formatter: (ps) => {
        const k = dayKeys[ps[0].dataIndex], pk = monthBack(k);
        const a = v(cur, k), b = v(prev, pk), d = a != null && b ? pctDiff(a, b) : null;
        return `<b>${dFull(k)}</b> · ${wdOf(k)} <b>${a == null ? '—' : money(a)}</b><br/>`
          + `<span style="color:${INK.mute}">${dFull(pk)} · ${wdOf(pk)}</span> <b>${b == null ? '—' : money(b)}</b>`
          + (d == null ? '' : `<br/>Chênh lệch <b>${(d >= 0 ? '+' : '') + pct1(d)}</b>`);
      },
    },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 3, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: dayKeys.map(dShort), boundaryGap: false, ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: { type: 'value', scale: !area, ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: fmt } },
    series: [
      {
        name: name + ' kỳ này', type: 'line', smooth: 0.3, symbol: 'circle', symbolSize: 5, connectNulls: true,
        lineStyle: { width: 2.2, color: BRAND_HEX }, itemStyle: { color: BRAND_HEX },
        ...(area ? { areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(176,125,43,.24)' }, { offset: 1, color: 'rgba(176,125,43,.02)' }]) } } : {}),
        data: dayKeys.map((k) => v(cur, k)),
      },
      {
        name: 'Cùng kỳ tháng trước', type: 'line', smooth: 0.3, symbol: 'none', connectNulls: true,
        lineStyle: { width: 2, color: '#B9B5AE', type: 'dashed' }, itemStyle: { color: '#B9B5AE' },
        data: dayKeys.map((k) => v(prev, monthBack(k))),
      },
      ...(extra || []),
    ],
  };
}

/* Mục "Báo cáo chi nhánh": chọn 1 chi nhánh -> mọi chỉ số của chi nhánh đó, luôn so với
   CÙNG KỲ THÁNG TRƯỚC (01-24/09 so với 01-24/08). Số món đọc thêm d05ItemStores nên chỉ
   tải khi bấm, và giữ lại trong phiên để đổi chi nhánh không phải đọc lại. */
function StoreSection({ cur, mom, meta, range, momRange, targetByStore, yearDays, focus }) {
  const options = useMemo(() => Object.values(cur.byStore || {}).filter((s) => s.revenue > 0)
    .map((s) => ({ id: s.id, name: storeShort((meta[s.id] || {}).storeName || s.name), region: (meta[s.id] || {}).region || UNASSIGNED, city: (meta[s.id] || {}).city || '' }))
    .sort((a, b) => a.name.localeCompare(b.name, 'vi')), [cur, meta]);
  const top = useMemo(() => (Object.values(cur.byStore || {}).sort((a, b) => b.revenue - a.revenue)[0] || {}).id, [cur]);
  const [picked, setPicked] = useState('');
  useEffect(() => { if (focus) setPicked(focus); }, [focus]);
  const id = options.some((o) => o.id === picked) ? picked : top;
  const m = meta[id] || {};

  const now = useMemo(() => (id ? storeAgg(cur, id) : null), [cur, id]);
  const before = useMemo(() => (id ? storeAgg(mom || { days: {} }, id) : null), [mom, id]);
  const hasPrev = before && before.revenue > 0;

  const rangeDays = dDiff(range.from, range.to) + 1;
  const dayKeys = useMemo(() => {
    const out = [];
    for (let k = range.from; k <= range.to; k = dAdd(k, 1)) out.push(k);
    return out;
  }, [range.from, range.to]);

  const target = (targetByStore || {})[id] || 0;
  const achieve = target && now ? now.revenue / target * 100 : null;
  const fc = target && now ? now.ads * rangeDays / target * 100 : null;
  const sameAm = (x) => m.am && ((meta[x] || {}).am || '') === m.am;
  const rk = useMemo(() => id && {
    chain: rankOf(cur, id), chainPrev: rankOf(mom || {}, id),
    am: m.am ? rankOf(cur, id, sameAm) : null, amPrev: m.am ? rankOf(mom || {}, id, sameAm) : null,
  }, [cur, mom, id, meta]);

  /* ---- Món bán tại chi nhánh (tải khi bấm) ---- */
  const rkey = range.from + '_' + range.to;
  const [items, setItems] = useState({ key: null, cur: null, mom: null, busy: false, err: '' });
  const loadItems = async () => {
    setItems((x) => ({ ...x, busy: true, err: '' }));
    try {
      const parse = (docs) => docs.map((d) => ({ date: d.date, items: d.payload ? JSON.parse(d.payload) : (d.items || {}) }));
      const [a, b] = await Promise.all([loadItemStores(range.from, range.to), loadItemStores(momRange.from, momRange.to)]);
      setItems({ key: rkey, cur: parse(a), mom: parse(b), busy: false, err: '' });
    } catch (e) { setItems((x) => ({ ...x, busy: false, err: e.message })); }
  };
  const itemRows = useMemo(() => {
    if (items.key !== rkey || !id) return null;
    const agg = (docs, f) => {
      const out = {};
      for (const d of docs) for (const it of Object.values(d.items)) {
        const v = (it.stores || {})[id];
        if (!v) continue;
        const [q, r] = Array.isArray(v) ? v : [v.quantity, v.revenue];
        const x = (out[it.name] ||= { name: it.name, group: it.group || 'Khác', qty: 0, rev: 0, pq: 0, pr: 0 });
        x[f[0]] += q || 0; x[f[1]] += r || 0;
      }
      return out;
    };
    const a = agg(items.cur, ['qty', 'rev']), b = agg(items.mom, ['pq', 'pr']);
    for (const [k, x] of Object.entries(b)) {
      if (a[k]) { a[k].pq = x.pq; a[k].pr = x.pr; } else a[k] = { ...x, qty: 0, rev: 0 };
    }
    return Object.values(a).map((x) => ({ ...x, g: x.pq ? pctDiff(x.qty, x.pq) : null })).sort((p, q) => q.qty - p.qty);
  }, [items, rkey, id]);

  if (!options.length || !now) return <div className="empty">Kỳ này chưa có chi nhánh nào có doanh thu.</div>;

  const P = before;
  const cmp = { deltaLabel: 'vs cùng kỳ tháng trước', noPrevHint: 'chưa có số cùng kỳ tháng trước' };
  const cp = (v) => (hasPrev ? v : null);
  const money2 = (v) => money(v) + ' đ';
  const na = (v, f = money2) => (v == null ? '—' : f(v));
  const delta = (g) => <td className={cls('r', g != null && (g >= 0 ? 'up' : 'dn'))}>{g == null ? '—' : (g >= 0 ? '+' : '') + pct1(g)}</td>;
  const rankTxt = (r) => (r ? `#${r.rank}/${r.of}` : '—');

  /* Bảng so sánh đầy đủ: mỗi dòng một chỉ số. pp = so bằng điểm % thay vì % tăng trưởng. */
  const dec1 = (v) => (Number(v) || 0).toFixed(2).replace('.', ',');
  const lines = [
    ['Doanh thu', now.revenue, P.revenue, money2],
    ['Doanh thu ET · tại chỗ + mang về', now.etRev, P.etRev, money2],
    ['Doanh thu D · giao hàng', now.dRev, P.dRev, money2],
    ['Tỉ trọng giao hàng (D)', now.dShare, P.revenue ? P.dShare : null, pct1, 'pp'],
    ['Hoa hồng app', now.commission, P.commission, money2],
    ['TC · hoá đơn', now.bills, P.bills, money],
    ['TC ET', now.etBills, P.etBills, money],
    ['TC D', now.dBills, P.dBills, money],
    ['AOV chung', now.aov, P.aov, money2],
    ['AOV-ET', now.aovET, P.aovET, money2],
    ['AOV-D', now.aovD, P.aovD, money2],
    ['ADS · doanh thu TB/ngày', now.ads, P.ads, money2],
    ['ADTC · TC TB/ngày', now.adtc, P.adtc, (v) => dec1(v)],
    ['Số món bán', now.quantity, P.quantity, money],
    ['Món / hoá đơn (UPT)', now.upt, P.upt, dec1],
    ['Số ngày có bán', now.nDays, P.nDays, money],
    ['Hạng doanh thu toàn chuỗi', rk.chain && rk.chain.rank, rk.chainPrev && rk.chainPrev.rank, (v) => '#' + v, 'rank'],
    ...(m.am ? [['Hạng trong zone AM ' + m.am, rk.am && rk.am.rank, rk.amPrev && rk.amPrev.rank, (v) => '#' + v, 'rank']] : []),
  ];

  /* Cơ cấu kênh: ET / D kỳ này vs cùng kỳ */
  const chanRows = [
    { name: 'Doanh thu ET', a: now.etRev, b: P.etRev },
    { name: 'Doanh thu D', a: now.dRev, b: P.dRev },
  ];
  const chanOption = cmpBarOption(chanRows, { value: (r) => r.a, base: (r) => r.b || 0, valueName: 'Kỳ này', baseName: 'Cùng kỳ tháng trước', labelWidth: 86 });

  /* Theo thứ trong tuần: doanh thu TB mỗi ngày có bán */
  const WD_ORDER = [1, 2, 3, 4, 5, 6, 0];
  const wdAvg = (a, w) => (a.byWd[w] && a.byWd[w].n ? a.byWd[w].revenue / a.byWd[w].n : 0);
  const wdOption = {
    ...ANIM,
    grid: { left: 52, right: 12, top: 28, bottom: 26 },
    tooltip: { ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } },
      formatter: (ps) => `<b>${WD[WD_ORDER[ps[0].dataIndex]]}</b><br/>` + ps.map((p) => `${p.marker} ${p.seriesName} <b>${p.value ? money(p.value) + ' đ' : '—'}</b>`).join('<br/>') },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 11, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: WD_ORDER.map((w) => WD[w]), ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
    series: [
      { name: 'Kỳ này', type: 'bar', barMaxWidth: 18, barGap: '20%', itemStyle: { color: BRAND_HEX, borderRadius: [4, 4, 0, 0] }, data: WD_ORDER.map((w) => Math.round(wdAvg(now, w))) },
      { name: 'Cùng kỳ tháng trước', type: 'bar', barMaxWidth: 18, itemStyle: { color: '#DCD8D3', borderRadius: [4, 4, 0, 0] }, data: WD_ORDER.map((w) => Math.round(wdAvg(P, w))) },
    ],
  };

  /* 12 tháng của chi nhánh (dữ liệu cả năm đã tải nền cho Summary) */
  const year = yearDays ? monthlyAov(yearDays, (x) => x === id) : null;
  const yearOption = year && {
    ...ANIM,
    grid: { left: 52, right: 52, top: 28, bottom: 26 },
    tooltip: { ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } },
      formatter: (ps) => `<b>Tháng ${ps[0].dataIndex + 1}</b><br/>` + ps.map((p) => `${p.marker} ${p.seriesName} <b>${p.value ? money(p.value) + ' đ' : '—'}</b>`).join('<br/>') },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 11, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: year.map((r) => 'T' + r.month), ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: [
      { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
      { type: 'value', scale: true, ...AXIS_STYLE, axisLine: { show: false }, splitLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
    ],
    series: [
      { name: 'Doanh thu', type: 'bar', barMaxWidth: 22, itemStyle: { color: BRAND_HEX, borderRadius: [4, 4, 0, 0] }, data: year.map((r) => Math.round(r.revenue) || null) },
      { name: 'AOV', type: 'line', yAxisIndex: 1, smooth: 0.25, symbol: 'circle', symbolSize: 5, connectNulls: true,
        lineStyle: { width: 2, color: SERIES[0] }, itemStyle: { color: SERIES[0] }, data: year.map((r) => (r.aov == null ? null : Math.round(r.aov))) },
    ],
  };

  const dayTarget = target ? target / rangeDays : 0;
  const revDayOption = cmpDayOption(dayKeys, now.byDate, P.byDate, {
    field: 'revenue', name: 'Doanh thu', area: true,
    extra: dayTarget ? [{ name: 'Target/ngày', type: 'line', symbol: 'none', silent: true, lineStyle: { width: 1.5, type: 'dotted', color: SERIES[2] }, data: dayKeys.map(() => Math.round(dayTarget)) }] : null,
  });
  const tcDayOption = cmpDayOption(dayKeys, now.byDate, P.byDate, { field: 'bills', name: 'TC', fmt: (v) => money(v) });
  const aovDayOpt = cmpDayOption(dayKeys, now.byDate, P.byDate, { field: 'aov', name: 'AOV' });

  const byRegion = {};
  for (const o of options) (byRegion[o.region] ||= []).push(o);
  const upItems = itemRows ? itemRows.filter((r) => r.g != null && r.pq >= 10 && r.g > 0).sort((a, b) => b.g - a.g).slice(0, 5) : [];
  const dnItems = itemRows ? itemRows.filter((r) => r.g != null && r.pq >= 10 && r.g < 0).sort((a, b) => a.g - b.g).slice(0, 5) : [];
  const newItems = itemRows ? itemRows.filter((r) => !r.pq && r.qty).length : 0;
  const goneItems = itemRows ? itemRows.filter((r) => r.pq && !r.qty).length : 0;
  const itemQty = itemRows ? itemRows.reduce((a, r) => a + r.qty, 0) : 0;

  return (
    <>
      <div className="flt" style={{ border: 0, paddingLeft: 0, paddingTop: 0 }}>
        <select className="inp" value={id} onChange={(e) => setPicked(e.target.value)} style={{ minWidth: 240 }}>
          {Object.keys(byRegion).sort().map((rg) => (
            <optgroup key={rg} label={rg}>
              {byRegion[rg].map((o) => <option key={o.id} value={o.id}>{o.name}{o.city ? ' · ' + o.city : ''}</option>)}
            </optgroup>
          ))}
        </select>
        <span className="hint">
          {[m.region, m.city, m.am && 'AM ' + m.am, m.dm && 'DM ' + m.dm].filter(Boolean).join(' · ') || 'Chưa gán miền / AM'}
          {' · '}so với {dFull(momRange.from)} – {dFull(momRange.to)}
          {!hasPrev ? ' · chi nhánh chưa có số cùng kỳ tháng trước' : ''}
        </span>
      </div>

      <div className="kpi-row">
        <Kpi hero label="Doanh thu" value={unit(now.revenue)} cur={now.revenue} prev={cp(P.revenue)} {...cmp}
          spark={dayKeys.map((k) => (now.byDate[k] ? now.byDate[k].revenue : 0))} />
        <Kpi label="TC · hoá đơn" value={unit(now.bills)} cur={now.bills} prev={cp(P.bills)} {...cmp} />
        <Kpi tint="blue" label="AOV · TB/hoá đơn" value={unit(now.aov)} cur={now.aov} prev={cp(P.aov)} {...cmp} />
        <TargetTile target={target} achieve={achieve} fc={fc} label="Target chi nhánh trong kỳ" />
      </div>
      <div className="kpi-row">
        <Kpi label="ADS · doanh thu TB/ngày" value={unit(now.ads)} cur={now.ads} prev={cp(P.ads)} {...cmp} />
        <Kpi label="ADTC · TC TB/ngày" value={dec1(now.adtc)} cur={now.adtc} prev={cp(P.adtc)} {...cmp} />
        <Kpi label="AOV-ET · tại chỗ + mang về" value={na(now.aovET, unit)} cur={now.aovET} prev={cp(P.aovET)} {...cmp} />
        <Kpi label="AOV-D · nguồn giao hàng" value={na(now.aovD, unit)} cur={now.aovD} prev={cp(P.aovD)} {...cmp} />
      </div>
      <div className="kpi-row">
        <Kpi sm label="Tỉ trọng giao hàng (D)" value={na(now.dShare, pct1)}
          hint={hasPrev && P.dShare != null ? `cùng kỳ ${pct1(P.dShare)} · ${now.dShare - P.dShare >= 0 ? '+' : ''}${dec1(now.dShare - P.dShare)} điểm` : null} />
        <Kpi sm label="Món / hoá đơn (UPT)" value={dec1(now.upt)} cur={now.upt} prev={cp(P.upt)} {...cmp} />
        <Kpi sm label="Hạng doanh thu toàn chuỗi" value={rankTxt(rk.chain)}
          hint={rk.chainPrev ? `cùng kỳ ${rankTxt(rk.chainPrev)}` : 'chưa có hạng cùng kỳ'} />
        <Kpi sm label={m.am ? 'Hạng trong zone AM ' + m.am : 'Hạng trong zone AM'} value={rankTxt(rk.am)}
          hint={!m.am ? 'chưa gán AM' : rk.amPrev ? `cùng kỳ ${rankTxt(rk.amPrev)}` : 'chưa có hạng cùng kỳ'} />
      </div>

      <div className="dash">
        <div className="c8">
          <ChartCard title="Doanh thu theo ngày" sub={`Đường nâu là kỳ này, đường xám là cùng ngày tháng trước${dayTarget ? ' · chấm xanh là target/ngày' : ''}`}
            height={300} option={revDayOption}
            table={(
              <table>
                <thead><tr><th>Ngày</th><th className="r">Doanh thu</th><th>Cùng kỳ</th><th className="r">Doanh thu</th><th className="r">Chênh lệch</th></tr></thead>
                <tbody>{dayKeys.map((k) => {
                  const a = now.byDate[k], b = P.byDate[monthBack(k)];
                  return (
                    <tr key={k}><td>{dShort(k)} · {wdOf(k)}</td><td className="r">{a ? money2(a.revenue) : '—'}</td>
                      <td>{dShort(monthBack(k))} · {wdOf(monthBack(k))}</td><td className="r">{b ? money2(b.revenue) : '—'}</td>
                      {delta(a && b ? pctDiff(a.revenue, b.revenue) : null)}</tr>
                  );
                })}</tbody>
              </table>
            )} />
        </div>
        <div className="c4">
          <ChartCard title="Kênh bán ET / D" sub="Tại chỗ + mang về so với giao hàng" height={300} option={chanOption}
            table={(
              <table>
                <thead><tr><th>Kênh</th><th className="r">Kỳ này</th><th className="r">Cùng kỳ</th><th className="r">Chênh lệch</th></tr></thead>
                <tbody>{chanRows.map((r) => (
                  <tr key={r.name}><td>{r.name}</td><td className="r">{money2(r.a)}</td><td className="r">{money2(r.b)}</td>{delta(pctDiff(r.a, r.b))}</tr>
                ))}</tbody>
              </table>
            )} />
        </div>
        <div className="c6">
          <ChartCard title="TC theo ngày" sub="Số hoá đơn mỗi ngày · kỳ này vs cùng kỳ tháng trước" height={260} option={tcDayOption} />
        </div>
        <div className="c6">
          <ChartCard title="AOV theo ngày" sub="Giá trị TB mỗi hoá đơn · kỳ này vs cùng kỳ tháng trước" height={260} option={aovDayOpt} />
        </div>
        <div className="c6">
          <ChartCard title="Doanh thu TB theo thứ" sub="Trung bình mỗi ngày có bán, gom theo thứ trong tuần" height={260} option={wdOption} />
        </div>
        <div className="c6">
          <ChartCard title={`12 tháng năm ${range.from.slice(0, 4)}`} sub="Doanh thu từng tháng (cột) và AOV (đường) của chi nhánh"
            height={260} option={yearOption} empty={!year ? 'Đang tải số cả năm…' : null} />
        </div>

        <div className="c12">
          <div className="card" style={{ marginBottom: 0 }}>
            <div className="card-h">
              <div><h3>So sánh đầy đủ với cùng kỳ tháng trước</h3>
                <p>{rangeLabel(range)} so với {rangeLabel(momRange)} · tỉ trọng so bằng điểm %, hạng so bằng số bậc</p></div>
            </div>
            <div className="scroll-x">
              <table className="tb">
                <thead><tr><th>Chỉ số</th><th className="r">Kỳ này</th><th className="r">Cùng kỳ tháng trước</th><th className="r">Chênh lệch</th><th className="r">%</th></tr></thead>
                <tbody>{lines.map(([label, a, b, f, kind]) => {
                  const ok = a != null && b != null && hasPrev;
                  const diff = ok ? a - b : null;
                  /* Hạng: số nhỏ hơn là tốt hơn -> đảo dấu để "lên hạng" hiện màu xanh */
                  const good = diff == null ? null : kind === 'rank' ? diff < 0 : diff >= 0;
                  const dTxt = diff == null ? '—' : kind === 'pp' ? (diff >= 0 ? '+' : '') + dec1(diff) + ' điểm'
                    : kind === 'rank' ? (diff === 0 ? 'giữ hạng' : (diff < 0 ? 'lên ' : 'xuống ') + Math.abs(diff) + ' bậc')
                      : (diff >= 0 ? '+' : '−') + f(Math.abs(diff));
                  const g = ok && !kind ? pctDiff(a, b) : null;
                  return (
                    <tr key={label}>
                      <td>{label}</td>
                      <td className="r"><b>{a == null ? '—' : f(a)}</b></td>
                      <td className="r">{b == null || !hasPrev ? '—' : f(b)}</td>
                      <td className={cls('r', good != null && diff !== 0 && (good ? 'up' : 'dn'))}>{dTxt}</td>
                      {delta(g)}
                    </tr>
                  );
                })}</tbody>
              </table>
            </div>
          </div>
        </div>

        <div className="c12">
          <div className="card" style={{ marginBottom: 0 }}>
            <div className="card-h">
              <div><h3>Món bán tại chi nhánh</h3>
                <p>Số lượng từng món kỳ này vs cùng kỳ tháng trước · doanh thu món theo giá Fabi (gồm VAT)</p></div>
              <div className="sp">
                {items.key !== rkey && (
                  <button className="btn sm pri" disabled={items.busy} onClick={loadItems}>{items.busy ? 'Đang đọc…' : 'Xem món bán'}</button>
                )}
              </div>
            </div>
            {items.err ? <div className="banner">{items.err}</div> : null}
            {!itemRows ? <div className="empty">Bấm "Xem món bán" để đọc số món của kỳ này và cùng kỳ tháng trước (đọc một lần, đổi chi nhánh không phải tải lại).</div>
              : !itemRows.length ? <div className="empty">Chi nhánh chưa có số món trong kỳ.</div> : (
                <>
                  <div className="kpi-row" style={{ padding: '0 16px' }}>
                    <Kpi sm label="Số món khác nhau đã bán" value={money(itemRows.filter((r) => r.qty).length)}
                      hint={`${newItems} món mới · ${goneItems} món không còn bán`} />
                    <Kpi sm label="Món bán chạy nhất" value={itemRows[0].name}
                      hint={`đã bán ${money(itemRows[0].qty)} · ${pct1(itemQty ? itemRows[0].qty / itemQty * 100 : 0)} tổng SL`} />
                    <Kpi sm label="Tăng mạnh nhất" value={upItems[0] ? upItems[0].name : '—'}
                      hint={upItems[0] ? `+${pct1(upItems[0].g)} · ${money(upItems[0].pq)} → ${money(upItems[0].qty)}` : 'không món nào tăng'} />
                    <Kpi sm label="Giảm mạnh nhất" value={dnItems[0] ? dnItems[0].name : '—'}
                      hint={dnItems[0] ? `${pct1(dnItems[0].g)} · ${money(dnItems[0].pq)} → ${money(dnItems[0].qty)}` : 'không món nào giảm'} />
                  </div>
                  <div className="scroll-x" style={{ maxHeight: 460, overflowY: 'auto' }}>
                    <table className="tb">
                      <thead><tr><th>#</th><th>Món</th><th>Nhóm</th><th className="r">SL kỳ này</th><th className="r">SL cùng kỳ</th><th className="r">vs CKTT</th>
                        <th className="r">ADQ</th><th className="r">Tỉ trọng SL</th><th className="r">Doanh thu</th><th className="r">Doanh thu cùng kỳ</th></tr></thead>
                      <tbody>{itemRows.map((r, i) => (
                        <tr key={r.name}>
                          <td style={{ color: INK.mute }}>{i + 1}</td><td>{r.name}</td><td>{r.group}</td>
                          <td className="r"><b>{money(r.qty)}</b></td><td className="r">{r.pq ? money(r.pq) : '—'}</td>
                          {r.pq ? delta(r.g) : <td className="r"><span className="tag t-green">mới</span></td>}
                          <td className="r">{(r.qty / rangeDays).toFixed(1).replace('.', ',')}</td>
                          <td className="r">{pct1(itemQty ? r.qty / itemQty * 100 : 0)}</td>
                          <td className="r">{money2(r.rev)}</td><td className="r">{r.pr ? money2(r.pr) : '—'}</td>
                        </tr>
                      ))}</tbody>
                    </table>
                  </div>
                </>
              )}
          </div>
        </div>
      </div>
    </>
  );
}

function OverviewPage({ data }) {
  const { cur, prev, range, storesMeta, targets } = data;
  const [filter, setFilter] = useState({});
  const mapReady = useVnMap();

  const meta = useMemo(() => {
    const m = {};
    for (const s of storesMeta || []) m[s.id] = s;
    return m;
  }, [storesMeta]);

  const slice = useMemo(() => sliceOf(cur, meta, filter), [cur, meta, filter]);
  const sliceAll = useMemo(() => sliceOf(cur, meta, {}), [cur, meta]);
  const prevSlice = useMemo(() => sliceOf(prev, meta, filter), [prev, meta, filter]);
  // Cùng kỳ tháng trước (01-24/09 -> 01-24/08) - cột thứ 3 của các biểu đồ ADS
  const momSlice = useMemo(() => sliceOf(data.mom || { byStore: {}, days: {} }, meta, filter), [data.mom, meta, filter]);
  const geoFilter = !!(filter.region || filter.prov || filter.city || filter.am || filter.store);

  /* ---- Target của kỳ đang chọn ----
     Kỳ có thể là vài ngày hoặc vắt qua nhiều tháng, nên target mỗi tháng được chia theo
     số ngày của tháng đó nằm trong kỳ: target tháng × (số ngày trong kỳ / số ngày cả tháng). */
  const rangeDays = dDiff(range.from, range.to) + 1;
  const monthShare = useMemo(() => {
    const share = {};
    for (let k = monthStart(range.from); k <= range.to; k = dAdd(monthEnd(k), 1)) {
      const full = dDiff(monthStart(k), monthEnd(k)) + 1;
      const from = k > range.from ? k : range.from;
      const to = monthEnd(k) < range.to ? monthEnd(k) : range.to;
      if (to < from) continue;
      share[k.slice(0, 7)] = (dDiff(from, to) + 1) / full;
    }
    return share;
  }, [range.from, range.to]);
  const targetByStore = useMemo(() => {
    const m = {};
    for (const t of targets || []) {
      const p = monthShare[t.year + '-' + pad2(t.month)];
      if (!p) continue;
      m[t.storeId] = (m[t.storeId] || 0) + (t.target || 0) * p;
    }
    return m;
  }, [targets, monthShare]);
  const targetTotal = useMemo(() => Object.entries(targetByStore)
    .filter(([id]) => slice.keep(id)).reduce((a, [, v]) => a + v, 0), [targetByStore, slice]);

  const achievePct = targetTotal ? slice.revenue / targetTotal * 100 : null;
  /* FC = ADS × số chi nhánh đang có doanh thu × số ngày của kỳ (dự báo tới hết kỳ đã chọn) */
  const fcPct = targetTotal ? (slice.ads * slice.nStores * rangeDays) / targetTotal * 100 : null;

  /* ---- Chuỗi ngày trong tháng ---- */
  const dayKeys = useMemo(() => {
    const out = [];
    for (let k = range.from; k <= range.to; k = dAdd(k, 1)) out.push(k);
    return out;
  }, [range.from, range.to]);
  const dayRevenue = dayKeys.map((k) => (slice.byDate[k] ? slice.byDate[k].revenue : 0));
  const dayTarget = targetTotal ? targetTotal / rangeDays : 0;

  const toggle = useCallback((key, value) => setFilter((f) => ({ ...f, [key]: f[key] === value ? null : value })), []);
  const onRegionClick = useCallback((p) => toggle('region', p.name), [toggle]);

  /* ---- Bản đồ: chấm theo toạ độ từng chi nhánh, màu theo miền ---- */
  const mapPoints = useMemo(() => sliceAll.stores.map((st) => {
    const m = meta[st.id] || {};
    return {
      id: st.id, name: storeShort(m.storeName || st.name), region: m.region || UNASSIGNED,
      city: m.city || UNASSIGNED, lat: m.lat, lng: m.lng,
      revenue: adjRevenue(st.revenue, st.commission), bills: st.bills,
      inSlice: slice.keep(st.id),
    };
  }).filter((p) => p.lat != null && p.lng != null), [sliceAll, meta, slice]);
  const noCoords = sliceAll.stores.length - mapPoints.length;
  const maxPoint = Math.max(1, ...mapPoints.map((p) => p.revenue));
  const mapRegions = ['Miền Bắc', 'Miền Trung', 'Miền Nam', UNASSIGNED].filter((rg) => mapPoints.some((p) => p.region === rg));

  const mapOption = useMemo(() => ({
    ...ANIM,
    tooltip: {
      ...TIP, trigger: 'item',
      formatter: (p) => (p.seriesType === 'scatter'
        ? `<b>${p.data.name}</b><br/>${p.data.city} · ${p.data.region}<br/>Doanh thu <b>${money(p.data.revenue)} đ</b><br/>Hoá đơn <b>${money(p.data.bills)}</b>`
        : `<b>${p.name}</b>`),
    },
    legend: {
      bottom: 0, left: 'center', icon: 'circle', itemWidth: 9, itemHeight: 9, itemGap: 14,
      textStyle: { color: INK.mute, fontSize: 11.5, fontFamily: FONT },
      data: mapRegions,
    },
    geo: {
      /* roam:'move' chứ không phải true: bật zoom bằng con lăn thì bản đồ nuốt luôn
         thao tác cuộn trang, người xem kẹt lại giữa dashboard. Kéo để di chuyển là đủ. */
      map: 'VN', roam: 'move', zoom: 1.06, aspectScale: 0.95,
      top: 8, bottom: 34, layoutCenter: ['50%', '50%'], layoutSize: '98%',
      itemStyle: { areaColor: '#F2F0ED', borderColor: '#DFDCD7', borderWidth: 0.8 },
      emphasis: { itemStyle: { areaColor: '#EAE5DD' }, label: { show: false } },
      select: { itemStyle: { areaColor: '#F6E9CF' }, label: { show: false } },
      selectedMode: 'single',
    },
    series: mapRegions.map((rg) => ({
      name: rg, type: 'scatter', coordinateSystem: 'geo',
      data: mapPoints.filter((p) => p.region === rg).map((p) => ({
        ...p, value: [p.lng, p.lat, p.revenue],
        // Chấm ngoài lát cắt vẫn hiện (mờ) để bản đồ còn dùng được như thanh điều hướng
        itemStyle: { opacity: p.inSlice ? 0.95 : 0.2 },
      })),
      /* Sàn 10px để chấm nhỏ nhất vẫn bấm được, không phải nhắm vào một hạt bụi */
      symbolSize: (val) => 10 + Math.sqrt(val[2] / maxPoint) * 26,
      itemStyle: {
        color: REGION_COLOR[rg] || INK.axis,
        borderColor: '#fff', borderWidth: 2, // vòng nền 2px cho các chấm chồng nhau
      },
      emphasis: { scale: 1.2 },
      z: 5,
    })),
  }), [mapPoints, mapRegions, maxPoint]);

  const onMapClick = useCallback((p) => {
    if (p.seriesType === 'scatter') toggle('store', p.data.id);
    else if (p.componentType === 'geo' && p.name) toggle('prov', p.name);
  }, []);

  /* ---- Doanh thu theo ngày + mốc target/ngày ---- */
  const dailyOption = useMemo(() => ({
    ...ANIM,
    grid: { left: 52, right: 18, top: 28, bottom: 30 },
    tooltip: {
      ...TIP, trigger: 'axis',
      axisPointer: { type: 'line', lineStyle: { color: INK.axis, width: 1 } },
      formatter: (ps) => {
        const d = ps[0];
        const bills = slice.byDate[dayKeys[d.dataIndex]] ? slice.byDate[dayKeys[d.dataIndex]].bills : 0;
        return `<b>${dFull(dayKeys[d.dataIndex])}</b> · ${wdOf(dayKeys[d.dataIndex])}<br/>Doanh thu <b>${money(d.value)} đ</b><br/>Hoá đơn <b>${money(bills)}</b>`
          + (dayTarget ? `<br/>Target/ngày ${money(dayTarget)} đ` : '');
      },
    },
    legend: { show: !!dayTarget, top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 3, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: dayKeys.map(dShort), boundaryGap: false, ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
    series: [
      {
        name: 'Doanh thu', type: 'line', smooth: 0.3, symbol: 'circle', symbolSize: 8, showSymbol: false,
        lineStyle: { width: 2, color: BRAND_HEX }, itemStyle: { color: BRAND_HEX },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(176,125,43,.28)' }, { offset: 1, color: 'rgba(176,125,43,.02)' }]) },
        data: dayRevenue,
        markPoint: {
          symbol: 'circle', symbolSize: 9,
          itemStyle: { color: BRAND_HEX, borderColor: '#fff', borderWidth: 2 },
          label: { show: true, position: 'top', distance: 8, color: INK.txt, fontSize: 11, fontWeight: 700, fontFamily: FONT, formatter: (p) => unit(p.value) },
          data: [{ type: 'max', name: 'Cao nhất' }],
        },
      },
      ...(dayTarget ? [{
        name: 'Target/ngày', type: 'line', symbol: 'none', silent: true,
        lineStyle: { width: 2, type: 'dashed', color: INK.axis },
        data: dayKeys.map(() => dayTarget),
      }] : []),
    ],
  }), [dayKeys, dayRevenue, dayTarget, slice]);

  /* ---- Luỹ kế vs target ---- */
  /* ---- AOV theo ngày (thay biểu đồ luỹ kế vs nhịp target) ---- */
  const aovDayChart = useMemo(() => aovDayOption(dayKeys, slice.byDate, dShort), [dayKeys, slice]);

  /* ---- Cơ cấu theo miền ---- */
  const regionRows = useMemo(() => {
    const agg = {};
    for (const st of slice.stores) {
      const rg = (meta[st.id] || {}).region || UNASSIGNED;
      (agg[rg] ||= { name: rg, revenue: 0, bills: 0, target: 0, stores: 0 });
      agg[rg].revenue += adjRevenue(st.revenue, st.commission);
      agg[rg].bills += st.bills;
      agg[rg].stores++;
    }
    for (const [id, tg] of Object.entries(targetByStore)) {
      if (!slice.keep(id)) continue;
      const rg = (meta[id] || {}).region || UNASSIGNED;
      (agg[rg] ||= { name: rg, revenue: 0, bills: 0, target: 0, stores: 0 }).target += tg;
    }
    return Object.values(agg).sort((a, b) => b.revenue - a.revenue);
  }, [slice, meta, targetByStore]);

  const regionOption = useMemo(() => ({
    ...ANIM,
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => `<b>${p.name}</b><br/>Doanh thu <b>${money(p.value)} đ</b><br/>Tỉ trọng <b>${p.percent}%</b><br/>${p.data.stores} chi nhánh` },
    legend: { bottom: 0, left: 'center', icon: 'circle', itemWidth: 9, itemHeight: 9, textStyle: { color: INK.mute, fontSize: 11.5, fontFamily: FONT } },
    series: [{
      type: 'pie', radius: ['52%', '76%'], center: ['50%', '44%'], avoidLabelOverlap: true,
      itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 }, // khe 2px giữa các miếng
      label: { show: true, formatter: (p) => `${p.name}\n${unit(p.value)}`, color: INK.txt, fontSize: 11, fontFamily: FONT, lineHeight: 15 },
      labelLine: { length: 8, length2: 8, lineStyle: { color: INK.axis } },
      data: regionRows.map((r) => ({ name: r.name, value: Math.round(r.revenue), stores: r.stores, itemStyle: { color: REGION_COLOR[r.name] || INK.axis } })),
    }],
  }), [regionRows]);

  /* ---- Nguồn đơn (toàn chuỗi) - gộp đuôi vào "Khác", không chế thêm màu ---- */
  const sourceRows = useMemo(() => {
    const all = Object.values(cur.bySource || {}).filter((x) => x.revenue > 0).sort((a, b) => b.revenue - a.revenue);
    const top = all.slice(0, 5);
    const rest = all.slice(5);
    if (rest.length) top.push({ name: 'Khác', revenue: rest.reduce((a, x) => a + x.revenue, 0), bills: rest.reduce((a, x) => a + x.bills, 0), rest: rest.length });
    return top;
  }, [cur]);
  const sourceOption = useMemo(() => ({
    ...ANIM,
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => `<b>${p.name}</b><br/>Doanh thu <b>${money(p.value)} đ</b><br/>Tỉ trọng <b>${p.percent}%</b>` },
    legend: { bottom: 0, left: 'center', icon: 'circle', itemWidth: 9, itemHeight: 9, itemGap: 10, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    series: [{
      type: 'pie', radius: ['52%', '76%'], center: ['50%', '42%'],
      itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 },
      label: { show: true, formatter: (p) => unit(p.value), color: INK.txt, fontSize: 11, fontFamily: FONT },
      labelLine: { length: 6, length2: 8, lineStyle: { color: INK.axis } },
      data: sourceRows.map((r, i) => ({ name: r.name, value: Math.round(r.revenue), itemStyle: { color: r.name === 'Khác' ? INK.axis : SERIES[i] } })),
    }],
  }), [sourceRows]);

  /* ---- PTTT (toàn chuỗi): cột ngang vì các giá trị hay sát nhau ---- */
  const payRows = useMemo(() => Object.values(cur.byPayment || {}).filter((x) => x.revenue > 0)
    .sort((a, b) => a.revenue - b.revenue).slice(-6), [cur]);
  const payOption = useMemo(() => ({
    ...ANIM,
    grid: { left: 112, right: 58, top: 10, bottom: 8 },
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => `<b>${p.name}</b><br/>Doanh thu <b>${money(p.value)} đ</b>` },
    xAxis: { type: 'value', show: false },
    yAxis: { type: 'category', data: payRows.map((r) => r.name), ...AXIS_STYLE, axisLine: { show: false }, splitLine: { show: false },
      axisLabel: { ...AXIS_STYLE.axisLabel, color: INK.txt, fontSize: 11.5, width: 100, overflow: 'truncate' } },
    series: [{
      type: 'bar', barWidth: 13, itemStyle: { color: SERIES[0], borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', distance: 8, color: INK.txt, fontSize: 11, fontWeight: 600, fontFamily: FONT, formatter: (p) => unit(p.value) },
      data: payRows.map((r) => Math.round(r.revenue)),
    }],
  }), [payRows]);

  /* Tên món -> các khoá món trong d05Days (mã món), và số ngày trong kỳ có dữ liệu món */
  const itemNames = useMemo(() => Object.values(cur.byItem || {})
    .sort((a, b) => b.revenue - a.revenue).map((x) => x.name), [cur]);
  const keysByName = useMemo(() => {
    const m = {};
    for (const d of Object.values(cur.days || {})) {
      for (const [k, it] of Object.entries(d.items || {})) {
        const set = (m[it.name] ||= []);
        if (!set.includes(k)) set.push(k);
      }
    }
    return m;
  }, [cur]);
  const itemDayCount = useMemo(() => Object.values(cur.days || {})
    .filter((d) => d.items && Object.keys(d.items).length).length, [cur]);

  /* ---- Cây: nhóm món -> món (toàn chuỗi) ---- */
  const treeData = useMemo(() => {
    const groups = {};
    for (const it of Object.values(cur.byItem || {})) {
      if (!it.revenue) continue;
      const g = it.group || 'Khác';
      (groups[g] ||= []).push({ name: it.name, value: Math.round(it.revenue) });
    }
    return Object.entries(groups)
      .map(([g, children]) => ({
        name: g,
        value: children.reduce((a, c) => a + c.value, 0),
        children: children.sort((a, b) => b.value - a.value).slice(0, 12),
      }))
      .sort((a, b) => b.value - a.value)
      .slice(0, 8)
      .map((g, i) => ({ ...g, itemStyle: { color: PASTEL[i] } }));
  }, [cur]);
  const treeOption = useMemo(() => ({
    ...ANIM,
    tooltip: { ...TIP, formatter: (p) => `<b>${p.name}</b><br/>Doanh thu <b>${money(p.value)} đ</b>` },
    series: [{
      type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false },
      top: 6, bottom: 6, left: 6, right: 6,
      itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
      upperLabel: { show: true, height: 20, color: INK.txt, fontSize: 11, fontWeight: 700, fontFamily: FONT },
      label: { fontSize: 11, fontFamily: FONT, color: INK.txt, formatter: (p) => (p.value > 4e8 ? `${p.name}\n${unit(p.value)}` : '') },
      levels: [
        { itemStyle: { borderWidth: 0, gapWidth: 3 } },
        { colorSaturation: [0.85, 1], itemStyle: { gapWidth: 2, borderColorSaturation: 0.5 } },
      ],
      data: treeData,
    }],
  }), [treeData]);

  /* ---- Xếp hạng chi nhánh ---- */
  const storeRows = useMemo(() => slice.stores.map((st) => {
    const m = meta[st.id] || {};
    return {
      id: st.id, name: storeShort(m.storeName || st.name), region: m.region || UNASSIGNED, city: m.city || UNASSIGNED,
      am: m.am || '', revenue: adjRevenue(st.revenue, st.commission), bills: st.bills, target: targetByStore[st.id] || 0,
    };
  }).sort((a, b) => b.revenue - a.revenue), [slice, meta, targetByStore]);
  const topStores = storeRows.slice(0, 12).reverse();
  const storeOption = useMemo(() => ({
    ...ANIM,
    grid: { left: 130, right: 58, top: 8, bottom: 8 },
    tooltip: { ...TIP, trigger: 'item', formatter: (p) => {
      const r = topStores[p.dataIndex];
      return `<b>${r.name}</b><br/>${r.city} · ${r.region}<br/>Doanh thu <b>${money(r.revenue)} đ</b><br/>Hoá đơn <b>${money(r.bills)}</b>`
        + (r.target ? `<br/>Target ${money(r.target)} đ · đạt <b>${pct1(r.revenue / r.target * 100)}</b>` : '');
    } },
    xAxis: { type: 'value', show: false },
    yAxis: { type: 'category', data: topStores.map((r) => r.name), ...AXIS_STYLE, axisLine: { show: false }, splitLine: { show: false },
      axisLabel: { ...AXIS_STYLE.axisLabel, color: INK.txt, fontSize: 11, width: 118, overflow: 'truncate' } },
    series: [{
      type: 'bar', barWidth: 12, itemStyle: { color: BRAND_HEX, borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', distance: 8, color: INK.txt, fontSize: 11, fontWeight: 600, fontFamily: FONT, formatter: (p) => unit(p.value) },
      data: topStores.map((r) => Math.round(r.revenue)),
    }],
  }), [topStores]);
  const onStoreClick = useCallback((p) => { const r = topStores[p.dataIndex]; if (r) toggle('store', r.id); }, [topStores]);

  /* ---- Tăng trưởng theo chi nhánh: doanh thu tháng này so với đúng cửa hàng đó tháng trước ---- */
  const prevRevByStore = useMemo(() => {
    const m = {};
    for (const st of prevSlice.stores) m[st.id] = adjRevenue(st.revenue, st.commission);
    return m;
  }, [prevSlice]);
  const growthOf = useCallback((r) => {
    const p = prevRevByStore[r.id];
    return p ? pctDiff(r.revenue, p) : null;
  }, [prevRevByStore]);
  const onLbClick = useCallback((r) => toggle('store', r.id), [toggle]);

  /* Chỉ xếp hạng cửa hàng thật (đã gán City) - loại các mã nội bộ (PĐT/CSKH...) chưa gán Chi nhánh */
  const realStoreRows = useMemo(() => storeRows.filter((r) => r.city !== UNASSIGNED), [storeRows]);
  const top10Highest = useMemo(() => realStoreRows.slice(0, 10)
    .map((r) => ({ id: r.id, name: r.name, sub: r.city, value: unit(r.revenue), delta: growthOf(r) })), [realStoreRows, growthOf]);
  const top10Lowest = useMemo(() => [...realStoreRows].filter((r) => r.revenue > 0).sort((a, b) => a.revenue - b.revenue).slice(0, 10)
    .map((r) => ({ id: r.id, name: r.name, sub: r.city, value: unit(r.revenue), delta: growthOf(r) })), [realStoreRows, growthOf]);
  /* Tăng trưởng CHẬM nhất: xếp tăng dần nên đầu bảng là chi nhánh giảm sâu nhất */
  const top10Growth = useMemo(() => realStoreRows
    .map((r) => ({ r, growth: growthOf(r) }))
    .filter((x) => x.growth != null)
    .sort((a, b) => a.growth - b.growth)
    .slice(0, 10)
    .map(({ r, growth }) => ({ id: r.id, name: r.name, sub: r.city, value: unit(r.revenue), delta: growth })),
    [realStoreRows, growthOf]);

  /* ---- Tiến độ target theo từng chi nhánh: sắp xếp thấp -> cao để lộ ngay chi nhánh đang đuối ---- */
  const targetProgressRows = useMemo(() => storeRows
    .filter((r) => r.target > 0)
    .map((r) => ({ id: r.id, name: r.name, sub: unit(r.revenue) + ' / ' + unit(r.target) + ' đ', value: pct1(r.revenue / r.target * 100), bar: r.revenue / r.target * 100 }))
    .sort((a, b) => a.bar - b.bar), [storeRows]);

  /* ---- Nhận định nhanh: ngày cao/thấp điểm, nhịp so với target, chi nhánh đang có doanh thu ---- */
  const dayEntries = useMemo(() => dayKeys.map((k, i) => ({ k, v: dayRevenue[i] })).filter((d) => slice.byDate[d.k]), [dayKeys, dayRevenue, slice]);
  const peakDay = dayEntries.length ? dayEntries.reduce((a, b) => (b.v > a.v ? b : a)) : null;
  const slowDay = dayEntries.length > 1 ? dayEntries.reduce((a, b) => (b.v < a.v ? b : a)) : null;
  const paceExpected = targetTotal ? targetTotal / rangeDays * dayKeys.length : null;
  const pacePct = paceExpected ? (slice.revenue - paceExpected) / paceExpected * 100 : null;
  const top5Share = useMemo(() => {
    if (!slice.revenue) return null;
    const revs = slice.stores.map((st) => adjRevenue(st.revenue, st.commission)).sort((a, b) => b - a);
    return revs.slice(0, 5).reduce((a, v) => a + v, 0) / slice.revenue * 100;
  }, [slice]);
  const totalStoresMeta = (storesMeta || []).length;
  const activeStores = sliceAll.stores.length;

  /* =================== MỤC ADS ===================
     ADS target = target của kỳ chia đều cho số ngày và số chi nhánh có target, nên so
     thẳng được với ADS thực tế (doanh thu mỗi chi nhánh mỗi ngày). */
  const targetInSlice = useMemo(() => {
    const m = {};
    for (const [id, tg] of Object.entries(targetByStore)) if (slice.keep(id)) m[id] = tg;
    return m;
  }, [targetByStore, slice]);
  const targetStores = useMemo(() => Object.values(targetInSlice).filter((v) => v > 0).length, [targetInSlice]);
  const adsTarget = rangeDays && targetStores ? targetTotal / rangeDays / targetStores : 0;
  const adsGapPct = adsTarget ? (slice.ads - adsTarget) / adsTarget * 100 : null;

  /* Gộp theo 3 chiều quản trị. Kỳ trước gộp cùng cách để mỗi dòng đều so được. */
  const dims = useMemo(() => {
    const defs = [
      { k: 'region', label: 'Miền', lower: 'miền', keyOf: (m) => m.region || UNASSIGNED, width: 78, limit: 0 },
      { k: 'city', label: 'Tỉnh/TP', lower: 'tỉnh/TP', keyOf: (m) => m.city || UNASSIGNED, width: 92, limit: 10 },
      { k: 'am', label: 'AM', lower: 'AM', keyOf: (m) => m.am || UNASSIGNED, width: 92, limit: 10 },
    ];
    return defs.map((d) => {
      const prevRows = aggDim(prevSlice.stores, meta, d.keyOf, null, prevSlice.nDays, rangeDays);
      const prevBy = {};
      for (const r of prevRows) prevBy[r.name] = r;
      const momBy = {};
      for (const r of aggDim(momSlice.stores, meta, d.keyOf, null, momSlice.nDays, rangeDays)) momBy[r.name] = r;
      const rows = aggDim(slice.stores, meta, d.keyOf, targetInSlice, slice.nDays, rangeDays)
        .map((r) => ({ ...r, prev: prevBy[r.name] || null, mom: momBy[r.name] || null }))
        .sort((a, b) => b.revenue - a.revenue);
      return { ...d, rows: d.limit ? rows.slice(0, d.limit) : rows };
    });
  }, [slice, prevSlice, momSlice, meta, targetInSlice, rangeDays]);
  const dimClick = { region: 'region', city: 'city', am: 'am' };

  /* =================== MỤC AOV ===================
     Ba đường AOV / AOV-ET / AOV-D theo 12 tháng, đọc từ dữ liệu cả năm (tải nền).
     Bộ lọc đang bật cũng áp vào đây nên xem được đường của riêng một miền/tỉnh/AM. */
  const yearRows = useMemo(() => monthlyAov(data.yearDays, slice.keep), [data.yearDays, slice]);
  const yearHasData = yearRows.some((r) => r.aov != null);
  const aovYearOption = useMemo(() => {
    const line = (name, key, color, dash) => ({
      name, type: 'line', smooth: 0.25, symbol: 'circle', symbolSize: 6, connectNulls: true,
      lineStyle: { width: 2.2, color, type: dash || 'solid' }, itemStyle: { color },
      data: yearRows.map((r) => (r[key] == null ? null : Math.round(r[key]))),
    });
    return {
      ...ANIM,
      grid: { left: 56, right: 18, top: 28, bottom: 28 },
      tooltip: {
        ...TIP, trigger: 'axis', axisPointer: { type: 'line', lineStyle: { color: INK.axis, width: 1 } },
        formatter: (ps) => `<b>${MONTHS[ps[0].dataIndex]}</b><br/>` +
          ps.map((p) => `${p.marker} ${p.seriesName} <b>${p.value == null ? '—' : money(p.value) + ' đ'}</b>`).join('<br/>'),
      },
      legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 3, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
      xAxis: { type: 'category', data: MONTHS.map((m) => m.replace('Tháng ', 'T')), boundaryGap: false, ...AXIS_STYLE, splitLine: { show: false } },
      yAxis: { type: 'value', scale: true, ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
      series: [
        line('AOV chung', 'aov', BRAND_HEX),
        line('AOV-ET', 'aovET', SERIES[0], 'dashed'),
        line('AOV-D', 'aovD', SERIES[2], 'dashed'),
      ],
    };
  }, [yearRows]);

  /* AOV theo chiều: 3 cột cạnh nhau cho mỗi nhóm - thấy ngay nhóm nào sống bằng đơn giao hàng. */
  /* Tỉ trọng hoá đơn giao hàng - chỉ số "sức khoẻ kênh" đi kèm cụm AOV. */
  const dShare = slice.tc ? (slice.stores.reduce((a, st) => a + (st.dBills || 0), 0) / slice.tc) * 100 : null;
  const prevDShare = prevSlice.tc ? (prevSlice.stores.reduce((a, st) => a + (st.dBills || 0), 0) / prevSlice.tc) * 100 : null;

  /* ---- Tỉnh/TP: doanh thu vs target (nhấn mạnh 1 màu + xám, không phải 2 chuỗi đua màu) ---- */
  const cityRows = useMemo(() => {
    const agg = {};
    for (const st of slice.stores) {
      const c = (meta[st.id] || {}).city || UNASSIGNED;
      (agg[c] ||= { name: c, revenue: 0, target: 0 }).revenue += adjRevenue(st.revenue, st.commission);
    }
    for (const [id, tg] of Object.entries(targetByStore)) {
      if (!slice.keep(id)) continue;
      const c = (meta[id] || {}).city || UNASSIGNED;
      (agg[c] ||= { name: c, revenue: 0, target: 0 }).target += tg;
    }
    return Object.values(agg).sort((a, b) => b.revenue - a.revenue).slice(0, 10);
  }, [slice, meta, targetByStore]);
  const cityOption = useMemo(() => cmpBarOption(cityRows, {
    value: (r) => r.revenue, base: (r) => r.target,
    valueName: 'Doanh thu', baseName: 'Target', labelWidth: 84,
  }), [cityRows]);

  if (!cur.bills) return <div className="empty">Chưa có dữ liệu cho {rangeLabel(range)}.</div>;

  const money2 = (v) => money(v) + ' đ';
  const swatch = (c) => <i className="sw" style={{ background: c }} />;

  /* Bảng số dùng chung cho 3 thẻ ADS (miền / tỉnh / AM): mỗi dòng đều có cột so tháng trước. */
  const adsTable = (d) => (
    <table>
      <thead><tr><th>{d.label}</th><th className="r">ADS</th><th className="r">ADS target</th><th className="r">Đạt</th>
        <th className="r">ADS cùng kỳ tháng trước</th><th className="r">vs CKTT</th><th className="r">vs kỳ trước</th></tr></thead>
      <tbody>{d.rows.map((r) => {
        const g = r.prev && r.prev.ads ? pctDiff(r.ads, r.prev.ads) : null;
        const gm = r.mom && r.mom.ads ? pctDiff(r.ads, r.mom.ads) : null;
        return (
          <tr key={r.name}>
            <td>{r.name}</td>
            <td className="r">{money2(r.ads)}</td>
            <td className="r">{r.adsTarget ? money2(r.adsTarget) : '—'}</td>
            <td className="r">{r.adsTarget ? pct1(r.ads / r.adsTarget * 100) : '—'}</td>
            <td className="r">{r.mom && r.mom.ads ? money2(r.mom.ads) : '—'}</td>
            <td className={cls('r', gm != null && (gm >= 0 ? 'up' : 'dn'))}>{gm == null ? '—' : (gm >= 0 ? '+' : '') + pct1(gm)}</td>
            <td className={cls('r', g != null && (g >= 0 ? 'up' : 'dn'))}>{g == null ? '—' : (g >= 0 ? '+' : '') + pct1(g)}</td>
          </tr>
        );
      })}</tbody>
    </table>
  );

  const aovTable = (d) => (
    <table>
      <thead><tr><th>{d.label}</th><th className="r">AOV</th><th className="r">AOV-ET</th><th className="r">AOV-D</th><th className="r">vs kỳ trước</th></tr></thead>
      <tbody>{d.rows.map((r) => {
        const g = r.prev && r.prev.aov ? pctDiff(r.aov, r.prev.aov) : null;
        return (
          <tr key={r.name}>
            <td>{r.name}</td>
            <td className="r">{money2(r.aov)}</td>
            <td className="r">{r.aovET == null ? '—' : money2(r.aovET)}</td>
            <td className="r">{r.aovD == null ? '—' : money2(r.aovD)}</td>
            <td className={cls('r', g != null && (g >= 0 ? 'up' : 'dn'))}>{g == null ? '—' : (g >= 0 ? '+' : '') + pct1(g)}</td>
          </tr>
        );
      })}</tbody>
    </table>
  );

  const dimRegion = dims[0], dimCity = dims[1], dimAm = dims[2];
  const adsCardH = barCardH(Math.max(...dims.map((d) => d.rows.length)), 30);
  const adsCardH3 = barCardH(Math.max(...dims.map((d) => d.rows.length)), 40, 240, 480);
  const aovCardH = barCardH(Math.max(dimCity.rows.length, dimAm.rows.length), 32, 240, 380);

  return (
    <>
      <FilterChips filter={filter} set={setFilter} meta={meta} />

      {/* ============ 1. TỔNG QUAN ============ */}
      <Section n="1" title="Tổng quan kỳ" sub={`${rangeLabel(range)} · ${rangeDays} ngày`} />

      <div className="kpi-row">
        <Kpi hero label="Revenue" value={unit(slice.revenue)} cur={slice.revenue} prev={prevSlice.revenue}
          spark={dayRevenue} sparkColor="#F0C979" />
        <Kpi label="TC · hoá đơn" value={unit(slice.tc)} cur={slice.tc} prev={prevSlice.tc}
          spark={dayKeys.map((k) => (slice.byDate[k] ? slice.byDate[k].bills : 0))} sparkColor={SERIES[0]} />
        <Kpi label="AOV · TB/hoá đơn" value={unit(slice.aov)} cur={slice.aov} prev={prevSlice.aov}
          spark={dayKeys.map((k) => { const d = slice.byDate[k]; return d && d.bills ? d.revenue / d.bills : 0; })} sparkColor={SERIES[2]} />
        <TargetTile target={targetTotal} achieve={achievePct} fc={fcPct} />
      </div>

      <div className="insight-row">
        <Insight icon={<Ic.arrowU size={15} />} label="Ngày cao điểm"
          value={peakDay ? `${dFull(peakDay.k)} · ${unit(peakDay.v)}` : '—'} />
        <Insight icon={<Ic.arrowD size={15} />} label="Ngày thấp điểm"
          value={slowDay ? `${dFull(slowDay.k)} · ${unit(slowDay.v)}` : '—'} />
        <Insight icon={<Ic.gauge size={15} />} label={paceExpected ? 'Nhịp so với target' : 'Top 5 chi nhánh chiếm'}
          value={paceExpected != null
            ? `${pacePct >= 0 ? 'Nhanh hơn' : 'Chậm hơn'} ${pct1(Math.abs(pacePct))}`
            : (top5Share != null ? pct1(top5Share) + ' doanh thu' : '—')} />
        <Insight icon={<Ic.store size={15} />} label="Chi nhánh có doanh thu"
          value={`${activeStores}/${totalStoresMeta || activeStores}`} />
      </div>

      <div className="dash">
        <div className="c7">
          <ChartCard
            title="Doanh thu theo ngày"
            sub={`${dFull(range.from)} – ${dFull(range.to)}${dayTarget ? ' · đường gạch là target/ngày' : ''}`}
            height={320}
            option={dailyOption}
            table={(
              <table>
                <thead><tr><th>Ngày</th><th>Thứ</th><th className="r">Doanh thu</th><th className="r">Hoá đơn</th></tr></thead>
                <tbody>{dayKeys.map((k) => (
                  <tr key={k}><td>{dFull(k)}</td><td>{wdOf(k)}</td>
                    <td className="r">{money2(slice.byDate[k] ? slice.byDate[k].revenue : 0)}</td>
                    <td className="r">{money(slice.byDate[k] ? slice.byDate[k].bills : 0)}</td></tr>
                ))}</tbody>
              </table>
            )}
          />
        </div>

        <div className="c5">
          <ChartCard
            title="AOV theo ngày" sub="AOV chung / tại chỗ + mang về (ET) / giao hàng (D) từng ngày trong kỳ" height={320}
            option={aovDayChart}
            table={(
              <table>
                <thead><tr><th>Ngày</th><th className="r">AOV</th><th className="r">AOV-ET</th><th className="r">AOV-D</th><th className="r">TC</th></tr></thead>
                <tbody>{dayKeys.map((k) => { const d = slice.byDate[k] || {};
                  return <tr key={k}><td>{dFull(k)}</td>
                    <td className="r">{d.aov ? money2(d.aov) : '—'}</td>
                    <td className="r">{d.aovET == null ? '—' : money2(d.aovET)}</td>
                    <td className="r">{d.aovD == null ? '—' : money2(d.aovD)}</td>
                    <td className="r">{money(d.bills || 0)}</td></tr>;
                })}</tbody>
              </table>
            )}
          />
        </div>
      </div>

      {/* ============ 2. ADS ============ */}
      <Section n="2" title="ADS — doanh thu TB mỗi chi nhánh mỗi ngày"
        sub="ADS thực tế so với ADS target (target của kỳ chia cho số ngày và số chi nhánh có target), bóc theo miền · tỉnh/TP · AM" />

      <div className="kpi-row">
        <Kpi tint label="ADS · thực tế" value={unit(slice.ads)} cur={slice.ads} prev={prevSlice.ads}
          spark={dayRevenue} sparkColor={BRAND_HEX} />
        <Kpi label="ADS target · target/CH/ngày" value={adsTarget ? unit(adsTarget) : '—'}
          hint={adsTarget ? `${unit(targetTotal)} đ chia ${rangeDays} ngày × ${targetStores} chi nhánh` : 'chưa nạp target cho kỳ này'} />
        <Kpi tint={adsGapPct == null ? null : adsGapPct >= 0 ? 'green' : null} label="Chênh lệch ADS vs target"
          value={adsGapPct == null ? '—' : (adsGapPct >= 0 ? '+' : '') + pct1(adsGapPct)}
          hint={adsGapPct == null ? 'cần target để so' : (adsGapPct >= 0 ? 'đang vượt mốc mỗi ngày' : `còn thiếu ${unit(adsTarget - slice.ads)} đ/chi nhánh/ngày`)} />
        <Kpi label="ADTC · TC TB/chi nhánh/ngày" value={unit(slice.adtc)} cur={slice.adtc} prev={prevSlice.adtc}
          spark={dayKeys.map((k) => (slice.byDate[k] ? slice.byDate[k].bills : 0))} sparkColor={SERIES[0]} />
      </div>

      <div className="dash">
        {dims.map((d) => (
          <div className="c4" key={'ads-' + d.k}>
            <ChartCard
              title={`ADS theo ${d.lower}`}
              sub={d.limit ? `Top ${d.limit} · xám = target · xanh = cùng kỳ tháng trước` : 'Xám = ADS target · xanh = cùng kỳ tháng trước · bấm để lọc'}
              height={adsCardH3}
              option={cmpBarOption(d.rows, {
                value: (r) => r.ads, base: (r) => r.adsTarget,
                valueName: 'ADS thực tế', baseName: 'ADS target', labelWidth: d.width,
                extra: { name: 'Cùng kỳ tháng trước', value: (r) => (r.mom ? r.mom.ads : 0) },
              })}
              onClick={(p) => toggle(dimClick[d.k], d.rows[d.rows.length - 1 - p.dataIndex].name)}
              empty={!d.rows.length ? 'Chưa có dữ liệu.' : null}
              table={adsTable(d)}
            />
          </div>
        ))}
      </div>

      {/* ============ 3. AOV ============ */}
      <Section n="3" title="AOV — giá trị trung bình mỗi hoá đơn"

/* =====================================================================
   WEEKLY REPORT
   ---------------------------------------------------------------------
   Chọn 1 tuần (Thứ 2 -> Chủ nhật) bằng WeekPicker; App.load() đã tự tải kèm
   tuần liền trước cùng 7 ngày (data.prev) nên so sánh so le đúng theo thứ,
   không lệch ngày trong tuần như so nguyên khoảng ngày tuỳ ý.
===================================================================== */
function WeeklyPage({ data }) {
  const { cur, prev, range, storesMeta, targets } = data;
  const meta = useMemo(() => {
    const m = {};
    for (const st of storesMeta || []) m[st.id] = st;
    return m;
  }, [storesMeta]);

  /* Cùng bộ chỉ số với Summary (sliceOf/aggDim) nên mọi định nghĩa khớp nhau,
     chỉ khác: mọi so sánh ở đây đều là TUẦN NÀY vs TUẦN TRƯỚC. */
  const slice = useMemo(() => sliceOf(cur, meta, {}), [cur, meta]);
  const prevSlice = useMemo(() => sliceOf(prev, meta, {}), [prev, meta]);
  const wk = { deltaLabel: 'vs tuần trước', noPrevHint: 'chưa có tuần trước để so' };

  const dayKeys = useMemo(() => { const out = []; for (let k = range.from; k <= range.to; k = dAdd(k, 1)) out.push(k); return out; }, [range]);
  const prevDayKeys = useMemo(() => dayKeys.map((k) => dAdd(k, -7)), [dayKeys]);
  const curByDay = dayKeys.map((k) => (slice.byDate[k] ? slice.byDate[k].revenue : 0));
  const prevByDay = prevDayKeys.map((k) => (prevSlice.byDate[k] ? prevSlice.byDate[k].revenue : 0));
  const billsByDay = dayKeys.map((k) => (slice.byDate[k] ? slice.byDate[k].bills : 0));
  const weekDays = dayKeys.length;

  /* Target của tuần: mỗi ngày lấy target tháng chứa ngày đó chia cho số ngày của tháng. */
  const targetByStore = useMemo(() => {
    const share = {};
    for (const k of dayKeys) {
      const ym = k.slice(0, 7);
      share[ym] = (share[ym] || 0) + 1 / (dDiff(monthStart(k), monthEnd(k)) + 1);
    }
    const m = {};
    for (const t of targets || []) {
      const pShare = share[t.year + '-' + pad2(t.month)];
      if (!pShare) continue;
      m[t.storeId] = (m[t.storeId] || 0) + (t.target || 0) * pShare;
    }
    return m;
  }, [targets, dayKeys]);
  const targetTotal = useMemo(() => Object.values(targetByStore).reduce((a, v) => a + v, 0), [targetByStore]);
  const targetStores = useMemo(() => Object.values(targetByStore).filter((v) => v > 0).length, [targetByStore]);
  const achievePct = targetTotal ? slice.revenue / targetTotal * 100 : null;
  const fcPct = targetTotal ? (slice.ads * slice.nStores * weekDays) / targetTotal * 100 : null;
  const adsTarget = weekDays && targetStores ? targetTotal / weekDays / targetStores : 0;
  const adsGapPct = adsTarget ? (slice.ads - adsTarget) / adsTarget * 100 : null;
  const dayTarget = targetTotal ? targetTotal / weekDays : 0;

  /* ---- Doanh thu theo thứ: tuần này vs tuần trước, kèm mốc target/ngày ---- */
  const wdOption = useMemo(() => ({
    ...ANIM,
    grid: { left: 58, right: 18, top: 30, bottom: 28 },
    tooltip: {
      ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } },
      formatter: (ps) => `<b>${wdOf(dayKeys[ps[0].dataIndex])} · ${dFull(dayKeys[ps[0].dataIndex])}</b><br/>`
        + `${ps[0].marker} Tuần này <b>${money(curByDay[ps[0].dataIndex])} đ</b><br/>`
        + `${ps[1].marker} Tuần trước (${dFull(prevDayKeys[ps[0].dataIndex])}) <b>${money(prevByDay[ps[0].dataIndex])} đ</b>`
        + (prevByDay[ps[0].dataIndex] ? `<br/>Chênh lệch <b>${pct1(pctDiff(curByDay[ps[0].dataIndex], prevByDay[ps[0].dataIndex]))}</b>` : ''),
    },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: dayKeys.map(wdOf), ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
    series: [
      { name: 'Tuần này', type: 'bar', barGap: '18%', barMaxWidth: 26, itemStyle: { color: BRAND_HEX, borderRadius: [4, 4, 0, 0] }, data: curByDay,
        markLine: dayTarget ? { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: INK.axis, width: 1.4 },
          label: { formatter: 'Target/ngày', color: INK.mute, fontSize: 10.5, fontFamily: FONT, position: 'insideEndTop' },
          data: [{ yAxis: Math.round(dayTarget) }] } : undefined },
      { name: 'Tuần trước', type: 'bar', barMaxWidth: 26, itemStyle: { color: '#DED9D2', borderRadius: [4, 4, 0, 0] }, data: prevByDay },
    ],
  }), [dayKeys, prevDayKeys, curByDay, prevByDay, dayTarget]);

  /* ---- AOV theo ngày trong tuần (thay biểu đồ luỹ kế vs nhịp target) ---- */
  const aovDayChart = useMemo(() => aovDayOption(dayKeys, slice.byDate, wdOf), [dayKeys, slice]);

  /* ---- TC và AOV theo thứ ---- */
  const tcAovOption = useMemo(() => ({
    ...ANIM,
    grid: { left: 58, right: 58, top: 30, bottom: 28 },
    tooltip: { ...TIP, trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(20,24,28,.04)' } } },
    legend: { top: 0, right: 0, icon: 'roundRect', itemWidth: 12, itemHeight: 8, textStyle: { color: INK.mute, fontSize: 11, fontFamily: FONT } },
    xAxis: { type: 'category', data: dayKeys.map(wdOf), ...AXIS_STYLE, splitLine: { show: false } },
    yAxis: [
      { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
      { type: 'value', ...AXIS_STYLE, axisLine: { show: false }, splitLine: { show: false }, axisLabel: { ...AXIS_STYLE.axisLabel, formatter: unit } },
    ],
    series: [
      { name: 'TC', type: 'bar', barMaxWidth: 30, itemStyle: { color: SERIES[0], borderRadius: [4, 4, 0, 0] }, data: billsByDay },
      { name: 'AOV', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 7,
        lineStyle: { width: 2.4, color: SERIES[2] }, itemStyle: { color: SERIES[2] },
        data: dayKeys.map((k, i) => (billsByDay[i] ? Math.round(curByDay[i] / billsByDay[i]) : null)) },
    ],
  }), [dayKeys, curByDay, billsByDay]);

  /* ---- Ba chiều quản trị: miền / tỉnh-TP / AM ---- */
  const dims = useMemo(() => {
    const defs = [
      { k: 'region', label: 'Miền', lower: 'miền', keyOf: (m) => m.region || UNASSIGNED, width: 78, limit: 0 },
      { k: 'city', label: 'Tỉnh/TP', lower: 'tỉnh/TP', keyOf: (m) => m.city || UNASSIGNED, width: 92, limit: 10 },
      { k: 'am', label: 'AM', lower: 'AM', keyOf: (m) => m.am || UNASSIGNED, width: 92, limit: 10 },
    ];
    return defs.map((d) => {
      const prevBy = {};
      for (const r of aggDim(prevSlice.stores, meta, d.keyOf, null, prevSlice.nDays, weekDays)) prevBy[r.name] = r;
      let rows = aggDim(slice.stores, meta, d.keyOf, targetByStore, slice.nDays, weekDays)
        .map((r) => ({ ...r, prev: prevBy[r.name] || null }))
        .sort((a, b) => b.revenue - a.revenue);
      if (d.limit) rows = rows.slice(0, d.limit);
      return { ...d, rows };
    });
  }, [slice, prevSlice, meta, targetByStore, weekDays]);

  /* ---- Chi nhánh trong tuần ---- */
  const storeRows = useMemo(() => slice.stores.map((st) => {
    const m = meta[st.id] || {};
    const prevSt = prevSlice.stores.find((x) => x.id === st.id);
    return {
      id: st.id, name: storeShort(m.storeName || st.name), city: m.city || UNASSIGNED,
      revenue: st.revenue, bills: st.bills, prevRevenue: prevSt ? prevSt.revenue : null,
      growth: prevSt && prevSt.revenue ? pctDiff(st.revenue, prevSt.revenue) : null,
    };
  }).sort((a, b) => b.revenue - a.revenue), [slice, prevSlice, meta]);
  const lb = (r) => ({ id: r.id, name: r.name, sub: r.city, value: unit(r.revenue), delta: r.growth });
  const topWeekStores = useMemo(() => storeRows.slice(0, 10).map(lb), [storeRows]);
  const topWeekGrowth = useMemo(() => storeRows.filter((r) => r.growth != null)
    .sort((a, b) => b.growth - a.growth).slice(0, 10).map(lb), [storeRows]);
  const topWeekDrop = useMemo(() => storeRows.filter((r) => r.growth != null)
    .sort((a, b) => a.growth - b.growth).slice(0, 10).map(lb), [storeRows]);

        <Kpi label="AOV-D · nguồn giao hàng" value={slice.aovD == null ? '—' : unit(slice.aovD)}

        <Kpi label="Tỉ trọng hoá đơn giao hàng" value={dShare == null ? '—' : pct1(dShare)} cur={dShare} prev={prevDShare} {...wk} />
      </div>

      <div className="dash">
        <div className="c12">
          <ChartCard
            title="TC và AOV theo thứ" sub="Cột là số hoá đơn, đường là AOV — thấy ngay ngày đông khách mà giá trị đơn thấp"
            height={300}
            option={tcAovOption}

              <table>

                <tbody>{dayKeys.map((k, i) => (
                  <tr key={k}><td>{wdOf(k)}</td><td>{dFull(k)}</td>
                    <td className="r">{money(billsByDay[i])}</td>
                    <td className="r">{billsByDay[i] ? money2(curByDay[i] / billsByDay[i]) : '—'}</td>
                    <td className="r">{money2(curByDay[i])}</td></tr>
                ))}</tbody>
              </table>
            )}
          />
        </div>
        {dims.map((d) => (
          <div className="c4" key={'aov-' + d.k}>
            <ChartCard
              title={`AOV theo ${d.lower}`}
              sub={d.k === 'region' ? 'Ba chuỗi cạnh nhau' : `Top ${d.limit} theo doanh thu · ba đường AOV chung / ET / D`}
              height={aovCardH}
              option={d.k === 'region' ? aovDimOption(d.rows, d.width, 'tuần trước') : aovDimLineOption(d.rows, 'tuần trước')}
              empty={!d.rows.length ? 'Chưa có dữ liệu.' : null}
              table={aovTable(d)}
            />
          </div>
        ))}
      </div>

      {/* ============ 4. MÓN ============ */}
      <Section n="4" title="Món bán trong tuần" sub="Chọn món bất kỳ để xem số lượng bán và ADQ của món đó ở từng chi nhánh" />

      <div className="dash">
        <div className="c12">
          <ItemStoreCard range={range} itemNames={itemNames} keysByName={keysByName} meta={meta}
            keep={slice.keep} dayCount={itemDayCount} />

      </div>

      {/* ============ 5. CHI NHÁNH ============ */}
      <Section n="5" title="Chi nhánh trong tuần" sub="Doanh thu cao nhất, tăng mạnh nhất và giảm mạnh nhất — đều so với tuần trước" />

      <div className="dash">
        <div className="c4"><Leaderboard title="Top 10 doanh thu" sub="Tuần này" rows={topWeekStores} /></div>
        <div className="c4"><Leaderboard title="Top 10 tăng mạnh nhất" sub="So với cùng chi nhánh tuần trước" rows={topWeekGrowth} /></div>
        <div className="c4"><Leaderboard title="Top 10 giảm mạnh nhất" sub="So với cùng chi nhánh tuần trước" rows={topWeekDrop} /></div>

      <CSSection cur={cur} cmpSales={prev} range={range} cmpRange={{ from: dAdd(range.from, -7), to: dAdd(range.to, -7) }} cmpLabel="tuần trước"
        storesMeta={storesMeta} csStoreMap={data.csStoreMap}

  );
}
