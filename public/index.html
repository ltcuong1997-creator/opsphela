/* Thanh tiến trình các mục của trang (Summary, Weekly…): đọc các đầu mục .sec đang có
   trên trang nên thêm/bớt mục là thanh tự đổi theo. Bấm -> cuộn mượt tới mục đó; cuộn tay
   -> mục đang xem tự sáng. sig đổi (đổi trang / đổi kỳ) là đọc lại danh sách mục. */
function SecNav({ sig }) {
  const [secs, setSecs] = useState([]);
  const [active, setActive] = useState(0);
  const [prog, setProg] = useState(0);
  const box = useRef(null), track = useRef(null), lock = useRef(0);

  useEffect(() => {
    const read = () => setSecs([...document.querySelectorAll('.page .sec')].map((el) => ({
      id: el.id, n: el.querySelector('.sec-n') ? el.querySelector('.sec-n').textContent : '', label: el.dataset.nav || '',
    })));
    // Trang mới đang chạy hiệu ứng chuyển nên đọc sau một nhịp
    const t = setTimeout(read, 260);
    return () => clearTimeout(t);
  }, [sig]);

  /* Chiều cao phần đang dính ở trên (topbar + thanh này) - mục được cuộn tới nằm ngay dưới nó.
     Màn hẹp topbar không dính nên chỉ tính thanh này. */
  const offset = () => {
    const top = document.querySelector('.topbar');
    const topH = top && getComputedStyle(top).position === 'sticky' ? top.offsetHeight : 0;
    return topH + (box.current ? box.current.offsetHeight : 0) + 10;
  };

  useEffect(() => {
    if (!secs.length) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const max = document.documentElement.scrollHeight - innerHeight;
        setProg(max > 0 ? Math.min(1, scrollY / max) : 0);
        if (Date.now() < lock.current) return; // đang cuộn tới mục vừa bấm - giữ nguyên mục đó
        const y = offset() + 40;
        let i = 0;
        secs.forEach((s, k) => { const el = document.getElementById(s.id); if (el && el.getBoundingClientRect().top <= y) i = k; });
        if (max > 0 && scrollY >= max - 4) i = secs.length - 1; // chạm đáy: mục cuối
        setActive(i);
      });
    };
    onScroll();
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', onScroll);
    return () => { cancelAnimationFrame(raf); removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); };
  }, [secs]);

  // Giữ nút đang sáng luôn nằm trong khung khi thanh dài hơn màn hình
  useEffect(() => {
    const t = track.current, b = t && t.children[active * 2];
    if (b) t.scrollTo({ left: b.offsetLeft - (t.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
  }, [active, secs]);

  const go = (i) => {
    const el = document.getElementById(secs[i].id);
    if (!el) return;
    setActive(i);
    lock.current = Date.now() + 900;
    scrollTo({ top: el.getBoundingClientRect().top + scrollY - offset(), behavior: 'smooth' });
  };

  if (secs.length < 2) return null;
  return (
    <nav className="secnav" ref={box} aria-label="Các mục báo cáo">
      <div className="sn-track" ref={track}>
        {secs.map((s, i) => (
          <React.Fragment key={s.id}>
            {i > 0 && <span className={cls('sn-ln', i <= active && 'done')} />}
            <button className={cls('sn-i', i === active ? 'on' : i < active && 'done')} onClick={() => go(i)}
              aria-current={i === active ? 'true' : undefined}>
              <b>{s.n}</b>{s.label}
            </button>
          </React.Fragment>
        ))}
      </div>
      <div className="sn-bar" style={{ transform: 'scaleX(' + prog + ')' }} />
    </nav>
  );
}

function App() {
  const [user, setUser] = useState(LOCAL ? { email: 'localhost' } : undefined);
  const [page, setPage] = useState('overview');
  const [shown, setShown] = useState('overview');
  const [leaving, setLeaving] = useState(false);
  const [navMin, setNavMin] = useState(true);
  /* Trang mặc định (Summary) dùng MonthYearPicker nên range khởi tạo phải là cả tháng này,
     không phải preset "Hôm nay" của DateRangePicker (2 bộ chọn khác kiểu, chung 1 state range). */
  const [range, setRange] = useState(() => ({ from: monthStart(today()), to: today() }));
  const [raw, setRaw] = useState(null); // { range, docs } - chưa bỏ chi nhánh đang tắt
  const [fresh, hideFresh] = useNewVersion();
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  /* Master data (Chi nhánh + Target) - không phụ thuộc range, tải song song 1 lần */
  const [storesMeta, setStoresMeta] = useState([]);
  const [targets, setTargets] = useState([]);
  const [lists, setLists] = useState(null); // config/lists: { am: [...], city: [...] }
  const [csCfg, setCsCfg] = useState({ map: {}, coverage: null }); // config/csStoreMap, config/csCoverage
  const [metaBusy, setMetaBusy] = useState(false);
  const [yearData, setYearData] = useState({ year: null, days: null, busy: false });

  useEffect(() => {
    if (LOCAL) return;
    try { bootCloud(); } catch (e) { setErr(e.message); return; }
    return AUTH.onAuthStateChanged(u => setUser(u || null));
  }, []);

  /* Tải kỳ đang chọn + kỳ liền trước cùng độ dài (để so %) trong một lần đọc */
  const load = useCallback(async () => {
    const len = dDiff(range.from, range.to) + 1;
    const prevRange = { from: dAdd(range.from, -len), to: dAdd(range.from, -1) };
    setBusy(true); setErr('');
    try {
      const momRange = { from: monthBack(range.from), to: monthBack(range.to) };
      // Cùng kỳ tháng trước: nằm ngoài khoảng đang tải nếu kỳ ngắn -> tải riêng 1 lần.
      // Tải riêng cùng kỳ tháng trước trừ khi nó nằm TRỌN trong khoảng đang tải -
      // chồng lấn một phần mà dùng tạm thì thiếu ngày, so ra sai lệch.
      const inside = momRange.from >= prevRange.from && momRange.to <= range.to;
      const [docs, momDocs] = await Promise.all([
        loadDays(prevRange.from, range.to),
        inside ? Promise.resolve(null) : loadDays(momRange.from, momRange.to),
      ]);
      setRaw({ range, docs, momRange, momDocs });
    } catch (e) { setErr(e.message); }
    setBusy(false);
  }, [range]);
  useEffect(() => { if (user) load(); }, [user, load]);

  const hiddenIds = useMemo(() => new Set((storesMeta || []).filter((m) => m.hidden).map((m) => m.id)), [storesMeta]);
  const data = useMemo(() => {
    if (!raw) return null;
    const docs = stripHidden(raw.docs, hiddenIds);
    const mr = raw.momRange;
    const momSrc = raw.momDocs ? stripHidden(raw.momDocs, hiddenIds) : docs;
    return {
      range: raw.range, preset: presetOf(raw.range),
      cur: summarize(docs.filter(d => d.date >= raw.range.from)),
      prev: summarize(docs.filter(d => d.date < raw.range.from)),
      // Cùng kỳ tháng trước - dùng cho mục "Zone AM/DM"
      mom: summarize(momSrc.filter(d => d.date >= mr.from && d.date <= mr.to)),
      momRange: mr,
    };
  }, [raw, hiddenIds]);

  const loadMeta = useCallback(async () => {
    try {
      const [s, t, c] = await Promise.all([loadCollection('stores'), loadCollection('targets'), loadCollection('config').catch(() => [])]);
      setStoresMeta(s); setTargets(t);
      setLists(c.find((x) => x.id === 'lists') || null);
      const sm = c.find((x) => x.id === 'csStoreMap'), cv = c.find((x) => x.id === 'csCoverage');
      setCsCfg({ map: (sm && sm.map) || {}, coverage: cv || null });
    } catch (e) { setErr(e.message); }
  }, []);
  useEffect(() => { if (user) loadMeta(); }, [user, loadMeta]);

  /* Dữ liệu CẢ NĂM cho biểu đồ 3 đường AOV theo tháng. Tải nền sau khi trang đã hiện
     (một lần cho mỗi năm, giữ lại trong phiên) nên không chặn phần còn lại của báo cáo;
     lỗi thì chỉ thẻ AOV năm trống, các thẻ khác vẫn chạy. */
  const yearOf = +range.from.slice(0, 4);
  useEffect(() => {
    if (!user || !PAGES.find(x => x.k === page && x.usesYear)) return;
    if (yearData.year === yearOf && yearData.days) return;
    let live = true;
    setYearData({ year: yearOf, days: null, busy: true });
    const to = yearOf + '-12-31';
    loadDays(yearOf + '-01-01', to > today() ? today() : to)
      .then((docs) => { if (live) setYearData({ year: yearOf, days: docs, busy: false }); })
      .catch(() => { if (live) setYearData({ year: yearOf, days: [], busy: false }); });
    return () => { live = false; };
  }, [user, page, yearOf]);

  const saveStores = useCallback(async (list, newLists) => {
    if (LOCAL || (!list.length && !newLists)) return;
    setMetaBusy(true);
    try {
      const batch = FS.batch();
      for (const s of list) {
        const doc = {
          storeId: s.storeId, storeName: s.storeName || '', region: s.region || '', city: s.city || '', am: s.am || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        };
        // Chỉ đụng tới toạ độ khi người dùng thật sự sửa ô đó (null = xoá toạ độ)
        if ('lat' in s) { doc.lat = s.lat; doc.lng = s.lng; }
        if ('hidden' in s) doc.hidden = s.hidden;
        batch.set(FS.collection('stores').doc(s.storeId), doc, { merge: true });
      }
      if (newLists) {
        batch.set(FS.collection('config').doc('lists'), {
          am: newLists.am, city: newLists.city, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      }
      await batch.commit();
      await loadMeta();
    } catch (e) { setErr(e.message); }
    setMetaBusy(false);
  }, [loadMeta]);

  const saveTargets = useCallback(async (list) => {
    if (LOCAL || !list.length) return;
    setMetaBusy(true);
    try {
      // Firestore giới hạn 500 thao tác mỗi batch - bảng target cả năm dễ vượt, chia 400
      for (let i = 0; i < list.length; i += 400) {
        const batch = FS.batch();
        for (const t of list.slice(i, i + 400)) {
          const id = t.year + '-' + pad2(t.month) + '_' + t.storeId;
          batch.set(FS.collection('targets').doc(id), {
            year: t.year, month: t.month, storeId: t.storeId, storeName: t.storeName || '', target: t.target || 0,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          }, { merge: true });
        }
        await batch.commit();
      }
      await loadMeta();
    } catch (e) { setErr(e.message); }
    setMetaBusy(false);
  }, [loadMeta]);

  /* Trang theo tuần: nắn range về đúng tuần (Thứ 2 -> Chủ nhật) cho WeekPicker khớp dữ liệu. */
  useEffect(() => {
    const p = PAGES.find(x => x.k === page);
    // Sang trang tuần mà range đang là khoảng tuỳ ý (trang khác dùng DateRangePicker)
    // thì nắn về trọn tuần chứa ngày bắt đầu, cho WeekPicker và dữ liệu khớp nhau.
    if (p && p.usesWeek && (range.from !== weekStart(range.from) || range.to !== weekEnd(range.from))) {
      const from = weekStart(range.from);
      setRange({ from, to: weekEnd(from) });
    }
  }, [page]);

  useEffect(() => {
    if (page === shown) { setLeaving(false); return; }
    setLeaving(true);
    const t = setTimeout(() => { setShown(page); setLeaving(false); }, 220);
    return () => clearTimeout(t);
  }, [page, shown]);

  useEffect(() => {
    const t = setTimeout(() => countUp(document.querySelector('.page')), 60);
    return () => clearTimeout(t);
  }, [shown, data]);

  if (user === undefined) return <Splash title={BRAND.name} sub="Đang tải…" />;
  if (!user) return <Login />;

  const cur = PAGES.find(p => p.k === shown);
  const Body = cur.C;

  return (
    <div className={cls('shell', navMin && 'nav-min')}>
      <Nav page={page} go={setPage} user={user} min={navMin} onToggle={() => setNavMin(v => !v)} onOut={() => AUTH.signOut()} />
      <div className="main">
        <div className="topbar">
          <div style={{ minWidth: 0 }}>
            <RollSwap k={shown}>
              <h1>{cur.t[0]}</h1>
              {cur.t[1] && <div className="sub">{cur.t[1]}</div>}
            </RollSwap>
          </div>
          <div className="top-right">
            {LOCAL && <span className="tag t-amber">XEM TRƯỚC</span>}
            {cur.usesMonth && <MonthYearPicker value={range} onChange={setRange} />}
            {cur.usesRange && <DateRangePicker value={range} onChange={setRange} />}
            {cur.usesWeek && <WeekPicker value={range} onChange={setRange} />}
            {(cur.usesMonth || cur.usesRange || cur.usesWeek) && (
              <button className="top-date" onClick={load} title="Tải lại">
                {busy ? 'Đang tải…' : data && data.cur.last ? 'Cập nhật ' + stamp(data.cur.last) : 'Chưa có dữ liệu'}
              </button>
            )}
          </div>
        </div>
        <SecNav sig={shown + (data ? data.range.from + data.range.to : '') + (leaving ? '_' : '')} />
        {/* key gồm cả khoảng ngày: đổi kỳ là các thẻ bung lại và số chạy lại từ 0 */}
        <div key={shown + (data ? data.range.from + data.range.to : '')} className={cls('page', leaving && 'leaving')}>
          {err ? <div className="banner"><b>Không tải được dữ liệu:</b>&nbsp;{err}</div>
            : (cur.usesMonth || cur.usesRange || cur.usesWeek) && !data ? <div className="empty">Đang tải số liệu…</div>
              : <Body data={{ ...data, storesMeta, targets, saveStores, saveTargets, metaBusy, lists, reload: load, reloadMeta: loadMeta, goPage: setPage, csStoreMap: csCfg.map, csCoverage: csCfg.coverage,
                yearDays: yearData.year === yearOf ? stripHidden(yearData.days, hiddenIds) : null, yearBusy: yearData.busy }} />}
        </div>
      </div>
      {fresh && <UpdateBar onClose={hideFresh} />}
      <div className="mob-bar">
        {PAGES.map(p => (
          <button key={p.k} className={cls(page === p.k && 'on')} onClick={() => setPage(p.k)}>
            <p.ic size={19} /><span>{p.s}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
const boot = document.getElementById('boot');
if (boot) boot.remove();
</script>

<script>
/* ---------------------------------------------------------------
   Bộ nạp: dịch JSX bằng Babel ngay trong trình duyệt rồi chạy.
   File này nhỏ nên dịch xong trong khoảng một phần mười giây —
   không cần npm, không cần build, sửa file là F5 thấy liền.
   Dịch hỏng thì in lỗi ra giữa màn hình chứ không để trang trắng.
--------------------------------------------------------------- */
(function () {
  var show = function (title, detail) {
    var b = document.getElementById('boot');
    if (!b) { console.error(title, detail); return; }
    b.innerHTML =
      '<div style="max-width:720px;padding:24px;font-family:system-ui,sans-serif">'
      + '<div style="font-size:15px;font-weight:700;color:#C4443C;margin-bottom:8px">' + title + '</div>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#5C6572;line-height:1.6;margin:0">'
      + String(detail).replace(/[<>&]/g, function (c) { return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]; })
      + '</pre></div>';
  };
  if (!window.React || !window.ReactDOM) return show('Không tải được React', 'Máy đang không có mạng, hoặc cdn.jsdelivr.net bị chặn. App cần mạng ở lần tải đầu.');
  if (!window.Babel) return show('Không tải được Babel', 'Máy đang không có mạng, hoặc cdn.jsdelivr.net bị chặn.');
  var src = document.getElementById('src').textContent;
  var code;
  try {
    code = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], sourceType: 'script' }).code;
  } catch (e) {
    return show('Lỗi cú pháp trong mã nguồn', e.message);
  }
  try {
    (0, eval)(code);
  } catch (e) {
    return show('Lỗi khi chạy app', (e && e.stack) || e);
  }
})();
</script>
